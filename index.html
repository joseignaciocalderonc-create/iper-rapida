<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#16202b">
<title>IPER Rápida</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f3f1ec; --card:#ffffff; --ink:#16202b; --muted:#66707c; --line:#e2ded6;
    --brand:#16202b; --accent:#e8590c; --accent-ink:#ffffff;
    --tol:#3f9b4a; --mod:#d9a400; --imp:#e8740c; --int:#d0342c;
    --tol-bg:#e5f3e3; --mod-bg:#fdf4cf; --imp-bg:#fde6d2; --int-bg:#fadbd8;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:12px 16px 0}
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;letter-spacing:.3px;font-size:18px;display:flex;align-items:center;gap:8px}
  .logo i{display:inline-block;width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent) 50%,#ffd43b 50%)}
  .demo{font-size:11px;background:#ffd43b;color:#16202b;border-radius:99px;padding:2px 8px;font-weight:700}
  nav{display:flex;gap:4px;margin-top:10px}
  nav button{flex:1;background:none;border:0;color:#aeb8c4;font:inherit;font-size:13.5px;font-weight:600;padding:10px 2px;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:#fff;border-color:var(--accent)}
  nav .cnt{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:4px}
  main{padding:14px 14px 110px;max-width:680px;margin:0 auto}
  h2{font-size:19px;margin:6px 0 4px} h3{font-size:15px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px}
  input[type=text],input[type=email],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:#fbfaf7;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);background:#fff}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:10px} .row>*{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink)}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost{background:none;color:var(--accent);padding:10px;width:auto}
  .btn:disabled{opacity:.5}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(243,241,236,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:15}
  .bar .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
  .steps{display:flex;gap:6px;margin:4px 0 14px}
  .steps span{flex:1;height:5px;border-radius:9px;background:var(--line)} .steps span.on{background:var(--accent)}
  .toggle{display:flex;background:#fbfaf7;border:1px solid var(--line);border-radius:10px;padding:3px}
  .toggle button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:inherit;font-weight:600;color:var(--muted)}
  .toggle button.on{background:var(--brand);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#ddd}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph b{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
  .addph{aspect-ratio:1;border:2px dashed #c9c3b8;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;background:#fbfaf7}
  .risk{border-left:5px solid var(--line)}
  .risk .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .code{font-weight:800;font-size:13px;background:var(--brand);color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .fam{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:700}
  .rname{font-weight:700;margin:2px 0}
  .just{font-size:12.5px;color:var(--muted);margin-top:6px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#eef1f5;color:#3c4a5a;margin-right:4px}
  .pc{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:8px}
  .pc label{margin-top:0}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:#fbfaf7;padding:9px 0;font:inherit;font-weight:700;color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--brand);color:#fff}
  .vep{min-width:76px;text-align:center;border-radius:10px;padding:5px 6px;font-weight:800;line-height:1.1}
  .vep small{display:block;font-size:10.5px;font-weight:700}
  .Tolerable{background:var(--tol-bg);color:var(--tol)} .Moderado{background:var(--mod-bg);color:#8a6a00}
  .Importante{background:var(--imp-bg);color:#a84c00} .Intolerable{background:var(--int-bg);color:var(--int)}
  .bl-Tolerable{border-left-color:var(--tol)} .bl-Moderado{border-left-color:var(--mod)} .bl-Importante{border-left-color:var(--imp)} .bl-Intolerable{border-left-color:var(--int)}
  .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
  .ctrl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctrl ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
  .note{background:#fff8e6;border:1px solid #f1dfa9;border-radius:12px;padding:10px 12px;font-size:13px;color:#6b5400}
  .empty{text-align:center;color:var(--muted);padding:34px 10px}
  .sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .overlay{position:fixed;inset:0;background:rgba(22,32,43,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.on{display:flex}
  .box{background:#fff;border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center}
  .spin{width:38px;height:38px;border:4px solid #eee;border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .sheet{position:fixed;inset:0;background:rgba(22,32,43,.55);z-index:40;display:none;align-items:flex-end}
  .sheet.on{display:flex}
  .sheet .pane{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 30px}
  .crit{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
  .crit td,.crit th{border:1px solid var(--line);padding:7px;vertical-align:top;text-align:left}
  .crit th{background:var(--brand);color:#fff}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;display:none}
  .toast.on{display:block}
  .muted{color:var(--muted);font-size:13px}
  .hidden{display:none!important}
  .lbl{display:flex;align-items:center;justify-content:space-between}
  .mic{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
  .mic.rec{background:var(--int);color:#fff;border-color:var(--int);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .confirm{background:#fff4e5;border:1px solid #f3c58a;border-radius:10px;padding:10px;margin:8px 0;font-size:13.5px}
  .confirm .row{margin-top:8px}
  .confirm .btn{padding:9px;font-size:13.5px}
  .rules{font-size:12.5px;color:#8a4b00;background:#fff1e0;border-radius:8px;padding:6px 9px;margin-top:8px}
  .legal{font-size:12px;color:var(--muted);margin-top:6px}
  .prot{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#e7effa;color:#1f4e79;margin:4px 4px 0 0}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .acts .chip{font-weight:600}
  .st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px}
  .st-Borrador,.st-Pendiente{background:#eef1f5;color:#3c4a5a} .st-Revisada,.st-Implementada{background:#e7effa;color:#1f4e79}
  .st-Validada,.st-Verificada{background:var(--tol-bg);color:var(--tol)} .st-alerta{background:var(--int-bg);color:var(--int)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .tile b{display:block;font-size:26px;line-height:1.1} .tile span{font-size:12px;color:var(--muted)}
  .tile.alerta b{color:var(--int)}
  .barra{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .barra .n{width:84px} .barra .t{flex:1;height:14px;background:#f0ede6;border-radius:99px;overflow:hidden}
  .barra .t i{display:block;height:100%} .barra .v{width:28px;text-align:right;font-weight:700}
  .banner{background:#e7effa;border:1px solid #c5d7ef;color:#1f4e79;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
</style>

</head>
<body>
<header>
  <div class="top">
    <div class="logo"><i></i>IPER Rápida <span id="demoTag" class="demo hidden">DEMO</span></div>
    <button class="btn ghost" style="color:#ffd43b" onclick="abrirCriterios()">Criterios</button>
  </div>
  <nav>
    <button data-tab="nueva" class="on">Nueva</button>
    <button data-tab="matriz">Matriz</button>
    <button data-tab="medidas">Medidas</button>
    <button data-tab="panel">Panel</button>
    <button data-tab="ajustes">Ajustes</button>
  </nav>
</header>

<main id="app"></main>
<div class="bar" id="bar"><div class="in" id="barIn"></div></div>
<input type="file" id="fotoEvid" accept="image/*" class="hidden">

<div class="overlay" id="busy"><div class="box"><div class="spin"></div><b id="busyTxt">Analizando…</b><div class="muted" id="busySub" style="margin-top:6px"></div></div></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)cerrarSheet()"><div class="pane" id="sheetPane"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= Constantes ======================= */
var FAM = {SEG:'Seguridad y emergencias', HIG:'Higiénicos', PSI:'Psicosociales', MUS:'Músculo esqueléticos'};
var JER = ['Eliminación','Sustitución','Control de ingeniería','Control administrativo','EPP'];
var JER_FUERTES = ['Eliminación','Sustitución','Control de ingeniería'];
var SENS = [['fisica','Discapacidad física'],['cognitiva','Discapacidad cognitiva'],['sensorial','Discapacidad sensorial'],
            ['embarazada','Trabajadora embarazada'],['lactancia','Trabajadora en lactancia'],['mayores','Adultos mayores'],['adolescentes','Adolescentes']];
var MEDIDAS_RAPIDAS = ['Charla de inducción','Capacitación','Procedimiento de trabajo seguro','Entrega de EPP','Señalización',
  'Orden y aseo','Mantención de equipos','Pausas activas','Protector solar','Extintores','Supervisión','Protocolo MINSAL aplicado'];
var CEAL_OPC = ['Sin evaluar','Riesgo bajo','Riesgo medio','Riesgo alto'];

/* ======================= Estado ======================= */
var cfg = Object.assign({empresa:'', centro:'', respEjec:'', respSeg:'', aprobador:'', email:'', apiUrl:'', token:'', ceal:{}}, load('iper_cfg', {}));
var SRV = {catalogo:[], listas:{}, avisosActivos:false, version:0};
var CATMAP = {};
var tab = 'nueva', paso = 1;
var cur = Object.assign(nuevaTarea(), load('iper_borrador', {}));
var datos = {tareas:null, medidas:null, panel:null};
var filtroMed = 'abiertas';
var EN_APPS_SCRIPT = !!(window.google && google.script && google.script.run);

function modo(){ return EN_APPS_SCRIPT ? 'gas' : (cfg.apiUrl && cfg.token ? 'api' : 'demo'); }
function nuevaTarea(){ return {id:null, proceso:'',puesto:'',tarea:'',lugar:'',rutinaria:true,hombres:'',mujeres:'',otros:'',
  sensibles:{}, fotos:[], medidasTexto:'', riesgos:[], observacionesFoto:'', medidasActuales:[], analizado:false}; }
function load(k,d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function guardarBorrador(){ var c = Object.assign({}, cur); delete c.fotos; save('iper_borrador', c); }
function cealCentro(){ return (cfg.ceal||{})[cfg.centro] || 'Sin evaluar'; }

/* ======================= Servidor ======================= */
function run(fn){
  var args = Array.prototype.slice.call(arguments,1);
  var m = modo();
  if (m==='demo') return Promise.resolve().then(function(){ return Demo[fn].apply(null,args); });
  if (m==='api'){
    if (!navigator.onLine) return Promise.reject(new Error('Sin conexión a internet.'));
    return fetch(cfg.apiUrl.trim(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({fn:fn, args:args, token:cfg.token.trim()}), redirect:'follow'})
    .then(function(r){ return r.text(); }, function(){ throw new Error('No se pudo conectar con el servidor. Revisa la URL en Ajustes.'); })
    .then(function(t){
      var j; try{ j = JSON.parse(t); }catch(e){ throw new Error('El servidor no respondió bien. Revisa la URL y que el acceso sea "Cualquier persona".'); }
      if (!j.ok) throw new Error(j.error); return j.data;
    });
  }
  return new Promise(function(ok,ko){
    google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ ko(e && e.message ? e : new Error(String(e))); })[fn].apply(null,args);
  });
}

/* ======================= Utilidades ======================= */
function nivel(v){ return v<=2?'Tolerable':v<=4?'Moderado':v<=8?'Importante':'Intolerable'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(id){ return document.getElementById(id); }
function toast(t,ms){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove('on');},ms||4000); }
function busy(on,t,s){ $('busy').classList.toggle('on',!!on); if(t)$('busyTxt').textContent=t; $('busySub').textContent=s||''; }
function fecha(s){ if(!s) return ''; var d=new Date(s); return isNaN(d)?'':('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear(); }
function seg(name, val, idx){
  return '<div class="seg">'+[1,2,4].map(function(n){
    return '<button data-seg="'+name+'" data-i="'+idx+'" data-v="'+n+'" class="'+(val==n?'on':'')+'">'+n+'</button>'; }).join('')+'</div>';
}
function vepBox(p,c){ var v=p*c, n=nivel(v); return '<div class="vep '+n+'">'+v+'<small>'+n+'</small></div>'; }
function micBtn(target){ return SR ? '<button class="mic" data-mic="'+target+'">🎤 Dictar</button>' : ''; }
var _conf = {};
function confirmar(msg){ var now=Date.now(); if(_conf[msg] && now-_conf[msg]<3500){ delete _conf[msg]; return true; } _conf[msg]=now; toast(msg+' Toca de nuevo para confirmar.'); return false; }

/** Mismas reglas fijas que aplica el servidor. */
function aplicarReglas(r){
  var notas=[];
  if (r.pRes>r.p) r.pRes=r.p; if (r.cRes>r.c) r.cRes=r.c;
  var fuerte = JER_FUERTES.indexOf(r.jerarquia)>=0;
  if (!fuerte && r.cRes<r.c){ r.cRes=r.c; notas.push('La consecuencia no baja con medidas administrativas o EPP.'); }
  if (!fuerte){ var minP = r.p===4?2:1; if (r.pRes<minP){ r.pRes=minP; notas.push('Con medidas administrativas o EPP la probabilidad baja como máximo un nivel.'); } }
  if (r.p*r.c>=16 && r.pRes*r.cRes<=2){ r.pRes = r.cRes>=4?1:(r.cRes===2?2:4); notas.push('Un riesgo Intolerable no puede quedar Tolerable en una sola evaluación.'); }
  if (r.pEsp && r.pEsp*r.cEsp < r.pRes*r.cRes){ r.pEsp=r.pRes; r.cEsp=r.cRes; }
  r.reglas = notas; return r;
}

/* ======================= Dictado por voz ======================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var rec = null;
function dictar(target, btn){
  if (rec){ rec.stop(); return; }
  rec = new SR(); rec.lang='es-CL'; rec.interimResults=false; rec.continuous=false;
  btn.classList.add('rec'); btn.textContent='● Escuchando…';
  rec.onresult = function(e){
    var txt = Array.from(e.results).map(function(r){return r[0].transcript;}).join(' ').trim();
    if (!txt) return;
    var cuerpo = txt.charAt(0).toUpperCase()+txt.slice(1);
    cur[target] = (cur[target]||'').trim() ? cur[target].trim()+'. '+cuerpo : cuerpo;
    var el = document.querySelector('[data-f="'+target+'"]'); if (el) el.value = cur[target];
    guardarBorrador();
  };
  rec.onerror = function(e){ if (e.error==='not-allowed') toast('Permite el uso del micrófono para dictar.'); };
  rec.onend = function(){ rec=null; btn.classList.remove('rec'); btn.textContent='🎤 Dictar'; };
  rec.start();
}

/* ======================= Render general ======================= */
function render(keepScroll){
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===tab); });
  var r = tab==='nueva'?renderNueva():tab==='matriz'?renderMatriz():tab==='medidas'?renderMedidas():tab==='panel'?renderPanel():[renderAjustes(),''];
  $('app').innerHTML = r[0];
  $('barIn').innerHTML = r[1]; $('bar').classList.toggle('hidden', !r[1]);
  if (!keepScroll) window.scrollTo(0,0);
}
function irA(t){ tab=t; if (t==='matriz') cargar('tareas'); if (t==='medidas') cargar('medidas'); if (t==='panel') cargar('panel'); render(); }
function cargar(que){
  if (!cfg.centro){ return; }
  var fn = {tareas:'listarTareas', medidas:'listarMedidas', panel:'panel'}[que];
  datos[que] = null;
  run(fn, cfg.centro).then(function(d){ datos[que]=d; if ((que==='tareas'&&tab==='matriz')||(que==='medidas'&&tab==='medidas')||(que==='panel'&&tab==='panel')) render(true); })
    .catch(function(e){ datos[que]=[]; toast(e.message); render(true); });
}
function sinCentro(){ return '<div class="empty">Primero indica el <b>centro de trabajo</b> en <a href="#" onclick="irA(\'ajustes\');return false">Ajustes</a>.</div>'; }
function cargando(){ return '<div class="empty">Cargando…</div>'; }

/* ======================= Nueva tarea ======================= */
function stepper(){ return '<div class="steps">'+[1,2,3].map(function(i){return '<span class="'+(i<=paso?'on':'')+'"></span>';}).join('')+'</div>'; }

function renderNueva(){
  var t = cur, h = stepper(), bar='';
  if (t.id) h += '<div class="banner">🔄 Reevaluando una tarea existente. Al guardar se actualizará en la matriz y su estado volverá a <b>Borrador</b>.</div>';
  if (!cfg.centro) h += '<div class="note" style="margin-bottom:12px">Indica el centro de trabajo en <b>Ajustes</b> antes de guardar.</div>';
  if (paso===1){
    var L = SRV.listas[cfg.centro] || {procesos:[],puestos:[]};
    h += '<h2>1. Datos de la tarea</h2><p class="sub">'+esc(cfg.centro||'Sin centro')+' · Completa lo básico.</p>'+
    '<div class="card">'+
      '<label>Proceso</label><input type="text" list="dlProc" data-f="proceso" value="'+esc(t.proceso)+'" placeholder="Ej: Control de portería">'+
      '<datalist id="dlProc">'+L.procesos.map(function(p){return '<option value="'+esc(p)+'">';}).join('')+'</datalist>'+
      '<label>Puesto de trabajo</label><input type="text" list="dlPue" data-f="puesto" value="'+esc(t.puesto)+'" placeholder="Ej: Guardia de seguridad">'+
      '<datalist id="dlPue">'+L.puestos.map(function(p){return '<option value="'+esc(p)+'">';}).join('')+'</datalist>'+
      '<label class="lbl"><span>Descripción breve de la tarea</span>'+micBtn('tarea')+'</label><textarea data-f="tarea" placeholder="Ej: Controlar el acceso de vehículos, levantar la barrera y revisar documentos">'+esc(t.tarea)+'</textarea>'+

    '</div>';

  }
  else if (paso===2){
    h += '<h2>2. Medidas preventivas actuales</h2><p class="sub">¿Qué medidas existen hoy para esta tarea? La IA evaluará el riesgo <b>considerando estas medidas</b> y las clasificará según la jerarquía de control.</p>'+

  }
  else {
    var pend = t.riesgos.filter(function(r){return r.confirmado===null;}).length;
    h += '<h2>3. Revisión</h2><p class="sub">Revisa, ajusta y guarda. Las reglas de valoración se aplican solas.</p>';

function riskCard(r,i){
  var n = nivel(r.p*r.c), descartado = r.confirmado===false;
  var h = '<div class="card risk bl-'+n+'" style="'+(descartado?'opacity:.45':'')+'">'+
    '<div class="hd"><div style="flex:1"><div class="fam">'+FAM[r.fam]+(r.origen==='foto'?' · 📷 foto':'')+(r.origen==='manual'?' · manual':'')+'</div>'+
    '<div class="rname"><span class="code">'+esc(r.codigo)+'</span> '+esc(r.riesgo)+'</div></div>'+
    '<button class="x" data-del="'+i+'" aria-label="Eliminar">×</button></div>';
  if (r.origen==='foto' && r.confirmado!==true){
    h += '<div class="confirm">'+(descartado?'Descartado. ':'La IA vio este peligro en la foto, pero no estaba en la descripción. ¿Existe realmente?')+
      '<div class="row"><button class="btn" data-conf="'+i+'" data-v="1">Sí, existe</button><button class="btn sec" data-conf="'+i+'" data-v="0">No, descartar</button></div></div>';
  }
  if (descartado) return h+'</div>';
  h += '<label>Peligro</label><input type="text" data-rf="peligro" data-i="'+i+'" value="'+esc(r.peligro)+'">';
  if (r.fam==='PSI'){
    h += '<div class="pc"><div><label>P (CEAL-SM)</label><div class="muted">'+r.p+'</div></div><div><label>C</label><div class="muted">'+r.c+'</div></div>'+vepBox(r.p,r.c)+'</div>'+
      '<div class="just">'+esc(r.justificacion)+' Se valora por centro con CEAL-SM (cámbialo en Ajustes).</div>';
  } else {
    h += '<div class="pc"><div><label>P actual</label>'+seg('p',r.p,i)+'</div><div><label>C actual</label>'+seg('c',r.c,i)+'</div>'+vepBox(r.p,r.c)+'</div>'+
      (r.justificacion?'<div class="just">'+esc(r.justificacion)+'</div>':'');
  }
  h += '<div class="ctrl">'+
    '<label style="margin-top:0">Medidas actuales que aplican</label>'+
    (r.medidasActuales&&r.medidasActuales.length?'<ul>'+r.medidasActuales.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>':'<div class="muted">Ninguna</div>')+
    '<label>Medida propuesta</label><textarea data-rf="medidaPropuesta" data-i="'+i+'" style="min-height:60px">'+esc(r.medidaPropuesta)+'</textarea>'+
    '<label>Jerarquía de la medida</label><select data-rf="jerarquia" data-i="'+i+'">'+JER.map(function(j){return '<option'+(j===r.jerarquia?' selected':'')+'>'+j+'</option>';}).join('')+'</select>'+
    (r.fam==='PSI'?'':'<div class="pc"><div><label>P residual</label>'+seg('pRes',r.pRes,i)+'</div><div><label>C residual</label>'+seg('cRes',r.cRes,i)+'</div>'+vepBox(r.pRes,r.cRes)+'</div>')+
    (r.reglas&&r.reglas.length?'<div class="rules">⚖️ '+r.reglas.map(esc).join('<br>⚖️ ')+'</div>':'')+
    (r.medidaEspecial?'<label>Medida especial (personas sensibles)</label><textarea data-rf="medidaEspecial" data-i="'+i+'" style="min-height:50px">'+esc(r.medidaEspecial)+'</textarea>':'')+
    (r.protocolos&&r.protocolos.length?'<div style="margin-top:8px">'+r.protocolos.map(function(p){return '<span class="prot">📋 '+esc(p)+'</span>';}).join('')+'</div>':'')+
    '<div class="legal">⚖️ '+(r.requisitoLegal?esc(r.requisitoLegal):'Requisito legal: se completa al guardar (tabla fija).')+'</div>'+
  '</div>';
  return h+'</div>';
}

function renderMedidas(){
  if (!cfg.centro) return [sinCentro(),''];
  var L = datos.medidas;
  var h = '<h2>Seguimiento de medidas</h2><p class="sub">El riesgo residual solo se acepta cuando la medida está <b>verificada con evidencia</b>.</p>';
  if (!L) return [h+cargando(),''];
  var filtros = [['abiertas','Abiertas'],['vencidas','Vencidas'],['Implementada','Implementadas'],['Verificada','Verificadas'],['todas','Todas']];
  h += '<div class="chips" style="margin-bottom:12px">'+filtros.map(function(f){
    var n = L.filter(function(m){return pasaFiltro(m,f[0]);}).length;
    return '<button class="chip '+(filtroMed===f[0]?'on':'')+'" data-fmed="'+f[0]+'">'+f[1]+' ('+n+')</button>'; }).join('')+'</div>';
  var vis = L.filter(function(m){return pasaFiltro(m,filtroMed);});
  if (!vis.length) return [h+'<div class="empty">No hay medidas en este filtro.</div>',''];
  h += vis.map(function(m){
    return '<div class="card risk bl-'+m.nivelInicial+'"><div class="fam">'+esc(m.puesto)+' · '+esc(m.codigo)+' '+esc(m.riesgo)+'</div>'+
      '<div class="rname">'+esc(m.medida)+'</div>'+
      '<div style="margin:6px 0"><span class="tag">'+esc(m.jerarquia)+'</span><span class="st st-'+m.estado+'">'+m.estado+'</span> '+
      (m.vencida?'<span class="st st-alerta">Vencida '+fecha(m.plazo)+'</span>':'<span class="muted">Plazo '+fecha(m.plazo)+'</span>')+'</div>'+
      '<div class="muted">Responsable: '+esc(m.responsable||'—')+'<br>Verificador: '+esc(m.verificador)+'</div>'+
      (m.evidencia?'<div style="margin-top:6px"><a href="'+esc(m.evidencia)+'" target="_blank">📎 Ver evidencia</a></div>':'')+
      '<div class="acts">'+
        (m.estado==='Pendiente'?'<button class="chip" data-mest="Implementada" data-id="'+m.id+'">🔧 Marcar implementada</button>':'')+
        (m.estado!=='Verificada'?'<button class="chip" data-verif="'+m.id+'">📷 Verificar con foto</button>':'')+
        (m.estado!=='Pendiente'?'<button class="chip" data-mest="Pendiente" data-id="'+m.id+'">↩ Volver a pendiente</button>':'')+
      '</div></div>';
  }).join('');
  return [h,''];
}
function pasaFiltro(m,f){
  if (f==='todas') return true;
  if (f==='abiertas') return m.estado!=='Verificada';
  if (f==='vencidas') return m.vencida;
  return m.estado===f;
}

function renderPanel(){
  if (!cfg.centro) return [sinCentro(),''];
  var P = datos.panel;
  var h = '<h2>Panel</h2><p class="sub">'+esc(cfg.centro)+'</p>';
  if (!P) return [h+cargando(),''];
  if (!P.tareas) return [h+'<div class="empty">Aún no hay tareas en este centro.</div>',''];
  var tile = function(v,t,al){ return '<div class="tile'+(al&&v?' alerta':'')+'"><b>'+v+'</b><span>'+t+'</span></div>'; };
  h += '<div class="tiles">'+tile(P.tareas,'Tareas evaluadas')+tile(P.riesgos,'Riesgos identificados')+
    tile(P.medidas.vencidas,'Medidas vencidas',true)+tile(P.reevaluar,'Tareas por reevaluar',true)+
    tile(P.estados.Validada+' / '+P.tareas,'Tareas validadas')+tile(P.revisiones,'Revisiones próximas',true)+'</div>';
  var colores = {Tolerable:'var(--tol)',Moderado:'var(--mod)',Importante:'var(--imp)',Intolerable:'var(--int)'};
  var barras = function(obj){ var max=Math.max(1,P.riesgos); return ['Intolerable','Importante','Moderado','Tolerable'].map(function(n){
    return '<div class="barra"><span class="n">'+n+'</span><span class="t"><i style="width:'+(obj[n]/max*100)+'%;background:'+colores[n]+'"></i></span><span class="v">'+obj[n]+'</span></div>'; }).join(''); };
  h += '<div class="card"><h3>Nivel de riesgo inicial</h3>'+barras(P.inicial)+'</div>';
  h += '<div class="card"><h3>Nivel de riesgo actual</h3><p class="muted" style="margin:0 0 6px">Baja al residual solo cuando la medida está verificada ('+P.residualAceptado+' de '+P.riesgos+').</p>'+barras(P.actual)+'</div>';
  var mt = Math.max(1,P.medidas.total);
  h += '<div class="card"><h3>Medidas ('+P.medidas.total+')</h3>'+[['Pendiente','#9aa5b1'],['Implementada','#2e75b6'],['Verificada','var(--tol)']].map(function(x){
    return '<div class="barra"><span class="n">'+x[0]+'</span><span class="t"><i style="width:'+(P.medidas[x[0]]/mt*100)+'%;background:'+x[1]+'"></i></span><span class="v">'+P.medidas[x[0]]+'</span></div>'; }).join('')+'</div>';
  var prot = Object.keys(P.protocolos||{});
  if (prot.length) h += '<div class="card"><h3>Protocolos que aplican</h3>'+prot.map(function(p){return '<span class="prot">📋 '+esc(p)+' ('+P.protocolos[p]+')</span>';}).join('')+'</div>';
  return [h,''];
}

/* ======================= Fotos ======================= */
function procesarFoto(file, max){
  max = max || 1280;
  return new Promise(function(ok,ko){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height, k = Math.min(1, max/Math.max(w,h));
        var cv = document.createElement('canvas'); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var big = cv.toDataURL('image/jpeg',0.72);
        var t = document.createElement('canvas'), tk = 200/Math.max(cv.width,cv.height);
        t.width = Math.round(cv.width*tk); t.height = Math.round(cv.height*tk);
        t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
        ok({mime:'image/jpeg', data:big.split(',')[1], thumb:t.toDataURL('image/jpeg',0.7)});
      };
      img.onerror = function(){ ko(new Error('No se pudo leer la imagen')); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* ======================= Acciones ======================= */
function validarPaso1(){
  var t = cur;
  if (!t.proceso.trim() || !t.puesto.trim() || !t.tarea.trim()){ toast('Completa proceso, puesto y descripción de la tarea.'); return false; }
  if (!(+t.hombres||0) && !(+t.mujeres||0) && !(+t.otros||0)){ toast('Indica cuántas personas realizan la tarea.'); return false; }
  return true;
}

function analizar(){
  var t = cur;
  if (!validarPaso1()){ paso=1; render(); return; }
  busy(true,'Analizando con IA…', t.fotos.length?'Descripción, medidas y '+t.fotos.length+' foto(s)':'Descripción y medidas actuales');
  var payload = {id:t.id, proceso:t.proceso, puesto:t.puesto, tarea:t.tarea, lugar:t.lugar, rutinaria:t.rutinaria,
    hombres:t.hombres, mujeres:t.mujeres, otros:t.otros, sensibles:t.sensibles, medidasTexto:t.medidasTexto, ceal:cealCentro(),
    fotos:t.fotos.map(function(f){return {mime:f.mime,data:f.data};})};
  run('analizarTarea', payload).then(function(res){
    busy(false);
    t.riesgos = res.riesgos; t.observacionesFoto = res.observacionesFoto; t.medidasActuales = res.medidasActuales; t.analizado = true;
    if (res.ejemplos) toast('Se usaron '+res.ejemplos+' evaluación(es) validada(s) similar(es) como referencia.');
    else if (!t.riesgos.length) toast('La IA no identificó riesgos válidos. Agrega uno manualmente o detalla más la tarea.');
    guardarBorrador(); paso = 3; render();
  }).catch(function(e){ busy(false); toast(e.message, 7000); });
}

function guardarTarea(){
  var t = cur;
  if (!cfg.centro){ toast('Indica el centro de trabajo en Ajustes.'); return; }
  if (t.riesgos.some(function(r){return r.confirmado===null;})){ toast('Confirma o descarta los peligros detectados en las fotos.'); return; }
  if (!t.riesgos.some(function(r){return r.confirmado!==false;})){ toast('No hay riesgos para guardar.'); return; }
  var copia = JSON.parse(JSON.stringify(t)); delete copia.fotos; copia.ceal = cealCentro();
  busy(true,'Guardando en la matriz…');
  run('guardarTarea', copia, {empresa:cfg.empresa, centro:cfg.centro, respEjec:cfg.respEjec}).then(function(r){
    busy(false);
    var base = cur;
    cur = nuevaTarea(); paso = 1;
    // mantiene proceso, puesto y personas para evaluar la siguiente tarea más rápido
    cur.proceso = base.proceso; cur.puesto = base.puesto; cur.hombres = base.hombres; cur.mujeres = base.mujeres; cur.otros = base.otros; cur.sensibles = base.sensibles;
    guardarBorrador(); refrescarConfig();
    toast('✅ Guardada: '+r.riesgos+' riesgos y '+r.medidas+' medidas para seguimiento.');
    render();
  }).catch(function(e){ busy(false); toast(e.message, 6000); });
}

function reevaluar(id){
  busy(true,'Cargando tarea…');
  run('obtenerTarea', id).then(function(d){
    busy(false);
    cur = Object.assign(nuevaTarea(), d, {fotos:[], analizado:true});
    cur.riesgos.forEach(function(r){ r.confirmado = true; });
    paso = 2; tab = 'nueva'; guardarBorrador(); render();
    toast(d.eventos && d.eventos.length ? 'Revisa las medidas y vuelve a analizar: la IA considerará el '+d.eventos[d.eventos.length-1].tipo.toLowerCase()+' registrado.' : 'Revisa los datos y vuelve a analizar o ajusta el resultado.');
  }).catch(function(e){ busy(false); toast(e.message); });
}

function cambiarEstado(id, estado){
  if (estado==='Validada' && !cfg.aprobador.trim()){ irA('ajustes'); toast('Escribe en Ajustes el nombre de quien valida.'); return; }
  busy(true, estado==='Validada'?'Validando…':'Actualizando…');
  run('cambiarEstado', id, estado, cfg.aprobador).then(function(){ busy(false); toast(estado==='Validada'?'Validada. Próxima revisión en 1 año.':'Marcada como revisada.'); cargar('tareas'); })
    .catch(function(e){ busy(false); toast(e.message); });
}

function actualizarMedida(id, estado, foto){
  busy(true, estado==='Verificada'?'Subiendo evidencia…':'Actualizando…');
  run('actualizarMedida', id, estado, foto||null, '').then(function(){ busy(false); toast(estado==='Verificada'?'✅ Medida verificada. El riesgo residual queda aceptado.':'Medida actualizada.'); cargar('medidas'); })
    .catch(function(e){ busy(false); toast(e.message); });
}

  busy(true,'Generando Excel…','Matriz, programa de trabajo, información por puesto, EPP y protocolos');

      '<p class="muted">Se envió <b>'+esc(r.nombre)+'.xlsx</b> a <b>'+esc(r.email)+'</b> con '+r.total+' riesgos.</p>'+

      '<button class="btn" onclick="cerrarSheet()">Listo</button></div>');
  }).catch(function(e){ busy(false); toast(e.message, 6000); });

function aplicarConfig(c){
  SRV = Object.assign(SRV, c); CATMAP = {}; (SRV.catalogo||[]).forEach(function(x){ CATMAP[x.c]=x; });
  if (modo()!=='demo') save('iper_srv', {catalogo:SRV.catalogo, listas:SRV.listas});

/** Sube a la base de datos las tareas que la versión 1 guardaba solo en el teléfono. */
function migrarV1(){
  var viejas = load('iper_tareas', []);
  if (!viejas.length || modo()==='demo' || !cfg.centro) return;
  var n = 0;
  viejas.reduce(function(p, t){
    return p.then(function(){ return run('guardarTarea', t, {empresa:cfg.empresa, centro:cfg.centro, respEjec:cfg.respEjec}).then(function(){ n++; }); });
  }, Promise.resolve()).then(function(){
    save('iper_tareas', []); toast(n+' tarea(s) de la versión anterior se pasaron a la matriz de '+cfg.centro+'.'); refrescarConfig();
  }).catch(function(e){ toast('No se pudieron pasar las tareas anteriores: '+e.message); });
}
function refrescarConfig(){ run('getConfig').then(function(c){ aplicarConfig(c); }).catch(function(){}); }

function probarConexion(){
  if (modo()!=='api') return toast('Completa la URL y la clave de acceso.');
  busy(true,'Probando conexión…');
  run('getConfig').then(function(c){

    else toast(c.tieneClave ? '✅ Conectado. Ya puedes usar la IA.' : 'Conectado, pero falta GEMINI_API_KEY en el servidor.');
    render(true);
  }).catch(function(e){ busy(false); toast(e.message); });
}

document.addEventListener('click', function(e){
  var b = e.target.closest('button,[data-delph]'); if (!b) return;
  var d = b.dataset;
  if (d.mic){ e.preventDefault(); dictar(d.mic, b); }
  else if (d.rut!=null){ cur.rutinaria = d.rut==='1'; guardarBorrador(); render(true); }
  else if (d.sens){ cur.sensibles[d.sens] = !cur.sensibles[d.sens]; b.classList.toggle('on'); guardarBorrador(); }
  else if (d.delph!=null){ cur.fotos.splice(+d.delph,1); render(true); }
  else if (d.seg){

    var y = b.closest('.card').getBoundingClientRect().top; render(true);
    var nc = document.querySelectorAll('.risk')[+d.i]; if (nc) window.scrollTo(0, nc.getBoundingClientRect().top + window.scrollY - y);
  }
  else if (d.conf!=null){ cur.riesgos[+d.conf].confirmado = d.v==='1'; guardarBorrador(); render(true); }
  else if (d.del!=null){ cur.riesgos.splice(+d.del,1); guardarBorrador(); render(true); }
  else if (d.go){ var g=+d.go; if (g>=2 && paso===1 && !validarPaso1()) return; paso = g; render(); }
  else if (d.med){ cur.medidasTexto = (cur.medidasTexto.trim()? cur.medidasTexto.trim()+'. ':'')+d.med; $('medTxt').value=cur.medidasTexto; guardarBorrador(); }
  else if (d.est){ cambiarEstado(d.id, d.est); }
  else if (d.evt){ abrirEvento(d.evt); }
  else if (d.reev){ reevaluar(d.reev); }
  else if (d.deltask){ if (confirmar('¿Eliminar esta tarea y sus medidas?')){ busy(true,'Eliminando…'); run('eliminarTarea', d.deltask).then(function(){ busy(false); cargar('tareas'); }).catch(function(er){ busy(false); toast(er.message); }); } }
  else if (d.fmed){ filtroMed = d.fmed; render(true); }
  else if (d.mest){ actualizarMedida(d.id, d.mest); }
  else if (d.verif){ var inp=$('fotoEvid'); inp.dataset.id=d.verif; inp.click(); }
  else if (b.id==='btnAnalizar') analizar();
  else if (b.id==='btnAddRisk') abrirAgregarRiesgo();
  else if (b.id==='btnGuardar') guardarTarea();
  else if (b.id==='btnEnviar') enviar();
  else if (b.id==='btnProbar') probarConexion();
  else if (b.id==='btnDescartar'){ if (confirmar('¿Descartar esta evaluación?')){ cur = nuevaTarea(); paso=1; guardarBorrador(); render(); } }
  else if (b.id==='btnAvisos'){ busy(true,'Activando avisos…'); run('activarAvisos').then(function(r){ busy(false); SRV.avisosActivos=true; toast(r.mensaje); render(true); }).catch(function(er){ busy(false); toast(er.message); }); }
});

      return {id:t.id,proceso:t.proceso,puesto:t.puesto,tarea:t.tarea,estado:t.estado,aprobador:t.aprobador,fechaAprobacion:t.fechaAprobacion,proximaRevision:t.proximaRevision,
        reevaluar:t.reevaluar,motivo:t.motivo,conteo:cont,maxVep:max,riesgos:t.d.riesgos.length,medidas:ms.length,verificadas:ms.filter(function(m){return m.estado==='Verificada';}).length}; }); },
    obtenerTarea: function(id){ var t=DB.tareas.filter(function(x){return x.id===id;})[0]; return Object.assign(JSON.parse(JSON.stringify(t.d)),{id:id,eventos:t.eventos||[]}); },
    cambiarEstado: function(id,est,apr){ var t=DB.tareas.filter(function(x){return x.id===id;})[0]; t.estado=est; if(est==='Validada'){t.aprobador=apr;t.fechaAprobacion=new Date().toISOString();t.proximaRevision=new Date(Date.now()+365*864e5).toISOString();} return {}; },
    eliminarTarea: function(id){ DB.tareas=DB.tareas.filter(function(x){return x.id!==id;}); DB.medidas=DB.medidas.filter(function(m){return m.tareaId!==id;}); return {}; },
    registrarEvento: function(id,tipo,d){ var t=DB.tareas.filter(function(x){return x.id===id;})[0]; t.reevaluar=true; t.motivo=tipo+': '+d; if(t.estado==='Validada')t.estado='Revisada'; (t.eventos=t.eventos||[]).push({tipo:tipo,descripcion:d}); return {}; },
    listarMedidas: function(c){ return DB.medidas.filter(centro(c)).map(function(m){ return Object.assign({},m,{vencida:m.estado!=='Verificada'&&new Date(m.plazo)<new Date(Date.now()-864e5)}); }); },
    actualizarMedida: function(id,est,foto){ var m=DB.medidas.filter(function(x){return x.id===id;})[0]; if(foto)m.evidencia='#'; if(est==='Verificada'&&!m.evidencia)throw new Error('Para verificar, adjunta una foto de evidencia.'); m.estado=est; return {}; },
    panel: function(c){ var ts=DB.tareas.filter(centro(c)),ms=this.listarMedidas(c),ini={Tolerable:0,Moderado:0,Importante:0,Intolerable:0},act={Tolerable:0,Moderado:0,Importante:0,Intolerable:0},ac=0,tot=0,prot={};
      ts.forEach(function(t){ t.d.riesgos.forEach(function(r){ tot++; ini[nivel(r.p*r.c)]++; var ok=ms.some(function(m){return m.tareaId===t.id&&m.codigo===r.codigo&&m.estado==='Verificada';});
        if(ok){ac++;act[nivel(r.pRes*r.cRes)]++;}else act[nivel(r.p*r.c)]++; (r.protocolos||[]).forEach(function(p){prot[p]=(prot[p]||0)+1;}); }); });
      return {tareas:ts.length,estados:{Borrador:ts.filter(function(t){return t.estado==='Borrador';}).length,Revisada:ts.filter(function(t){return t.estado==='Revisada';}).length,Validada:ts.filter(function(t){return t.estado==='Validada';}).length},
        riesgos:tot,inicial:ini,actual:act,residualAceptado:ac,medidas:{total:ms.length,Pendiente:ms.filter(function(m){return m.estado==='Pendiente';}).length,Implementada:ms.filter(function(m){return m.estado==='Implementada';}).length,
        Verificada:ms.filter(function(m){return m.estado==='Verificada';}).length,vencidas:ms.filter(function(m){return m.vencida;}).length},reevaluar:ts.filter(function(t){return t.reevaluar;}).length,revisiones:0,protocolos:prot}; },
    generarYEnviar: function(m){ if(!DB.tareas.filter(centro(m.centro)).length) throw new Error('No hay tareas guardadas para este centro.');
      return {email:m.email,url:'#',nombre:'Matriz IPER - '+m.centro+' (demo)',total:DB.tareas.filter(centro(m.centro)).reduce(function(a,t){return a+t.d.riesgos.length;},0)}; },
    activarAvisos: function(){ return {ok:true, mensaje:'(Demo) En la versión real se activan los avisos diarios.'}; }
  };
})();

init();
</script>
