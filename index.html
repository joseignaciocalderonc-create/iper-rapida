<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0A1828">
<title>IPER Rápida</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* IPER Rápida v8 — sereno y legible: una sola tinta de acción (petróleo); el color fuerte queda para los niveles de riesgo */
  :root{
    color-scheme: dark;
    --bg:#0A1828; --card:rgba(255,255,255,.045); --solid:#11233A; --ink:#E8EEF6; --muted:#93A5BA; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17); --soft:rgba(255,255,255,.07);
    --brand:#3BA3E2; --accent:#3BA3E2; --accent-ink:#FFFFFF; --act-soft:rgba(59,163,226,.16); --act-ink:#A7D8F7; --txt2:#C3D0DF;
    --tol:#4CC27A; --mod:#E9B949; --imp:#F08A4B; --int:#F0605A;
    --tol-bg:rgba(76,194,122,.15); --mod-bg:rgba(233,185,73,.15); --imp-bg:rgba(240,138,75,.16); --int-bg:rgba(240,96,90,.16);
    --r:14px; --navh:0px;
    --f-text:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-head:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  body.con-nav{--navh:64px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)} body{margin:0;min-height:100vh;background:radial-gradient(1100px 700px at 12% -10%, rgba(40,95,150,.38), transparent 60%),radial-gradient(900px 600px at 105% 105%, rgba(28,80,120,.32), transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--f-text);-webkit-font-smoothing:antialiased}
  svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  a{color:var(--brand)}

  /* Cabecera */
  header{position:sticky;top:0;z-index:20;background:rgba(10,24,40,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
  .top{display:flex;align-items:center;gap:4px;max-width:720px;margin:0 auto;min-height:44px}
  .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding-left:6px}
  .ttl b{display:block;font:600 19px/1.15 var(--f-head);letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl span.s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl>div{min-width:0}
  .marca{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
  .marca::after{content:'';width:12px;height:12px;border:2.5px solid #fff;border-radius:3px;transform:rotate(45deg)}
  #logoH img{height:30px;max-width:72px;object-fit:contain;border-radius:6px;display:block}
  .demo{font-size:11.5px;background:var(--mod-bg);color:#F3D58C;border-radius:99px;padding:2px 9px;font-weight:700}
  .hbtn{background:none;border:0;color:var(--muted);width:42px;height:42px;border-radius:10px;display:grid;place-items:center;padding:0}
  .hbtn:active{background:var(--soft)} .hbtn.on{color:var(--brand);background:var(--act-soft)}

  /* Navegación inferior (solo dentro de un centro) */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:rgba(10,24,40,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none;padding:4px 6px env(safe-area-inset-bottom)}
  body.con-nav nav{display:flex}
  nav .in{display:flex;width:100%;max-width:720px;margin:0 auto}
  nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;position:relative}
  nav button svg.i{width:22px;height:22px}
  nav button.on{color:var(--brand)}
  nav button.on::before{content:'';position:absolute;top:-4px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
  nav .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--brand);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;line-height:16px}

  main{padding:18px 16px calc(120px + var(--navh));max-width:720px;margin:0 auto}
  h2{font:600 24px/1.2 var(--f-head);margin:0 0 4px;letter-spacing:.1px}
  h3{font-size:15.5px;margin:0 0 6px;font-weight:700}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--txt2);margin:14px 0 6px}
  input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;font:inherit;font-size:15.5px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none;transition:border-color .15s, box-shadow .15s}
  input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--act-soft)}
  ::placeholder{color:#6F8297}
  textarea{min-height:88px;resize:vertical;line-height:1.45}
  .row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid transparent;border-radius:11px;padding:13px 14px;font:inherit;font-weight:700;font-size:15px;background:linear-gradient(180deg,#45AEEA,#2D8FD0);color:var(--accent-ink);box-shadow:0 6px 18px rgba(30,120,190,.28);transition:filter .15s, transform .1s}
  .btn:active{transform:scale(.985);filter:brightness(.95)}
  .btn.sec{background:rgba(255,255,255,.06);color:var(--ink);border-color:var(--line2)}
  .btn.ghost{background:none;box-shadow:none;color:var(--brand);padding:10px;width:auto;border-color:transparent}
  .btn.peligro{color:var(--int)}
  .btn:disabled{opacity:.5}
  .bar{position:fixed;left:0;right:0;bottom:var(--navh);background:rgba(10,24,40,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 14px;z-index:15}
  body:not(.con-nav) .bar{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
  .steps{display:flex;gap:6px;margin:0 0 16px}
  .steps span{flex:1;height:4px;border-radius:9px;background:var(--line)} .steps span.on{background:var(--brand)}
  .pasos-t{font-size:13px;color:var(--muted);margin:0 0 4px}
  .toggle{display:flex;background:var(--soft);border-radius:10px;padding:3px}
  .toggle button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:inherit;font-weight:700;color:var(--muted)}
  .toggle button.on{background:rgba(255,255,255,.13);color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);border-radius:99px;padding:7px 12px;font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
  .chip svg.i{width:16px;height:16px}
  .chip.on{background:var(--act-soft);color:var(--act-ink);border-color:rgba(59,163,226,.45);font-weight:700}
  .photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph b{position:absolute;top:4px;right:4px;background:rgba(31,43,46,.7);color:#fff;border-radius:99px;width:24px;height:24px;display:grid;place-items:center;font-size:14px}
  .addph{aspect-ratio:1;border:1.5px dashed var(--line2);border-radius:10px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;text-align:center;background:rgba(255,255,255,.03);margin:0}
  .risk{border-left:4px solid var(--line)}
  .risk .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .code{font:600 13.5px var(--f-head);background:var(--soft);color:var(--ink);border-radius:6px;padding:1px 7px;white-space:nowrap}
  .fam{font-size:12.5px;color:var(--muted);font-weight:700}
  .rname{font-weight:700;margin:2px 0}
  .just{font-size:13px;color:var(--muted);margin-top:6px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--txt2);margin-right:4px}
  .pc{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:8px}
  .pc label{margin-top:0}
  .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:rgba(255,255,255,.04);padding:9px 0;font:600 15px var(--f-head);color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button.on{background:var(--act-soft);color:var(--act-ink)}
  .vep{min-width:76px;text-align:center;border-radius:9px;padding:5px 6px;font:600 18px/1.1 var(--f-head)}
  .vep small{display:block;font:700 11px var(--f-text)}
  .Tolerable{background:var(--tol-bg);color:#8BE0AC} .Moderado{background:var(--mod-bg);color:#F3D58C}
  .Importante{background:var(--imp-bg);color:#F7B58C} .Intolerable{background:var(--int-bg);color:#F7A19C}
  .bl-Tolerable{border-left-color:var(--tol)} .bl-Moderado{border-left-color:var(--mod)} .bl-Importante{border-left-color:var(--imp)} .bl-Intolerable{border-left-color:var(--int)}
  .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;border-radius:8px}
  .ctrl{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .ctrl ul{margin:4px 0 0;padding-left:18px;font-size:14px}
  .note{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--txt2)}
  .note.aviso{background:var(--mod-bg);border-color:rgba(233,185,73,.35);color:#F3D58C}
  .note.bien{background:var(--tol-bg);border-color:rgba(76,194,122,.35);color:#9BE3B5}
  .empty{text-align:center;color:var(--muted);padding:36px 16px}
  .sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .overlay{position:fixed;inset:0;background:rgba(3,10,20,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;opacity:0;visibility:hidden;transition:opacity .2s, visibility 0s .2s}
  .overlay.on{opacity:1;visibility:visible;transition:opacity .2s}
  .box{background:var(--solid);border:1px solid var(--line2);border-radius:16px;padding:24px 22px;max-width:340px;width:100%;text-align:center}
  .box b{display:block;font-size:16px}
  .spin{width:34px;height:34px;border:3px solid var(--soft);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .prog{margin-top:16px}
  .prog .pt{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
  .prog .pt i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .4s ease}
  .prog span{display:block;font:600 28px/1 var(--f-head);margin-top:10px;color:var(--ink)}
  .sheet{position:fixed;inset:0;background:rgba(3,10,20,.62);z-index:40;display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:opacity .22s, visibility 0s .22s}
  .sheet.on{opacity:1;visibility:visible;transition:opacity .22s}
  .sheet .pane{background:var(--solid);border-top:1px solid var(--line2);width:100%;max-width:720px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .sheet .pane::before{content:'';display:block;width:38px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
  .sheet.on .pane{transform:none}
  .sh-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .sh-h h2{font-size:21px;margin:0}
  .crit{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px}
  .crit td,.crit th{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}
  .crit th{color:var(--muted);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line2)}
  .toast{position:fixed;left:50%;bottom:calc(var(--navh) + 84px);transform:translate(-50%,8px);background:#E8EEF6;color:#0A1828;padding:12px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:92%;width:max-content;display:flex;align-items:center;gap:14px;opacity:0;visibility:hidden;transition:opacity .2s, transform .2s, visibility 0s .2s}
  .toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s, transform .2s}
  .toast button{background:none;border:0;color:#1F6FA8;font:inherit;font-weight:700;padding:4px 2px;white-space:nowrap}
  .muted{color:var(--muted);font-size:13.5px}
  .hidden{display:none!important}
  .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .lbl>span:first-child{display:flex;align-items:center;gap:6px}
  .mic{white-space:nowrap;border:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:99px;padding:4px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
  .mic svg.i{width:15px;height:15px}
  .mic.rec{background:var(--int);color:#fff;border-color:var(--int);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.65}}
  .confirm{background:var(--mod-bg);border:1px solid rgba(233,185,73,.35);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
  .confirm .row{margin-top:8px}
  .confirm .btn{padding:9px;font-size:14px}
  .rules{font-size:13px;color:#F3D58C;background:var(--mod-bg);border-radius:8px;padding:7px 10px;margin-top:8px}
  .legal{font-size:12.5px;color:var(--muted);margin-top:8px}
  .prot{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--act-soft);color:var(--act-ink);margin:4px 4px 0 0}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
  .st-Borrador,.st-Pendiente{background:var(--soft);color:var(--txt2)} .st-Revisada,.st-Implementada{background:var(--act-soft);color:var(--act-ink)}
  .st-Validada,.st-Verificada{background:var(--tol-bg);color:#8BE0AC} .st-alerta{background:var(--int-bg);color:#F7A19C}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .tile b{display:block;font:600 28px/1.1 var(--f-head)} .tile span{font-size:13px;color:var(--muted)}
  .tile.alerta b{color:var(--int)}
  .barra{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
  .barra .n{width:88px;color:var(--txt2)} .barra .t{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
  .barra .t i{display:block;height:100%;border-radius:99px} .barra .v{width:28px;text-align:right;font:600 15px var(--f-head)}
  .banner{background:var(--act-soft);border-radius:10px;color:var(--act-ink);padding:10px 12px;font-size:14px;margin-bottom:14px}
  .logo img{height:26px}
  .grp{font-size:13.5px;font-weight:700;color:var(--muted);margin:18px 0 8px}
  .search{margin-bottom:12px}
  .sec-t{font-size:14px;font-weight:700;color:var(--muted);margin:22px 0 8px}

  /* Listas agrupadas: una superficie con filas separadas por líneas, en vez de muchas tarjetas */
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
  .li{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .li:first-child{border-top:0}
  .li:active{background:rgba(255,255,255,.05)}
  .li .tx{flex:1;min-width:0}
  .li .tx b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .tx b.wrap{white-space:normal}
  .li .tx span{display:block;font-size:13px;color:var(--muted)}
  .li .chev{color:#6F8297}
  .li .fi{width:40px;height:40px;border-radius:10px;background:var(--act-soft);color:var(--brand);display:grid;place-items:center;flex:none}
  .li .fi img{width:40px;height:40px;object-fit:contain;border-radius:10px;background:#fff}
  .li .ok-i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
  .li .ok-i.si{background:var(--tol-bg);color:var(--tol)} .li .ok-i.no{background:var(--mod-bg);color:var(--mod)}
  .li .ok-i svg.i{width:15px;height:15px;stroke-width:2.4}
  .li .num{font:600 15px var(--f-head);color:var(--muted)}
  .item,.rrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .item .tx,.rrow .tx{flex:1;min-width:0}
  .item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .tx span{font-size:13px;color:var(--muted)}
  .rrow{cursor:pointer}
  .rrow .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .rrow .tx b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .tx span{font-size:13px;color:var(--muted)}
  .rrow .vv{font-size:13px;font-weight:700;white-space:nowrap;color:var(--txt2)}
  .rrow.open{border-color:var(--brand);border-bottom-left-radius:4px;border-bottom-right-radius:4px}
  .d-Tolerable{background:var(--tol)} .d-Moderado{background:var(--mod)} .d-Importante{background:var(--imp)} .d-Intolerable{background:var(--int)}

  /* Encabezado del centro */
  .chead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .chead .fi{width:52px;height:52px;border-radius:12px;background:var(--act-soft);color:var(--brand);display:grid;place-items:center;flex:none}
  .chead .fi svg.i{width:26px;height:26px}
  .chead .fi img{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line)}
  .pct{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .pct b{font:600 40px/1 var(--f-head)}
  .pct .t{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
  .pct .t i{display:block;height:100%;border-radius:99px}

  /* Burbujas de ayuda */
  .q{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--muted);font:700 12px/1 var(--f-text);padding:0;display:inline-grid;place-items:center;flex:none}
  .q[aria-expanded=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .bubble{position:relative;background:rgba(59,163,226,.18);color:var(--act-ink);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin:2px 0 8px;animation:aparece .18s ease}
  .bubble::before{content:'';position:absolute;top:-6px;left:14px;border:6px solid transparent;border-top:0;border-bottom-color:rgba(59,163,226,.18)}
  @keyframes aparece{from{opacity:0;transform:translateY(-3px)}}
  .corr{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .corr .pt-ok{width:7px;height:7px;border-radius:50%;background:var(--brand)}
  .orig{font-size:13px;background:rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;color:var(--txt2);margin-top:6px}

function toggleAyuda(b){
  var cont = b.closest('label,.lbl') || b.parentNode, sig = cont.nextElementSibling;
  if (sig && sig.classList.contains('bubble')){ sig.remove(); b.setAttribute('aria-expanded','false'); return; }
  document.querySelectorAll('.bubble').forEach(function(x){ x.remove(); });

}

var PROG = {v:0, iv:null};
function progPintar(v){ PROG.v = Math.max(PROG.v, Math.min(100, v)); var k = Math.round(PROG.v); $('busyProg').classList.remove('hidden'); $('busyBar').style.width = k+'%'; $('busyPct').textContent = k+'%'; }
/** Avanza de "desde" hacia "hasta" de forma gradual mientras esperamos al servidor (nunca llega solo al final del tramo). */
function progTramo(desde, hasta, segs){
  clearInterval(PROG.iv); progPintar(desde); var t0 = Date.now();
  PROG.iv = setInterval(function(){ var k = 1-Math.exp(-(Date.now()-t0)/(segs*1000/2.2)); progPintar(desde+(hasta-desde)*0.94*k); }, 350);
}
function progFin(){ clearInterval(PROG.iv); PROG.iv = null; PROG.v = 0; $('busyProg').classList.add('hidden'); $('busyBar').style.width = '0'; }

/** Burbuja que explica un botón de la barra inferior (al primer uso y al mantenerlo presionado). */
function burbujaNav(b){
  var t = AYUDA_NAV[b.dataset.tab]; if (!t) return;
  document.querySelectorAll('.navtip').forEach(function(x){ x.remove(); });
  var r = b.getBoundingClientRect(), d = document.createElement('div'); d.className = 'navtip';
  d.innerHTML = '<b>'+t[0]+'</b>'+t[1]; document.body.appendChild(d);
  var w = d.offsetWidth, x = Math.min(window.innerWidth-w-8, Math.max(8, r.left+r.width/2-w/2));
  d.style.left = x+'px'; d.style.setProperty('--flecha', (r.left+r.width/2-x)+'px');
  clearTimeout(burbujaNav._t); burbujaNav._t = setTimeout(function(){ d.remove(); }, 4200);
}

/* ======================= Evaluaciones en curso (borradores) ======================= */
/* Una evaluación = un puesto con una o varias tareas. Se pueden tener varias a medias.
   Los textos se guardan en el teléfono (localStorage) y las fotos en IndexedDB. */
function nuevoPuesto(){ return {bid:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), proceso:'',puesto:'',lugar:'',hombres:'',mujeres:'',otros:'',
  sensibles:{}, fotos:[], relato:'', tareas:[], idx:0, exp:-1, enCola:false, paso:1, actualizado:Date.now(), demo:enDemo()}; }
function nuevaTareaItem(medidas){ return {id:null, tarea:'', rutinaria:true, medidasTexto:medidas||'', epp:[], riesgos:[], medidasActuales:[], observacionesFoto:'', analizado:false, guardada:false, aceptada:false}; }
function tk(){ return cur.tareas[cur.idx] || cur.tareas[0]; }

function cargarBorradores(){
  var b = load('iper_borradores', null);
  if (!b){ // migración: borrador único de versiones anteriores
    b = {};
    var viejo = load('iper_borrador', null);
    if (viejo && (viejo.proceso || viejo.puesto || viejo.tarea || (viejo.tareas||[]).length)){ var n = normalizarBorrador(viejo); b[n.bid] = n; }
    try{ localStorage.removeItem('iper_borrador'); }catch(e){}
    save('iper_borradores', b);
  }
  return b;
}
function normalizarBorrador(b){
  var p = Object.assign(nuevoPuesto(), b||{});
  if (b && !Array.isArray(b.tareas)){
    var t = nuevaTareaItem(b.medidasTexto);
    ['id','tarea','rutinaria','riesgos','medidasActuales','observacionesFoto','analizado'].forEach(function(k){ if (b[k]!==undefined) t[k]=b[k]; });
    p.tareas = (t.tarea||t.riesgos.length) ? [t] : [];
    ['id','tarea','rutinaria','riesgos','medidasActuales','observacionesFoto','analizado','medidasTexto'].forEach(function(k){ delete p[k]; });
  }
  if (!p.bid) p.bid = nuevoPuesto().bid;
  p.fotos = []; p.idx = Math.min(p.idx||0, Math.max(0,p.tareas.length-1));
  return p;
}
function guardarBorrador(){
  if (!cur) return;
  cur.paso = paso; cur.actualizado = Date.now();
  var c = Object.assign({}, cur); delete c.fotos; c.nFotos = cur.fotos.length;
  borradores[cur.bid] = c; save('iper_borradores', borradores);
}
function borrarBorrador(bid){ delete borradores[bid]; save('iper_borradores', borradores); fotosDB('borrar', bid); }
function listaBorradores(){ return Object.keys(borradores).map(function(k){return borradores[k];}).sort(function(a,b){return b.actualizado-a.actualizado;}); }
function estadoBorrador(b){
  if (b.enCola) return {txt:'En cola: sin señal', cls:'st-alerta'};
  var an = b.tareas.filter(function(t){return t.analizado;}).length, gu = b.tareas.filter(function(t){return t.guardada;}).length;
  if (an && gu===an && an===b.tareas.length) return {txt:'Guardada', cls:'st-Validada'};
  if (an) return {txt:'Por revisar y guardar', cls:'st-Revisada'};
  return {txt:'En preparación', cls:'st-Borrador'};
}
function abrirBorrador(bid){
  cur = normalizarBorrador(borradores[bid]); paso = borradores[bid].paso || 1;
  if (!cur.centro) cur.centro = cfg.centro;
  if (paso===3 && !cur.tareas.some(function(t){return t.analizado;})) paso = cur.tareas.length ? 2 : 1;
  tab = 'evaluar'; render();
  fotosDB('leer', cur.bid).then(function(f){ if (cur && cur.bid===bid && f){ cur.fotos = f; render(true); } }).then(function(){ setTimeout(reanudarAnalisis, 300); });
}
function nuevaEvaluacion(base){
  if (!cfg.centro && !(base && base.centro)){ abrirSelectorCentro(); toast('Primero abre la instalación de esta evaluación.'); return; }
  cur = Object.assign(nuevoPuesto(), {centro:cfg.centro}, base||{}); paso = cur.puesto ? 2 : 1;
  if (paso===2 && !cur.tareas.length) cur.tareas.push(nuevaTareaItem(base && base.ultimasMedidas || ''));
  delete cur.ultimasMedidas;
  guardarBorrador(); tab = 'evaluar'; render();
}

/* Fotos de cada borrador en IndexedDB (no caben en localStorage) */
function fotosDB(op, bid, fotos){
  return new Promise(function(ok){
    try{
      var rq = indexedDB.open('iper_fotos', 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('f'); };
      rq.onerror = function(){ ok(null); };
      rq.onsuccess = function(){
        var db = rq.result, tx = db.transaction('f', op==='leer'?'readonly':'readwrite'), st = tx.objectStore('f');
        if (op==='leer'){ var g = st.get(bid); g.onsuccess = function(){ ok(g.result||[]); }; g.onerror = function(){ ok([]); }; }
        else if (op==='guardar'){ st.put(fotos, bid); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }
        else { st.delete(bid); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }
      };
    }catch(e){ ok(null); }
  });
}

/* ======================= Servidor ======================= */
/*
 * Si la pantalla se apaga mientras se espera a la IA, la conexión se corta. Por eso:
 * 1) la pantalla se mantiene encendida mientras se trabaja (Wake Lock) y
 * 2) cada solicitud lleva un número (jobId); si la conexión se corta, la app recupera el resultado guardado en el servidor.
 */
var enCurso = {};
function nuevoJob(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function postApi(body){
  return fetch(servidor(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow'})
    .then(function(r){ return r.text(); })
    .then(function(t){ try{ return JSON.parse(t); }catch(e){ var er = new Error('El servidor no respondió bien. Revisa el enlace de acceso.'); er.fatal = true; throw er; } });
}
function esperar(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function recuperarJob(job){
  var intentos = 0, desconocido = 0;
  function paso_(){
    if (job.hecho) return new Promise(function(){});
    intentos++;
    if (intentos > 75) return Promise.reject(new Error('No se pudo recuperar la respuesta. Revisa tu conexión e inténtalo de nuevo.'));
    return postApi({fn:'resultado', args:[job.id], token:String(cfg.token||'').trim()}).then(function(j){
      var r = j.ok ? j.data : {estado:'desconocido'};
      if (r.estado==='listo') return r.respuesta;
      if (r.estado==='grande') return enviarJob(job);
      if (r.estado==='desconocido'){ desconocido++; if (desconocido>=2 && !job.reenviado){ job.reenviado = true; return enviarJob(job); } }
      return esperar(4000).then(paso_);
    }, function(){ return esperar(4000).then(paso_); });
  }
  if (busyOn) $('busySub').textContent = 'Recuperando el resultado…';
  return paso_();
}
function enviarJob(job){
  return postApi({fn:job.fn, args:job.args, token:String(cfg.token||'').trim(), jobId:job.id})
    .catch(function(e){ if (e.fatal) throw e; return recuperarJob(job); });
}
function run(fn){
  var args = Array.prototype.slice.call(arguments,1);
  var m = modo();
  if (m==='demo') return Promise.resolve().then(function(){ return Demo[fn].apply(Demo,args); }).catch(function(e){
    if (/^DEMO:/.test(e.message)){ var q = e.message.slice(5); setTimeout(function(){ busy(false); versionCompleta(q); }, 50); var x = new Error('Disponible en la versión completa.'); x.demo = true; throw x; }
    throw e; });
  if (m==='api'){
    if (!navigator.onLine) return Promise.reject(sinRed());
    var job = {id:nuevoJob(), fn:fn, args:args, inicio:Date.now()};
    enCurso[job.id] = job;
    var base = new Promise(function(res,rej){ job.res = res; job.rej = rej; });
    enviarJob(job).then(job.res, job.rej);

    }, function(e){ job.hecho = true; delete enCurso[job.id]; throw e; });

  }
  return new Promise(function(ok,ko){

/** Valida un RUT chileno (módulo 11). */
function rutValido(rut){
  var r = String(rut||'').replace(/[^0-9kK]/g,'').toUpperCase(); if (r.length<2) return false;
  var cuerpo = r.slice(0,-1), dv = r.slice(-1), suma = 0, mul = 2;
  for (var i=cuerpo.length-1;i>=0;i--){ suma += (+cuerpo[i])*mul; mul = mul===7?2:mul+1; }
  var res = 11-(suma%11), esp = res===11?'0':res===10?'K':String(res);
  return dv===esp;
}

/** Mismas reglas fijas que aplica el servidor. */
function aplicarReglas(r){
  var notas=[];
  if (r.pRes>r.p) r.pRes=r.p; if (r.cRes>r.c) r.cRes=r.c;
  var fuerte = JER_FUERTES.indexOf(r.jerarquia)>=0;
  if (!fuerte && r.cRes<r.c){ r.cRes=r.c; notas.push('La consecuencia no baja con medidas administrativas o EPP.'); }
  if (!fuerte){ var minP = r.p===4?2:1; if (r.pRes<minP){ r.pRes=minP; notas.push('Con medidas administrativas o EPP la probabilidad baja como máximo un nivel.'); } }
  if (r.p*r.c>=16 && r.pRes*r.cRes<=2){ r.pRes = r.cRes>=4?1:(r.cRes===2?2:4); notas.push('Un riesgo Intolerable no puede quedar Tolerable en una sola evaluación.'); }
  if (r.pEsp && r.pEsp*r.cEsp < r.pRes*r.cRes){ r.pEsp=r.pRes; r.cEsp=r.cRes; }
  r.reglas = notas; return r;
}

function getCampo(path){ var a = path.split(':'); return a[0]==='t' ? (cur.tareas[+a[1]]||{})[a[2]]||'' : cur[path]||''; }
function setCampo(path, v){ var a = path.split(':'); if (a[0]==='t'){ var t = cur.tareas[+a[1]]; t[a[2]] = v; if (t.analizado && (a[2]==='tarea'||a[2]==='medidasTexto')) t.cambiada = true; } else cur[path] = v; }

function analizarCola(){

/** Analiza (una por una) las tareas pendientes de una evaluación. Devuelve una promesa. */

function normTxt(x){ return String(x||'').toLowerCase().replace(/[^a-zñáéíóúü0-9]+/g,' ').trim(); }
/**
 * Antes de analizar: la IA corrige la redacción de las tareas pendientes (sin inventar datos)
 * y, la primera vez, sugiere tareas típicas del puesto que no se mencionaron.
 * Devuelve true para seguir con el análisis, o false si la persona prefiere revisar antes.
 */
function prepararTareas(ev){
  if (modo()!=='demo' && (SRV.version||0) < 8) return Promise.resolve(true);
  var pend = pendientesAnalisis(ev), sugerir = !ev.sugeridasVistas;
  busy(true, 'Revisando la redacción', pend.length>1 ? 'Corrigiendo '+pend.length+' descripciones' : 'Corrigiendo la descripción');
  progTramo(0, 15, 9);
  return run('prepararPuesto', {proceso:ev.proceso, puesto:ev.puesto, lugar:ev.lugar, tareas:pend.map(function(t){return t.tarea;}), sugerir:sugerir}).then(function(r){
    pend.forEach(function(t,i){
      var nuevo = String((r.tareas||[])[i]||'').trim();
      if (nuevo && normTxt(nuevo)!==normTxt(t.tarea)){ t.original = t.tarea; t.tarea = nuevo; t.corregida = true; t.verOrig = false; }
    });
    ev.sugeridasVistas = true; if (ev===cur) guardarBorrador();
    progPintar(15);
    var sug = (r.sugeridas||[]).filter(function(x){ return !ev.tareas.some(function(t){ return normTxt(t.tarea)===normTxt(x.tarea); }); });
    if (!sug.length) return true;
    return elegirSugeridas(ev, sug);
  }, function(e){ if (e.sinRed) throw e; return true; }); // si la IA falla aquí, se analiza igual con el texto original
}
function elegirSugeridas(ev, sug){
  return new Promise(function(ok){
    var pct = PROG.v; busy(false);
    abrirSheet(cabecera('¿Hace también estas tareas?', true)+
      '<p class="muted" style="margin-top:0">Suelen ser parte del puesto <b>'+esc(ev.puesto)+'</b> y no están en tu lista. Marca las que sí se realizan en esta instalación.</p>'+
      sug.map(function(x,i){ return '<label class="chk"><input type="checkbox" class="sugChk" data-i="'+i+'"><span>'+esc(x.tarea)+(x.rutinaria===false?' <span class="tag">No rutinaria</span>':'')+
        (x.motivo?'<br><span class="muted">'+esc(x.motivo)+'</span>':'')+'</span></label>'; }).join('')+
      '<p class="muted">Las que agregues usan las medidas actuales de la primera tarea; las podrás ajustar al revisar.</p>'+
      '<button class="btn" id="sugOk">Agregar y analizar</button><div style="height:8px"></div>'+
      '<button class="btn sec" id="sugRev">Agregar y revisarlas antes</button><div style="height:4px"></div>'+
      '<button class="btn ghost" style="width:100%" id="sugNo">Continuar sin agregar</button>', true);
    var tomar = function(){
      var med = ev.tareas[0] ? ev.tareas[0].medidasTexto : '';
      var el = Array.from(document.querySelectorAll('.sugChk')).filter(function(c){return c.checked;}).map(function(c){ return sug[+c.dataset.i]; });
      tomar.nuevas = el.map(function(x){ var t = nuevaTareaItem(med); t.tarea = x.tarea; t.rutinaria = x.rutinaria!==false; t.sugerida = true; ev.tareas.push(t); return t; });
      if (el.length && ev===cur) guardarBorrador();
      return el.length;
    };
    var seguir = function(){ cerrarSheet(); busy(true, 'Preparando el análisis', ''); progPintar(pct); ok(true); };
    $('sugOk').onclick = function(){ var n0 = tomar(); if (n0 && ev===cur){ cerrarSheet(); preguntarEpp(tomar.nuevas, function(){ busy(true,'Preparando el análisis',''); progPintar(pct); ok(true); }); } else seguir(); };
    $('sugNo').onclick = seguir;
    $('sugRev').onclick = function(){
      var n = tomar(); if (!n) return seguir();
      cerrarSheet(); paso = 2; render(); toast(n+(n===1?' tarea agregada':' tareas agregadas')+'. Revisa sus medidas y toca Analizar.', 6000); preguntarEpp(tomar.nuevas); ok(false);
    };
  });
}

/** Analiza (una por una) las tareas pendientes de una evaluación, con avance en porcentaje. Devuelve una promesa. */
function analizarCore(ev, base){
  base = base || 0;
  var lista = pendientesAnalisis(ev), total = lista.length, hechas = 0, varias = ev.tareas.length > 1;
  var ritmo = function(){ var b = base+(100-base)*Math.min(total, hechas+Math.min(3,total-hechas))/total;
    busy(true, total>1 ? 'Analizando '+total+' tareas ('+hechas+' listas)' : 'Analizando la tarea',
      (ev.puesto||'')+(ev.fotos.length?', con '+ev.fotos.length+(ev.fotos.length===1?' foto':' fotos'):'')+'. La pantalla se mantiene encendida.');
    progTramo(base+(100-base)*hechas/total, b, ev.fotos.length ? 22 : 14); };
  function una(t, reintento){
    ritmo();
    var payload = {id:t.id, proceso:ev.proceso, puesto:ev.puesto, tarea:t.tarea, lugar:ev.lugar, rutinaria:t.rutinaria,
      hombres:ev.hombres, mujeres:ev.mujeres, otros:ev.otros, sensibles:ev.sensibles, medidasTexto:t.medidasTexto, ceal:cealCentro(ev.centro),
      variasTareas:varias, epp:t.epp||[], fotos:ev.fotos.map(function(f){return {mime:f.mime,data:f.data};})};
    return run('analizarTarea', payload).then(function(res){
      t.riesgos = res.riesgos; t.observacionesFoto = res.observacionesFoto; t.medidasActuales = res.medidasActuales;
      t.analizado = true; t.cambiada = false; t.guardada = false; t.aceptada = false; hechas++;
      ritmo();
      if (ev===cur) guardarBorrador();
    }, function(e){
      if (!reintento && /límite/i.test(e.message)){
        var s = 30; clearInterval(PROG.iv);
        return new Promise(function(ok){ var iv = setInterval(function(){ busy(true,'Límite gratuito de la IA alcanzado','Reintentando en '+(s--)+' s…'); if (s<0){ clearInterval(iv); ok(); } }, 1000); })
          .then(function(){ return una(t, true); });
      }
      e.hechas = hechas; e.total = total; throw e;
    });
  }
  // Hasta 3 tareas a la vez: el tiempo total baja a casi un tercio (el servidor procesa cada solicitud por separado)
  var cola = lista.slice(), activas = 0, error = null, PARALELO = Math.min(3, total);
  return new Promise(function(ok, ko){
    if (!total) return ok();
    var lanzar = function(){
      if (error) return;
      if (!cola.length && !activas) return ok();
      while (activas < PARALELO && cola.length){
        var t = cola.shift(); activas++;
        una(t).then(function(){ activas--; lanzar(); }, function(e){ activas--; if (!error){ error = e; ko(e); } });
      }
    };
    lanzar();
  }).then(function(){ progPintar(100); return {hechas:hechas, total:total, primera:lista[0]}; });
}

function analizarPendientes(){
  if (!validarPaso1()){ paso=1; render(); return; }
  cur.tareas = cur.tareas.filter(function(t){ return t.tarea.trim() || t.analizado; });
  if (!cur.tareas.length){ cur.tareas.push(nuevaTareaItem()); render(true); return toast('Escribe al menos una tarea.'); }
  if (!pendientesAnalisis().length){ paso = 3; render(); return; }
  if (!online()){
    cur.enCola = true; guardarBorrador(); fotosDB('guardar', cur.bid, cur.fotos);
    toast('Sin señal: la evaluación quedó en cola. Se analizará al volver la conexión.', 6000);
    cur = null; tab = 'inicio'; render(); return;
  }
  pedirPermisoAvisos();
  if (modo()==='demo' || (SRV.version||0) >= 11){ analizarEnServidor(cur); return; }
  var ev = cur;
  prepararTareas(ev).then(function(seguir){
    if (!seguir) return;
    return analizarCore(ev, 15).then(function(r){
      setTimeout(function(){ busy(false); }, 350);
      ev.enCola = false; paso = 3; ev.exp = -1; ev.idx = ev.tareas.indexOf(r.primera); if (ev===cur){ guardarBorrador(); render(); }
      toast(r.total>1 ? r.total+' tareas analizadas. Revisa cada una y guárdalas.' : 'Tarea analizada. Revisa los riesgos y guárdala.');
    });
  }).catch(function(e){
    busy(false); guardarBorrador(); render();
    if (e.sinRed){ cur.enCola = true; guardarBorrador(); fotosDB('guardar', cur.bid, cur.fotos); toast('Se perdió la señal. La evaluación quedó en cola.', 6000); return; }
    toast((e.hechas?'Se analizaron '+e.hechas+' de '+e.total+'. ':'')+e.message+(e.hechas?' Toca "Analizar" para continuar.':''), 8000);
  });
}
function guardarTodas(){
  if (!cur.centro){ toast('Esta evaluación no tiene instalación.'); return; }
  if (!online()){ toast('Guardar necesita conexión. Tu evaluación queda en el teléfono; guárdala al volver la señal.', 6000); return; }
  var lista = cur.tareas.filter(function(t){ return t.analizado && !t.guardada; });
  var conFoto = lista.filter(function(t){ return t.riesgos.some(function(r){return r.confirmado===null;}); });
  if (conFoto.length){ cur.idx = cur.tareas.indexOf(conFoto[0]); render(); toast('Confirma lo visto en las fotos de la Tarea '+(cur.idx+1)+', o usa "Aceptar todo".'); return; }
  var vacias = lista.filter(function(t){ return !t.riesgos.some(function(r){return r.confirmado!==false;}); });
  if (vacias.length){ cur.idx = cur.tareas.indexOf(vacias[0]); render(); toast('La Tarea '+(cur.idx+1)+' no tiene riesgos. Agrega uno o quítala.'); return; }
  var n = 0, riesgos = 0, medidas = 0;
  lista.reduce(function(p, t){
    return p.then(function(){
      busy(true,'Guardando tarea '+(n+1)+' de '+lista.length+'…'); progPintar(n/lista.length*100);
      var copia = {id:t.id, proceso:cur.proceso, puesto:cur.puesto, tarea:t.tarea, lugar:cur.lugar, rutinaria:t.rutinaria,
        hombres:cur.hombres, mujeres:cur.mujeres, otros:cur.otros, sensibles:cur.sensibles, medidasTexto:t.medidasTexto,
        medidasActuales:t.medidasActuales, observacionesFoto:t.observacionesFoto, riesgos:t.riesgos, ceal:cealCentro(cur.centro), epp:t.epp||[]};
      var ci = centroInfo(cur.centro);
      return run('guardarTarea', JSON.parse(JSON.stringify(copia)), {empresa:ci?ci.razonSocial:cfg.empresa, centro:cur.centro, respEjec:cfg.respEjec}).then(function(r){
        t.id = r.id; t.guardada = true; n++; riesgos += r.riesgos; medidas += r.medidas; guardarBorrador();
      });
    });
  }, Promise.resolve()).then(function(){
    busy(false); refrescarConfig(); datos.panel = null; render(true);
    queSigue(n+' tarea(s) guardada(s): '+riesgos+' riesgos y '+medidas+' medidas para seguimiento.');
  }).catch(function(e){ busy(false); render(true); toast((n?n+' tarea(s) guardada(s). ':'')+e.message, 7000); });
}

/* ======================= Medidas ======================= */
function renderMedidas(){
  if (!cfg.centro) return [sinCentro(),''];
  if (!online()) return [sinConexionMsg(),''];
  var L = datos.medidas;
  var h = '<h2>Medidas</h2><p class="sub">El riesgo residual solo se acepta cuando la medida está verificada con evidencia.</p>';
  if (!L) return [h+cargando(),''];
  var filtros = [['abiertas','Abiertas'],['vencidas','Vencidas'],['Implementada','Implementadas'],['Verificada','Verificadas'],['todas','Todas']];
  h += '<div class="chips" style="margin-bottom:12px">'+filtros.map(function(f){
    var n = L.filter(function(m){return pasaFiltro(m,f[0]);}).length;
    return '<button class="chip '+(filtroMed===f[0]?'on':'')+'" data-fmed="'+f[0]+'">'+f[1]+' ('+n+')</button>'; }).join('')+'</div>';
  var vis = L.filter(function(m){return pasaFiltro(m,filtroMed);});
  if (!vis.length) return [h+'<div class="empty">No hay medidas en este filtro.</div>',''];
  h += vis.map(function(m){
    return '<div class="card risk bl-'+m.nivelInicial+'"><div class="fam">'+esc(m.puesto)+', '+esc(m.riesgo)+'</div>'+
      '<div class="rname">'+esc(m.medida)+'</div>'+
      '<div style="margin:6px 0"><span class="tag">'+esc(m.jerarquia)+'</span><span class="st st-'+m.estado+'">'+m.estado+'</span> '+
      (m.vencida?'<span class="st st-alerta">Vencida '+fecha(m.plazo)+'</span>':'<span class="muted">Plazo '+fecha(m.plazo)+'</span>')+'</div>'+
      '<div class="lbl" style="margin:8px 0 4px"><span class="muted">Ejecuta: <b style="color:var(--ink)">'+esc(nc(m.responsable, m.responsableCargo)||'Sin asignar')+'</b></span>'+
        (puede('evaluador')?'<button class="chip" data-mresp="'+m.id+'">Cambiar</button>':'')+'</div>'+
      '<div class="muted">Verificador: '+esc(m.verificador)+'</div>'+
      (m.evidencia?'<div style="margin-top:6px"><a href="'+esc(m.evidencia)+'" target="_blank" rel="noopener">Ver evidencia</a></div>':'')+
      (puede('evaluador')?'<div class="acts">'+
        (m.estado==='Pendiente'?'<button class="chip" data-mest="Implementada" data-id="'+m.id+'">Marcar implementada</button>':'')+
        (m.estado!=='Verificada'?'<button class="chip on" data-verif="'+m.id+'">'+ico('foto')+'Verificar con foto</button>':'')+
        (m.estado!=='Pendiente'?'<button class="chip" data-mest="Pendiente" data-id="'+m.id+'">Volver a pendiente</button>':'')+
        (puede('validador')?'<button class="chip" data-delmed="'+m.id+'" style="color:var(--int)">'+ico('borrar')+'Eliminar</button>':'')+
      '</div>':'')+'</div>';
  }).join('');
  return [h,''];
}
function pasaFiltro(m,f){
  if (f==='todas') return true; if (f==='abiertas') return m.estado!=='Verificada'; if (f==='vencidas') return m.vencida; return m.estado===f;
}

function iniciarConSesion(r){
  cfg.token = r.token; cfg.demo = false; save('iper_cfg', cfg);
  SRV.usuario = null; try{ localStorage.removeItem('iper_srv'); }catch(e){}
  busy(true,'Cargando tu cuenta…');
  busy(false); tab = 'centros'; init2();
}
function cerrarSesionLocal(msg){
  cfg.token = ''; save('iper_cfg', cfg); SRV.usuario = null; SRV.centros = []; cfg.centro = ''; cur = null;
  try{ localStorage.removeItem('iper_srv'); }catch(e){}
  ACC.vista = 'ingresar'; tab = 'acceso'; render(); if (msg) toast(msg, 6000);
}
function accionAcceso(id){
  var v = function(k){ var el = $(k); return el ? el.value.trim() : ''; };
  var fallo = function(e){ busy(false); toast(e.message, 6000); };
  if (id==='acDemo'){ cfg.demo = true; save('iper_cfg', cfg); tab = 'centros'; init2(); return; }
  if (id==='acIngresar'){
    ACC.correo = v('acCorreo'); if (!ACC.correo || !$('acClave').value) return toast('Escribe tu correo y contraseña.');
    busy(true,'Ingresando…');
    run('ingresar', ACC.correo, $('acClave').value).then(function(r){ busy(false); if (r.pendiente){ ACC.vista = 'verificar'; render(); toast('Tu cuenta no está activada: te enviamos un código.'); } else iniciarConSesion(r); }, fallo);
  }
  if (id==='acRegistrar'){
    var d = {nombre:v('rgNom'), rut:v('rgRut'), cargo:v('rgCar'), registro:v('rgReg'), telefono:v('rgTel'), correo:v('rgCorreo'), clave:$('rgClave').value, acepta:$('rgAcepta').checked};
    if (d.nombre.split(/\s+/).length<2) return toast('Escribe tu nombre y apellido.');
    if (!rutValido(d.rut)) return toast('Revisa el RUT.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(d.correo)) return toast('Revisa el correo.');
    if (d.clave.length<8 || !/[a-zA-Z]/.test(d.clave) || !/\d/.test(d.clave)) return toast('La contraseña debe tener al menos 8 caracteres, con letras y números.');
    if (d.clave!==$('rgClave2').value) return toast('Las contraseñas no coinciden.');
    if (!d.acepta) return toast('Debes aceptar los términos y la política de privacidad.');
    d.rut = formatoRut(d.rut); busy(true,'Creando tu cuenta…');
    run('registrarCuenta', d).then(function(r){ busy(false); ACC.correo = r.correo; ACC.vista = 'verificar'; render(); }, fallo);
  }
  if (id==='acVerificar'){
    if (!/^\d{6}$/.test(v('acCodigo'))) return toast('El código tiene 6 dígitos.');
    busy(true,'Activando…'); run('verificarCuenta', ACC.correo, v('acCodigo')).then(function(r){ busy(false);
      if (r.pendienteAprobacion){ ACC.vista = 'pendiente'; render(); return; }
      toast('Cuenta activada. ¡Bienvenido/a!'); iniciarConSesion(r); }, fallo);
  }
  if (id==='acReenviar'){ busy(true,'Enviando…'); run('reenviarCodigo', ACC.correo, ACC.vista==='restablecer'?'clave':'activar').then(function(){ busy(false); toast('Te enviamos un código nuevo.'); }, fallo); }
  if (id==='acRecuperar'){
    ACC.correo = v('acCorreo'); if (!ACC.correo) return toast('Escribe tu correo.');
    busy(true,'Enviando…'); run('recuperarClave', ACC.correo).then(function(){ busy(false); ACC.vista = 'restablecer'; render(); }, fallo);
  }
  if (id==='acRestablecer'){
    var n = $('acNueva').value;
    if (!/^\d{6}$/.test(v('acCodigo'))) return toast('El código tiene 6 dígitos.');
    if (n.length<8 || !/[a-zA-Z]/.test(n) || !/\d/.test(n)) return toast('La contraseña debe tener al menos 8 caracteres, con letras y números.');
    if (n!==$('acNueva2').value) return toast('Las contraseñas no coinciden.');
    busy(true,'Guardando…'); run('restablecerClave', ACC.correo, v('acCodigo'), n).then(function(r){ busy(false); toast('Contraseña cambiada.'); iniciarConSesion(r); }, fallo);
  }
}

function lineas(t){ return String(t||'').split('\n').map(function(x){ return x.replace(/^[•\-\d.)\s]+/,'').trim(); }).filter(String); }
function pares(t, a, b){ return lineas(t).map(function(l){ var k = l.split(/\s[—–-]\s|:\s/); var o = {}; o[a] = k[0].trim(); o[b] = k.slice(1).join(' — ').trim(); return o; }); }
function abrirFichaPuesto(puesto, regenerar){
  busy(true, regenerar?'Redactando de nuevo la ficha':'Preparando la ficha del puesto', puesto+'. Se hace una sola vez por puesto. Puedes usar otras apps: te avisaremos.'); progTramo(0, 100, 30);
  pedirPermisoAvisos();
  run('fichaPuesto', cfg.centro, puesto, !!regenerar).then(function(f){ busy(false); editarFicha(puesto, f); if (!f.guardada) avisar('Ficha del puesto lista', puesto+': revísala y guárdala.', 'ficha'); })
    .catch(function(e){ busy(false); toast(e.message, 7000); });
}

/** Genera la carpeta (PDF) de una o varias personas. Sin IA: usa la IRL guardada del puesto. */
function abrirDocumentos(ids){
  if (enDemo()) return versionCompleta('Generar los documentos de la carpeta del trabajador');
  var D = datos.personal || {personas:[], puestos:[]}, varios = !ids;
  var personas = varios ? D.personas : D.personas.filter(function(p){ return ids.indexOf(p.id)>=0; });
  var sinFicha = function(p){ return !D.puestos.some(function(k){ return k.puesto===p.puesto && k.ficha; }); };
  if (!varios && personas[0] && sinFicha(personas[0])) { toast('Primero prepara la ficha del puesto '+personas[0].puesto+'.', 5000, 'Preparar', function(){ abrirFichaPuesto(personas[0].puesto); }); return; }
  var hoy = new Date(), iso = hoy.getFullYear()+'-'+('0'+(hoy.getMonth()+1)).slice(-2)+'-'+('0'+hoy.getDate()).slice(-2);
  abrirSheet(cabecera(varios?'Documentos de varias personas':'Documentos de '+esc(personas[0].nombre))+

    lab('Documentos')+modulosVisibles().map(function(m){ return '<label class="chk" style="margin:6px 0"><input type="checkbox" class="dcM" value="'+m[0]+'" checked><span>'+m[1]+'</span></label>'; }).join('')+
    lab('Fecha de los documentos', 'Fecha de actualización y de entrega que aparece en los documentos.')+'<input type="date" id="dcFec" value="'+iso+'">'+
    '<label class="chk"><input type="checkbox" id="dcEnv"><span>Enviarme también los PDF por correo</span></label>'+
    '<p class="muted">Se guardan en la carpeta Trabajadores de la instalación, en Drive. Imprímelos para la firma y huella de cada persona.</p>'+
    '<button class="btn" id="dcOk">'+ico('firma')+'Generar PDF</button>');
  $('dcOk').onclick = function(){
    var mods = Array.from(document.querySelectorAll('.dcM')).filter(function(c){return c.checked;}).map(function(c){return c.value;});
    var lista = varios ? Array.from(document.querySelectorAll('.dcP')).filter(function(c){return c.checked;}).map(function(c){return c.value;}) : ids;
    if (!mods.length) return toast('Marca al menos un documento.');
    if (!lista.length) return toast('Marca al menos una persona.');
    var fec = $('dcFec').value, env = $('dcEnv').checked, hechos = [], n = 0;
    cerrarSheet();
    lista.reduce(function(p, id){ return p.then(function(){
      var per = D.personas.filter(function(k){return k.id===id;})[0] || {};
      busy(true, lista.length>1 ? 'Generando documentos '+(n+1)+' de '+lista.length : 'Generando documentos', per.nombre||''); progTramo(n/lista.length*100, (n+1)/lista.length*100, 12);
      return run('generarDocumentos', {trabajadorId:id, modulos:mods, fecha:fec, enviar:env}).then(function(r){ n++; hechos.push({nombre:per.nombre, url:r.url}); });
    }); }, Promise.resolve()).then(function(){
      busy(false); cargar('personal'); avisar('Documentos listos', hechos.length+(hechos.length===1?' carpeta generada':' carpetas generadas'), 'docs');
      abrirSheet('<div style="text-align:center;padding:6px 4px"><div class="okbig">'+ico('ok')+'</div><h2>Documentos listos</h2><p class="muted">'+hechos.length+(hechos.length===1?' carpeta generada':' carpetas generadas')+(env?' y enviadas a tu correo':'')+'.</p></div>'+
        '<div class="list">'+hechos.map(function(x){ return '<a class="li" href="'+esc(x.url)+'" target="_blank" rel="noopener" style="text-decoration:none"><span class="tx"><b>'+esc(x.nombre)+'</b><span>Abrir PDF</span></span><span class="chev">'+ico('chev')+'</span></a>'; }).join('')+'</div>'+
        '<button class="btn" onclick="cerrarSheet()">Listo</button>');
    }).catch(function(e){ busy(false); cargar('personal'); toast((n?n+' generada(s). ':'')+e.message, 7000); });
  };
}

/* ======================= EPP por tarea ======================= */
var EPP_FRECUENTES = ['Zapatos de seguridad','Casco de seguridad','Guantes de cabritilla','Guantes multiflex','Guantes de nitrilo','Lentes de seguridad','Antiparras','Protector auditivo',
  'Mascarilla o respirador','Chaleco reflectante','Arnés de seguridad','Ropa de trabajo','Protector solar','Legionario o cubrenuca','Careta facial','Ropa impermeable'];
function eppDelPuesto(excepto){ var l = []; cur.tareas.forEach(function(t){ if (t===excepto) return; (t.epp||[]).forEach(function(e){ if (l.indexOf(e)<0) l.push(e); }); }); return l; }
function chipsEpp(t, k){
  return '<label class="lbl"><span>EPP que usa en esta tarea'+ayuda('Elementos de protección personal que la persona usa hoy en esta tarea. Se usan en el análisis y en el registro de entrega de EPP.')+'</span></label>'+
    '<div class="chips">'+(t.epp||[]).map(function(e,i){ return '<span class="chip on">'+esc(e)+'<button type="button" class="x" style="font-size:16px;padding:0 0 0 4px" data-qepp="'+k+':'+i+'" aria-label="Quitar">×</button></span>'; }).join('')+
    '<button class="chip" type="button" data-addepp="'+k+'">'+ico('mas')+'EPP</button></div>';
}
function elegirEpp(k){
  var t = cur.tareas[k], sel = (t.epp||[]).slice(), opciones = EPP_FRECUENTES.concat(eppDelPuesto(null)).filter(function(e,i,a){ return a.indexOf(e)===i; });
  var pintar = function(){ $('epLista').innerHTML = opciones.map(function(e){ return '<button type="button" class="chip'+(sel.indexOf(e)>=0?' on':'')+'" data-ep="'+esc(e)+'">'+esc(e)+'</button>'; }).join('');
    $('epLista').querySelectorAll('[data-ep]').forEach(function(b){ b.onclick = function(){ var e = b.dataset.ep, i = sel.indexOf(e); if (i>=0) sel.splice(i,1); else sel.push(e); pintar(); }; }); };
  abrirSheet(cabecera('EPP de la tarea '+(k+1))+'<div class="chips" id="epLista"></div>'+lab('Otro EPP')+
    '<div class="row"><div style="flex:2"><input type="text" id="epOtro" autocomplete="off"></div><div><button class="btn sec" type="button" id="epAdd">Agregar</button></div></div>'+
    '<div style="height:14px"></div><button class="btn" id="epOk">Listo</button>');
  pintar();
  $('epAdd').onclick = function(){ var e = $('epOtro').value.trim(); if (!e) return; if (opciones.indexOf(e)<0) opciones.push(e); if (sel.indexOf(e)<0) sel.push(e); $('epOtro').value=''; pintar(); };
  $('epOk').onclick = function(){ t.epp = sel; if (t.analizado) t.cambiada = true; guardarBorrador(); cerrarSheet(); render(true); };
}
/** Al agregar tareas nuevas: pregunta qué EPP de las otras tareas del puesto se repiten (no se copian solos). */
function preguntarEpp(nuevas, listo){
  var disp = []; cur.tareas.forEach(function(t){ if (nuevas.indexOf(t)>=0) return; (t.epp||[]).forEach(function(e){ if (disp.indexOf(e)<0) disp.push(e); }); });
  if (!disp.length || !nuevas.length){ if (listo) listo(); return; }
  var sel = nuevas.map(function(t){ return (t.epp||[]).slice(); });
  var pintar = function(){ $('peLista').innerHTML = nuevas.map(function(t,i){
      return '<div class="card" style="padding:12px"><div class="muted" style="margin-bottom:8px"><b style="color:var(--ink)">Tarea '+(cur.tareas.indexOf(t)+1)+'</b>'+(t.tarea?': '+esc(t.tarea.slice(0,90))+(t.tarea.length>90?'…':''):'')+'</div><div class="chips">'+
        disp.map(function(e){ return '<button type="button" class="chip'+(sel[i].indexOf(e)>=0?' on':'')+'" data-pe="'+i+'" data-e="'+esc(e)+'">'+esc(e)+'</button>'; }).join('')+'</div></div>'; }).join('');
    $('peLista').querySelectorAll('[data-pe]').forEach(function(b){ b.onclick = function(){ var s = sel[+b.dataset.pe], e = b.dataset.e, j = s.indexOf(e); if (j>=0) s.splice(j,1); else s.push(e); pintar(); }; }); };
  abrirSheet(cabecera('¿Qué EPP se repiten?', true)+'<p class="muted" style="margin-top:0">Estos EPP ya se usan en otras tareas del puesto. Marca los que también se usan en '+(nuevas.length>1?'cada tarea nueva':'la tarea nueva')+'.</p><div id="peLista"></div>'+
    '<button class="btn" id="peOk">Aplicar</button><button class="btn ghost" style="width:100%;margin-top:6px" id="peNo">Ninguno se repite</button>', true);
  pintar();
  var fin = function(aplicar){ if (aplicar) nuevas.forEach(function(t,i){ t.epp = sel[i]; }); guardarBorrador(); cerrarSheet(); render(true); if (listo) listo(); };
  $('peOk').onclick = function(){ fin(true); }; $('peNo').onclick = function(){ fin(false); };
}

/** Pide permiso para avisar (debe llamarse al tocar un botón). */
function pedirPermisoAvisos(){
  try{ if ('Notification' in window && Notification.permission==='default') Notification.requestPermission().catch(function(){}); }catch(e){}
}
/** Avisa en el teléfono que terminó un trabajo largo (si la app no está a la vista) y vibra. */
function avisar(titulo, cuerpo, tag){
  try{ if (navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
  if (document.visibilityState==='visible') return;
  try{
    if (!('Notification' in window) || Notification.permission!=='granted') return;
    var op = {body:cuerpo||'', tag:tag||'iper', icon:'icon-192.png', badge:'icon-192.png', renotify:true, data:{url:location.href}};
    if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(function(r){ r.showNotification(titulo, op); }).catch(function(){ new Notification(titulo, op); });

/** Igual que run(), pero con un identificador de trabajo fijo: si la app se cierra, el resultado se recupera al volver. */
function runJob(id, fn){
  var args = Array.prototype.slice.call(arguments,2);
  if (modo()!=='api') return run.apply(null, [fn].concat(args));
  if (!navigator.onLine) return Promise.reject(sinRed());
  var job = {id:id, fn:fn, args:args, inicio:Date.now()};
  enCurso[job.id] = job;
  var base = new Promise(function(res,rej){ job.res = res; job.rej = rej; });
  enviarJob(job).then(job.res, job.rej);
  return base.then(function(j){
    job.hecho = true; delete enCurso[job.id];
    if (!j.ok){
      if (/^SESION:/.test(j.error)){ var msg = j.error.replace(/^SESION:\s*/,''); setTimeout(function(){ cerrarSesionLocal(msg); }, 0); var es = new Error(msg); es.sesion = true; throw es; }
      throw new Error(j.error);
    }
    return j.data;
  }, function(e){ job.hecho = true; delete enCurso[job.id]; throw e; });
}
function payloadPuesto(ev, lista){

    ceal:cealCentro(ev.centro), sugerir:!ev.sugeridasVistas, corregir:true, fotos:ev.fotos.map(function(f){ return {mime:f.mime, data:f.data}; }),
    tareas:lista.map(function(t){ return {id:t.id, tarea:t.tarea, rutinaria:t.rutinaria, medidasTexto:t.medidasTexto, epp:t.epp||[]}; })};

/**
 * Corrección de redacción + análisis de todas las tareas en el servidor, en una sola solicitud.
 * Sigue aunque se bloquee el teléfono o se use otra app; al terminar avisa con una notificación.
 */
function analizarEnServidor(ev, reanudar){
  var lista = reanudar ? ev.job.tareas.map(function(k){ return ev.tareas[k]; }).filter(Boolean) : pendientesAnalisis(ev);
  if (!lista.length){ ev.job = null; guardarBorrador(); return Promise.resolve(); }
  if (!reanudar) ev.job = {id:nuevoJob(), inicio:Date.now(), tareas:lista.map(function(t){ return ev.tareas.indexOf(t); })};
  if (ev===cur) guardarBorrador();
  var n = lista.length, est = 14 + Math.ceil(n/4)*16 + (ev.fotos.length?10:0);
  busy(true, n>1 ? 'Corrigiendo y analizando '+n+' tareas' : 'Corrigiendo y analizando la tarea',
    'Puedes usar otras apps o bloquear el teléfono: te avisaremos cuando termine.');
  var trans = Math.max(0, (Date.now()-ev.job.inicio)/1000);
  progTramo(Math.min(90, trans/est*100), 100, Math.max(6, est-trans));
  return runJob(ev.job.id, 'analizarPuesto', payloadPuesto(ev, lista)).then(function(r){
    var bien = 0, fallas = 0;
    lista.forEach(function(t, i){
      var x = r.tareas[i] || {};
      if (x.corregida){ t.original = t.tarea; t.tarea = x.corregida; t.corregida = true; t.verOrig = false; }
      if (x.error){ fallas++; return; }
      t.riesgos = x.riesgos; t.observacionesFoto = x.observacionesFoto; t.medidasActuales = x.medidasActuales;
      t.analizado = true; t.cambiada = false; t.guardada = false; t.aceptada = false; bien++;
    });
    ev.sugeridasVistas = true;
    ev.sugeridas = (r.sugeridas||[]).filter(function(x){ return !ev.tareas.some(function(t){ return normTxt(t.tarea)===normTxt(x.tarea); }); });
    ev.job = null; ev.enCola = false;
    if (bien){ paso = 3; ev.exp = -1; var pri = lista.filter(function(t){ return t.analizado; })[0]; ev.idx = Math.max(0, ev.tareas.indexOf(pri)); }
    guardarBorrador(); progPintar(100);
    setTimeout(function(){ busy(false); }, 300);
    if (ev===cur) render();
    var msg = fallas ? bien+' de '+n+' tareas analizadas. Toca Analizar para terminar las demás.' : (n>1 ? n+' tareas analizadas. Revisa cada una y guárdalas.' : 'Tarea analizada. Revisa los riesgos y guárdala.');
    toast(msg, 6000);
    avisar(fallas ? 'Análisis incompleto' : 'Análisis listo', (ev.puesto||'Puesto')+': '+msg, 'analisis');
  }).catch(function(e){
    busy(false);
    if (e.sinRed){ ev.enCola = true; guardarBorrador(); fotosDB('guardar', ev.bid, ev.fotos); toast('Se perdió la señal. Al volver, la app recupera el resultado.', 6000); return; }
    ev.job = null; guardarBorrador(); render();
    toast(e.message, 8000); avisar('No se pudo analizar', e.message, 'analisis');
  });
}
/** Al abrir la app o una evaluación: si había un análisis en curso, recupera su resultado. */
function reanudarAnalisis(){
  if (!cur || !cur.job || busyOn) return;
  if (Date.now()-cur.job.inicio > 6*3600e3){ cur.job = null; guardarBorrador(); return; }
  analizarEnServidor(cur, true);
}

/** Pad de firma en pantalla. */
function padFirma(cv, btnLimpiar){
  var ctx = cv.getContext('2d'), dibujado = false, dib = false, last = null, ratio = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * ratio; cv.height = cv.clientHeight * ratio;
  ctx.scale(ratio, ratio); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  var pos = function(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown', function(e){ dib = true; last = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', function(e){ if (!dib) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; dibujado = true; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ dib = false; }); });
  btnLimpiar.onclick = function(e){ e.preventDefault(); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); dibujado = false; };
  return { vacia:function(){ return !dibujado; }, png:function(){ return cv.toDataURL('image/png').split(',')[1]; } };
}

/* ======================= Fotos ======================= */
function procesarFoto(file, max, png){
  max = max || 1280;
  return new Promise(function(ok,ko){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height, k = Math.min(1, max/Math.max(w,h));
        var cv = document.createElement('canvas'); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var big = png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.72);
        var t = document.createElement('canvas'), tk = 200/Math.max(cv.width,cv.height);
        t.width = Math.round(cv.width*tk); t.height = Math.round(cv.height*tk);
        t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
        ok({mime: png?'image/png':'image/jpeg', data:big.split(',')[1], thumb:t.toDataURL('image/jpeg',0.7)});
      };
      img.onerror = function(){ ko(new Error('No se pudo leer la imagen')); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* ======================= Configuración ======================= */
function aplicarConfig(c){
  SRV = Object.assign(SRV, c); CATMAP = {}; (SRV.catalogo||[]).forEach(function(x){ CATMAP[x.c]=x; });
  if (modo()!=='demo') save('iper_srv', {catalogo:SRV.catalogo, listas:SRV.listas, usuario:SRV.usuario, logo:SRV.logo, version:SRV.version, centros:SRV.centros});
  var ci = centroInfo(cfg.centro); if (ci && cfg.empresa!==ci.razonSocial){ cfg.empresa = ci.razonSocial; save('iper_cfg', cfg); }
  if (cfg.centro && centroInfo(cfg.centro) && cfg.centro!==centroInfo(cfg.centro).id){ cfg.centro = centroInfo(cfg.centro).id; save('iper_cfg', cfg); }
  Object.keys(borradores).forEach(function(k){ var b = borradores[k], c = centroInfo(b.centro); if (c && b.centro!==c.id){ b.centro = c.id; save('iper_borradores', borradores); } });
  if (!cfg.centro && (SRV.centros||[]).length===1){ cfg.centro = SRV.centros[0].id; cfg.empresa = SRV.centros[0].razonSocial; save('iper_cfg', cfg); }
  if (modo()!=='demo' && c.usuario && c.usuario.tipo==='cuenta' && [c.usuario.correo].concat(c.usuario.correosDestino||[]).indexOf(cfg.email)<0){ cfg.email = c.usuario.correo; save('iper_cfg', cfg); }
  if (modo()!=='demo' && !cfg.email && c.email){ cfg.email = c.email; save('iper_cfg', cfg); }
}
function refrescarConfig(){ run('getConfig').then(function(c){ aplicarConfig(c); pintarCabecera(); }).catch(function(){}); }
function probarConexion(){
  if (modo()!=='api') return toast('Completa la URL y el código de acceso.');
  busy(true,'Probando conexión…');
  run('getConfig').then(function(c){
    busy(false); aplicarConfig(c);
    if (!c.version || c.version<12) toast('Conectado, pero el servidor es una versión anterior. Actualiza Código.gs.', 7000);
    else toast('Conectado como '+c.usuario.nombre+' ('+c.usuario.rolTxt+').');
    render(true);
  }).catch(function(e){ busy(false); toast(e.message); });
}
/** Lee el enlace de acceso (?c=...) y configura la conexión automáticamente. */
function leerEnlaceAcceso(){
  var m = location.search.match(/[?&]c=([^&#]+)/);
  if (!m) return false;
  try{
    var d = JSON.parse(deB64url(decodeURIComponent(m[1])));
    if (!d.u || !d.k) throw 0;
    var cambio = cfg.token && cfg.token!==d.k;
    cfg.apiUrl = d.u; cfg.token = d.k; save('iper_cfg', cfg);
    try{ localStorage.removeItem('iper_srv'); }catch(e){}
    SRV.usuario = null;
    history.replaceState(null, '', location.pathname);
    return cambio ? 'cambio' : 'nuevo';
  }catch(e){ history.replaceState(null, '', location.pathname); toast('El enlace de acceso no es válido. Pide uno nuevo.'); return false; }
}
/** Sube a la base de datos las tareas que la versión 1 guardaba solo en el teléfono. */
function migrarV1(){
  var viejas = load('iper_tareas', []);
  if (!viejas.length || modo()==='demo' || !cfg.centro || !puede('evaluador')) return;
  var n = 0;
  viejas.reduce(function(p, t){
    return p.then(function(){ return run('guardarTarea', t, {empresa:cfg.empresa, centro:cfg.centro, respEjec:cfg.respEjec}).then(function(){ n++; }); });
  }, Promise.resolve()).then(function(){
    save('iper_tareas', []); toast(n+' tarea(s) de la versión anterior se pasaron a la matriz de '+nomC(cfg.centro)+'.'); refrescarConfig();
  }).catch(function(e){ toast('No se pudieron pasar las tareas anteriores: '+e.message); });
}

/* ======================= Cumplimiento ======================= */
function accionCumplimiento(i){
  var it = datos.cumpl.items[i];
  if (it.accion==='matriz') irA('matriz');
  else if (it.accion==='medidas'){ filtroMed = /vencida/.test(it.detalle) ? 'vencidas' : 'abiertas'; irA('medidas'); }
  else if (it.accion==='personal'){ irA('personal'); }
  else if (it.accion==='autorizar'){ irA('matriz'); if (puede('validador')) setTimeout(function(){ if (datos.tareas) abrirAutorizacion(); }, 1200); else toast('Pide a quien valida la matriz que la autorice y firme.'); }
  else if (it.accion==='centro'){
    var sec = it.id==='ficha' ? (fichaFaltantes(centroInfo(cfg.centro)).indexOf('número de trabajadores')>=0 && fichaFaltantes(centroInfo(cfg.centro)).length===1 ? 'personas' : 'empresa') : 'org';
    if (puede('validador')) abrirCentro(cfg.centro, sec); else toast('Pide a quien administra la instalación que complete su ficha.'); }
  else if (it.accion==='enviar'){ enviar(); }
  else if (it.accion==='protocolo'){
    abrirSheet(cabecera('Protocolo')+'<h3>'+esc(it.protocolo)+'</h3><p>'+esc(it.ok?'Marcado como gestionado.':it.detalle)+'</p>'+
      '<p class="muted">Gestiónalo con tu organismo administrador (mutualidad o ISL) y márcalo cuando esté implementado.</p>'+
      (puede('evaluador')?'<button class="btn'+(it.ok?' sec':'')+'" id="protBtn">'+(it.ok?'Marcar como pendiente':'Marcar como gestionado')+'</button>':''));
    if ($('protBtn')) $('protBtn').onclick = function(){
      busy(true,'Guardando…');
      run('marcarProtocolo', cfg.centro, it.protocolo, !it.ok).then(function(){ busy(false); cerrarSheet(); cargar('cumpl'); }).catch(function(e){ busy(false); toast(e.message); });
    };
  }
}

/* ======================= Biblioteca: puestos tipo y tareas validadas ======================= */
var BIBLIO = null;
function abrirBiblioteca(){
  if (!online()) return toast('La biblioteca necesita conexión.');
  var mostrar = function(){
    var h = cabecera('Puestos tipo')+'<p class="muted" style="margin-top:0">Elige un puesto y marca las tareas que aplican. Las tareas que ya validaste se pueden usar sin volver a analizarlas.</p>';
    var fila = function(g,k){ return '<button class="li" data-bib="'+k+'"><span class="tx"><b>'+esc(g.puesto)+'</b><span>'+g.tareas.length+(g.tareas.length===1?' tarea':' tareas')+(g.centros?', validado en '+esc(g.centros.join(', ')):'')+'</span></span><span class="chev">'+ico('chev')+'</span></button>'; };
    if (BIBLIO.validadas.length) h += '<div class="grp">De tus matrices validadas</div><div class="list">'+BIBLIO.validadas.map(function(g,i){ return fila(g,'v'+i); }).join('')+'</div>';
    h += '<div class="grp">Puestos frecuentes</div><div class="list">'+BIBLIO.tipo.map(function(g,i){ return fila(g,'t'+i); }).join('')+'</div>';
    abrirSheet(h);
  };
  if (BIBLIO) return mostrar();
  busy(true,'Cargando biblioteca…');
  run('listarBiblioteca', cfg.centro).then(function(b){ busy(false); BIBLIO = b; mostrar(); }).catch(function(e){ busy(false); toast(e.message); });
}
function elegirPuestoBiblio(key){
  var validada = key[0]==='v', g = validada ? BIBLIO.validadas[+key.slice(1)] : BIBLIO.tipo[+key.slice(1)];
  var h = cabecera(esc(g.puesto))+(validada?'<p class="muted" style="margin-top:0">Evaluadas y validadas en: '+esc(g.centros.join(', '))+'</p>':'')+
    g.tareas.map(function(t,i){ return '<label class="chk">'+
      '<input type="checkbox" class="bibChk" data-i="'+i+'" checked><span>'+esc(t.tarea)+(t.medidas?'<br><span class="muted">Medidas: '+esc(t.medidas)+'</span>':'')+'</span></label>'; }).join('');
  if (validada) h += '<label class="chk" style="background:var(--act-soft);margin-top:12px"><input type="checkbox" id="bibUsarEval" checked><span>Usar la evaluación ya validada, sin volver a analizar. Podrás ajustarla.</span></label>';
  h += '<div style="height:12px"></div><button class="btn" id="bibOk">Usar tareas seleccionadas</button>';
  abrirSheet(h);
  $('bibOk').onclick = function(){
    var elegidas = Array.from(document.querySelectorAll('.bibChk')).filter(function(c){return c.checked;}).map(function(c){ return g.tareas[+c.dataset.i]; });
    if (!elegidas.length) return toast('Marca al menos una tarea.');
    var usarEval = validada && $('bibUsarEval') && $('bibUsarEval').checked;
    if (!cur.puesto.trim()) cur.puesto = g.puesto.replace(/\/a\b/,'');
    if (!cur.proceso.trim() && g.proceso) cur.proceso = g.proceso;
    cur.tareas = cur.tareas.filter(function(t){ return t.tarea.trim() || t.analizado; });
    var agregar = function(lista){
      lista.forEach(function(x){ cur.tareas.push(x); });
      guardarBorrador(); cerrarSheet(); paso = 2; render(); setTimeout(function(){ preguntarEpp(lista.filter(function(t){ return !(t.epp||[]).length; })); }, 400);
      toast(lista.length+' tarea(s) agregada(s).'+(usarEval?' Las evaluaciones validadas quedan listas en Resultados.':' Revisa sus medidas y analiza.'), 5000);
    };
    if (!usarEval) return agregar(elegidas.map(function(x){ var t = nuevaTareaItem(x.medidas); t.tarea = x.tarea; t.rutinaria = x.rutinaria!==false; return t; }));
    busy(true,'Cargando evaluaciones validadas…');
    Promise.all(elegidas.map(function(x){ return run('obtenerTarea', x.id); })).then(function(ds){
      busy(false);
      agregar(ds.map(function(d){
        var t = nuevaTareaItem(d.medidasTexto||'');
        Object.assign(t, {tarea:d.tarea, epp:d.epp||[], rutinaria:d.rutinaria!==false, riesgos:(d.riesgos||[]).map(function(r){ r.confirmado = true; return r; }),
          medidasActuales:d.medidasActuales||[], observacionesFoto:'', analizado:true, aceptada:true});
        return t;
      }));
    }).catch(function(e){ busy(false); toast(e.message); });
  };
}
