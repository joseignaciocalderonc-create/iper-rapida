<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#16202b">
<title>IPER Rápida</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f3f1ec; --card:#ffffff; --ink:#16202b; --muted:#66707c; --line:#e2ded6;
    --brand:#16202b; --accent:#e8590c; --accent-ink:#ffffff;
    --tol:#3f9b4a; --mod:#d9a400; --imp:#e8740c; --int:#d0342c;
    --tol-bg:#e5f3e3; --mod-bg:#fdf4cf; --imp-bg:#fde6d2; --int-bg:#fadbd8;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:12px 16px 0}
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;letter-spacing:.3px;font-size:18px;display:flex;align-items:center;gap:8px}
  .logo i{display:inline-block;width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent) 50%,#ffd43b 50%)}
  .demo{font-size:11px;background:#ffd43b;color:#16202b;border-radius:99px;padding:2px 8px;font-weight:700}
  nav{display:flex;gap:4px;margin-top:10px}
  nav button{flex:1;background:none;border:0;color:#aeb8c4;font:inherit;font-size:13.5px;font-weight:600;padding:10px 2px;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:#fff;border-color:var(--accent)}
  nav .cnt{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:4px}
  main{padding:14px 14px 110px;max-width:680px;margin:0 auto}
  h2{font-size:19px;margin:6px 0 4px} h3{font-size:15px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px}
  input[type=text],input[type=email],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:#fbfaf7;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);background:#fff}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:10px} .row>*{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink)}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost{background:none;color:var(--accent);padding:10px;width:auto}
  .btn:disabled{opacity:.5}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(243,241,236,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:15}
  .bar .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
  .steps{display:flex;gap:6px;margin:4px 0 14px}
  .steps span{flex:1;height:5px;border-radius:9px;background:var(--line)} .steps span.on{background:var(--accent)}
  .toggle{display:flex;background:#fbfaf7;border:1px solid var(--line);border-radius:10px;padding:3px}
  .toggle button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:inherit;font-weight:600;color:var(--muted)}
  .toggle button.on{background:var(--brand);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#ddd}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph b{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
  .addph{aspect-ratio:1;border:2px dashed #c9c3b8;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;background:#fbfaf7}
  .risk{border-left:5px solid var(--line)}
  .risk .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .code{font-weight:800;font-size:13px;background:var(--brand);color:#fff;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .fam{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:700}
  .rname{font-weight:700;margin:2px 0}
  .just{font-size:12.5px;color:var(--muted);margin-top:6px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#eef1f5;color:#3c4a5a;margin-right:4px}
  .pc{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:8px}
  .pc label{margin-top:0}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:#fbfaf7;padding:9px 0;font:inherit;font-weight:700;color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--brand);color:#fff}
  .vep{min-width:76px;text-align:center;border-radius:10px;padding:5px 6px;font-weight:800;line-height:1.1}
  .vep small{display:block;font-size:10.5px;font-weight:700}
  .Tolerable{background:var(--tol-bg);color:var(--tol)} .Moderado{background:var(--mod-bg);color:#8a6a00}
  .Importante{background:var(--imp-bg);color:#a84c00} .Intolerable{background:var(--int-bg);color:var(--int)}
  .bl-Tolerable{border-left-color:var(--tol)} .bl-Moderado{border-left-color:var(--mod)} .bl-Importante{border-left-color:var(--imp)} .bl-Intolerable{border-left-color:var(--int)}
  .x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
  .ctrl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctrl ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
  .note{background:#fff8e6;border:1px solid #f1dfa9;border-radius:12px;padding:10px 12px;font-size:13px;color:#6b5400}
  .empty{text-align:center;color:var(--muted);padding:34px 10px}
  .sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .overlay{position:fixed;inset:0;background:rgba(22,32,43,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.on{display:flex}
  .box{background:#fff;border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center}
  .spin{width:38px;height:38px;border:4px solid #eee;border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .sheet{position:fixed;inset:0;background:rgba(22,32,43,.55);z-index:40;display:none;align-items:flex-end}
  .sheet.on{display:flex}
  .sheet .pane{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 30px}
  .crit{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
  .crit td,.crit th{border:1px solid var(--line);padding:7px;vertical-align:top;text-align:left}
  .crit th{background:var(--brand);color:#fff}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;display:none}
  .toast.on{display:block}
  .muted{color:var(--muted);font-size:13px}
  .hidden{display:none!important}
  .lbl{display:flex;align-items:center;justify-content:space-between}
  .mic{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
  .mic.rec{background:var(--int);color:#fff;border-color:var(--int);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .confirm{background:#fff4e5;border:1px solid #f3c58a;border-radius:10px;padding:10px;margin:8px 0;font-size:13.5px}
  .confirm .row{margin-top:8px}
  .confirm .btn{padding:9px;font-size:13.5px}
  .rules{font-size:12.5px;color:#8a4b00;background:#fff1e0;border-radius:8px;padding:6px 9px;margin-top:8px}
  .legal{font-size:12px;color:var(--muted);margin-top:6px}
  .prot{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#e7effa;color:#1f4e79;margin:4px 4px 0 0}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .acts .chip{font-weight:600}
  .st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px}
  .st-Borrador,.st-Pendiente{background:#eef1f5;color:#3c4a5a} .st-Revisada,.st-Implementada{background:#e7effa;color:#1f4e79}
  .st-Validada,.st-Verificada{background:var(--tol-bg);color:var(--tol)} .st-alerta{background:var(--int-bg);color:var(--int)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .tile b{display:block;font-size:26px;line-height:1.1} .tile span{font-size:12px;color:var(--muted)}
  .tile.alerta b{color:var(--int)}
  .barra{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .barra .n{width:84px} .barra .t{flex:1;height:14px;background:#f0ede6;border-radius:99px;overflow:hidden}
  .barra .t i{display:block;height:100%} .barra .v{width:28px;text-align:right;font-weight:700}
  .banner{background:#e7effa;border:1px solid #c5d7ef;color:#1f4e79;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}

  /* ===== v5 ===== */
  .logo img{height:26px;max-width:90px;object-fit:contain;border-radius:4px;background:#fff;padding:2px}
  .hbtn{background:none;border:0;color:#fff;font-size:20px;padding:6px 8px;line-height:1;opacity:.9}
  .hbtn.on{color:#ffd43b}
  .hola{font-size:22px;font-weight:800;margin:4px 0 2px}
  .centro-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px}
  .hero{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:20px;font:inherit;font-size:18px;font-weight:800;background:var(--accent);color:#fff;margin-bottom:14px;box-shadow:0 6px 18px rgba(232,89,12,.25)}
  .sec-t{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px}
  .item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .item .tx{flex:1;min-width:0}
  .item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .tx span{font-size:12.5px;color:var(--muted)}
  .tile{cursor:pointer}
  .rrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
  .rrow .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .rrow .tx{flex:1;min-width:0}
  .rrow .tx b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .tx span{font-size:12px;color:var(--muted)}
  .rrow .vv{font-size:12px;font-weight:800;white-space:nowrap}
  .rrow.open{border-color:var(--brand)}
  .d-Tolerable{background:var(--tol)} .d-Moderado{background:var(--mod)} .d-Importante{background:var(--imp)} .d-Intolerable{background:var(--int)}
  .grp{font-size:12.5px;font-weight:800;color:var(--brand);margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--line)}
  .search{margin-bottom:10px}
  .toast{display:none;align-items:center;gap:12px}
  .toast.on{display:flex}
  .toast button{background:none;border:0;color:#ffd43b;font:inherit;font-weight:800;padding:4px 2px;white-space:nowrap}
  #splash{position:fixed;inset:0;background:var(--brand);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .35s}
  #splash .mk{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--accent) 50%,#ffd43b 50%);margin-bottom:14px}
  #splash img{max-width:160px;max-height:90px;background:#fff;border-radius:12px;padding:8px;margin-bottom:14px}
  #splash b{font-size:24px} #splash span{font-size:13px;opacity:.7;margin-top:4px}
  .pad{border:2px dashed #c9c3b8;border-radius:12px;background:#fff;touch-action:none;width:100%;height:180px;display:block}
  .doc{font-size:13.5px}
  .doc .tt{font-weight:800;margin:12px 0 4px}
  .doc .rk{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:6px 0}
  .ok{color:var(--tol);font-weight:700} .bad{color:var(--int);font-weight:700}
  .qr{display:flex;justify-content:center;margin:10px 0}
  .linkbox{word-break:break-all;font-size:12px;background:#f6f4ef;border-radius:10px;padding:10px;color:var(--muted)}
  details>summary{cursor:pointer}
  .toggle-sw{width:46px;height:26px;border-radius:99px;border:0;background:#c9c3b8;position:relative;flex:none;padding:0}
  .toggle-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle-sw.on{background:var(--brand)} .toggle-sw.on::after{left:23px}

</style>
</head>
<body>
<div id="splash"><div class="mk"></div><b>IPER Rápida</b><span>Matriz de riesgos laborales</span></div>
<header>
  <div class="top">
    <div class="logo"><span id="logoH"><i></i></span>IPER Rápida <span id="demoTag" class="demo hidden">DEMO</span></div>
    <div><button class="hbtn" onclick="abrirCriterios()" aria-label="Criterios de valoración">ⓘ</button><button class="hbtn" id="btnAjustes" aria-label="Ajustes">⚙️</button></div>
  </div>
  <nav>
    <button data-tab="inicio" class="on">Inicio</button>
    <button data-tab="evaluar">Evaluar</button>
    <button data-tab="matriz">Matriz</button>
    <button data-tab="medidas">Medidas</button>
  </nav>
</header>

<main id="app"></main>
<div class="bar" id="bar"><div class="in" id="barIn"></div></div>
<input type="file" id="fotoEvid" accept="image/*" class="hidden">

<div class="overlay" id="busy"><div class="box"><div class="spin"></div><b id="busyTxt">Analizando…</b><div class="muted" id="busySub" style="margin-top:6px"></div></div></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)cerrarSheet()"><div class="pane" id="sheetPane"></div></div>
<div class="toast" id="toast"></div>

            ">" +

            ")");

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {

	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {

		}

function nuevoPuesto(){ return {bid:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), proceso:'',puesto:'',lugar:'',hombres:'',mujeres:'',otros:'',
  sensibles:{}, fotos:[], relato:'', tareas:[], idx:0, exp:-1, enCola:false, paso:1, actualizado:Date.now()}; }
function nuevaTareaItem(medidas){ return {id:null, tarea:'', rutinaria:true, medidasTexto:medidas||'', riesgos:[], medidasActuales:[], observacionesFoto:'', analizado:false, guardada:false, aceptada:false}; }
function tk(){ return cur.tareas[cur.idx] || cur.tareas[0]; }

function cargarBorradores(){
  var b = load('iper_borradores', null);
  if (!b){ // migración: borrador único de versiones anteriores
    b = {};
    var viejo = load('iper_borrador', null);
    if (viejo && (viejo.proceso || viejo.puesto || viejo.tarea || (viejo.tareas||[]).length)){ var n = normalizarBorrador(viejo); b[n.bid] = n; }
    try{ localStorage.removeItem('iper_borrador'); }catch(e){}
    save('iper_borradores', b);

function normalizarBorrador(b){
  var p = Object.assign(nuevoPuesto(), b||{});
  if (b && !Array.isArray(b.tareas)){
    var t = nuevaTareaItem(b.medidasTexto);
    ['id','tarea','rutinaria','riesgos','medidasActuales','observacionesFoto','analizado'].forEach(function(k){ if (b[k]!==undefined) t[k]=b[k]; });
    p.tareas = (t.tarea||t.riesgos.length) ? [t] : [];
    ['id','tarea','rutinaria','riesgos','medidasActuales','observacionesFoto','analizado','medidasTexto'].forEach(function(k){ delete p[k]; });
  }
  if (!p.bid) p.bid = nuevoPuesto().bid;
  p.fotos = []; p.idx = Math.min(p.idx||0, Math.max(0,p.tareas.length-1));
  return p;
}

  if (!cur) return;
  cur.paso = paso; cur.actualizado = Date.now();

/* Fotos de cada borrador en IndexedDB (no caben en localStorage) */
function fotosDB(op, bid, fotos){
  return new Promise(function(ok){
    try{
      var rq = indexedDB.open('iper_fotos', 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('f'); };
      rq.onerror = function(){ ok(null); };
      rq.onsuccess = function(){
        var db = rq.result, tx = db.transaction('f', op==='leer'?'readonly':'readwrite'), st = tx.objectStore('f');
        if (op==='leer'){ var g = st.get(bid); g.onsuccess = function(){ ok(g.result||[]); }; g.onerror = function(){ ok([]); }; }
        else if (op==='guardar'){ st.put(fotos, bid); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }
        else { st.delete(bid); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }
      };
    }catch(e){ ok(null); }
  });
}

/* ======================= Servidor ======================= */
/*
 * Si la pantalla se apaga mientras se espera a la IA, la conexión se corta. Por eso:
 * 1) la pantalla se mantiene encendida mientras se trabaja (Wake Lock) y
 * 2) cada solicitud lleva un número (jobId); si la conexión se corta, la app recupera el resultado guardado en el servidor.
 */
var enCurso = {};
function nuevoJob(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function postApi(body){
  return fetch(cfg.apiUrl.trim(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow'})
    .then(function(r){ return r.text(); })
    .then(function(t){ try{ return JSON.parse(t); }catch(e){ var er = new Error('El servidor no respondió bien. Revisa el enlace de acceso.'); er.fatal = true; throw er; } });
}
function esperar(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function recuperarJob(job){
  var intentos = 0, desconocido = 0;
  function paso_(){
    if (job.hecho) return new Promise(function(){});
    intentos++;
    if (intentos > 75) return Promise.reject(new Error('No se pudo recuperar la respuesta. Revisa tu conexión e inténtalo de nuevo.'));
    return postApi({fn:'resultado', args:[job.id], token:cfg.token.trim()}).then(function(j){
      var r = j.ok ? j.data : {estado:'desconocido'};
      if (r.estado==='listo') return r.respuesta;
      if (r.estado==='grande') return enviarJob(job);
      if (r.estado==='desconocido'){ desconocido++; if (desconocido>=2 && !job.reenviado){ job.reenviado = true; return enviarJob(job); } }
      return esperar(4000).then(paso_);
    }, function(){ return esperar(4000).then(paso_); });
  }
  if (busyOn) $('busySub').textContent = 'Recuperando el resultado…';
  return paso_();
}
function enviarJob(job){
  return postApi({fn:job.fn, args:job.args, token:cfg.token.trim(), jobId:job.id})
    .catch(function(e){ if (e.fatal) throw e; return recuperarJob(job); });
}
function run(fn){
  var args = Array.prototype.slice.call(arguments,1);
  var m = modo();
  if (m==='demo') return Promise.resolve().then(function(){ return Demo[fn].apply(null,args); });
  if (m==='api'){
    if (!navigator.onLine) return Promise.reject(sinRed());
    var job = {id:nuevoJob(), fn:fn, args:args, inicio:Date.now()};
    enCurso[job.id] = job;
    var base = new Promise(function(res,rej){ job.res = res; job.rej = rej; });
    enviarJob(job).then(job.res, job.rej);
    job.promesa = base.then(function(j){
      job.hecho = true; delete enCurso[job.id];
      if (!j.ok) throw new Error(j.error); return j.data;
    }, function(e){ job.hecho = true; delete enCurso[job.id]; throw e; });
    return job.promesa;
  }
  return new Promise(function(ok,ko){
    google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ ko(e && e.message ? e : new Error(String(e))); })[fn].apply(null,args);
  });
}

/** Valida un RUT chileno (módulo 11). */
function rutValido(rut){
  var r = String(rut||'').replace(/[^0-9kK]/g,'').toUpperCase(); if (r.length<2) return false;
  var cuerpo = r.slice(0,-1), dv = r.slice(-1), suma = 0, mul = 2;
  for (var i=cuerpo.length-1;i>=0;i--){ suma += (+cuerpo[i])*mul; mul = mul===7?2:mul+1; }
  var res = 11-(suma%11), esp = res===11?'0':res===10?'K':String(res);
  return dv===esp;
}
function formatoRut(rut){ var r = String(rut||'').replace(/[^0-9kK]/g,'').toUpperCase(); if (r.length<2) return r; return r.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+r.slice(-1); }

/** Mismas reglas fijas que aplica el servidor. */
function aplicarReglas(r){
  var notas=[];
  if (r.pRes>r.p) r.pRes=r.p; if (r.cRes>r.c) r.cRes=r.c;
  var fuerte = JER_FUERTES.indexOf(r.jerarquia)>=0;
  if (!fuerte && r.cRes<r.c){ r.cRes=r.c; notas.push('La consecuencia no baja con medidas administrativas o EPP.'); }
  if (!fuerte){ var minP = r.p===4?2:1; if (r.pRes<minP){ r.pRes=minP; notas.push('Con medidas administrativas o EPP la probabilidad baja como máximo un nivel.'); } }
  if (r.p*r.c>=16 && r.pRes*r.cRes<=2){ r.pRes = r.cRes>=4?1:(r.cRes===2?2:4); notas.push('Un riesgo Intolerable no puede quedar Tolerable en una sola evaluación.'); }
  if (r.pEsp && r.pEsp*r.cEsp < r.pRes*r.cRes){ r.pEsp=r.pRes; r.cEsp=r.cRes; }
  r.reglas = notas; return r;
}

/* Campos: "relato" o "t:<n>:tarea" / "t:<n>:medidasTexto" */
function getCampo(path){ var a = path.split(':'); return a[0]==='t' ? (cur.tareas[+a[1]]||{})[a[2]]||'' : cur[path]||''; }
function setCampo(path, v){ var a = path.split(':'); if (a[0]==='t'){ var t = cur.tareas[+a[1]]; t[a[2]] = v; if (t.analizado && (a[2]==='tarea'||a[2]==='medidasTexto')) t.cambiada = true; } else cur[path] = v; }
function dictar(target, btn){
  if (rec){ rec.stop(); return; }
  rec = new SR(); rec.lang='es-CL'; rec.interimResults=false; rec.continuous=false;
  btn.classList.add('rec'); btn.textContent='● Escuchando…';
  rec.onresult = function(e){
    var txt = Array.from(e.results).map(function(r){return r[0].transcript;}).join(' ').trim();
    if (!txt) return;
    var cuerpo = txt.charAt(0).toUpperCase()+txt.slice(1), prev = getCampo(target).trim();
    setCampo(target, prev ? prev+'. '+cuerpo : cuerpo);
    var el = document.querySelector('[data-p="'+target+'"]'); if (el) el.value = getCampo(target);
    guardarBorrador();
  };
  rec.onerror = function(e){ if (e.error==='not-allowed') toast('Permite el uso del micrófono para dictar.'); else if (e.error==='network') toast('El dictado necesita conexión a internet.'); };
  rec.onend = function(){ rec=null; btn.classList.remove('rec'); btn.textContent='🎤 Dictar'; };
  rec.start();
}

  t.riesgos.forEach(function(r){ if (r.confirmado===null) r.confirmado = true; });

  var sig = cur.tareas.findIndex(function(x){ return x.analizado && !x.aceptada && !x.guardada; });

  else { render(true); toast('Todas las tareas revisadas. Toca Guardar.'); }
}

/* ======================= Mejorar redacción ======================= */

  var t = cur.tareas[k];
  if (!t.tarea.trim()) return toast('Escribe o dicta primero una descripción, aunque sea breve.');
  if (!online()) return toast('Mejorar la redacción necesita conexión.');
  busy(true,'Mejorando la redacción…', respuestas.length?'Incluyendo tus respuestas':'');
  run('mejorarRedaccion', {proceso:cur.proceso, puesto:cur.puesto, tarea:t.tarea, lugar:cur.lugar, respuestas:respuestas})
  .then(function(r){ busy(false); mostrarRedaccion(k, r, respuestas); })
  .catch(function(e){ busy(false); toast(e.message, 6000); });
}

    var payload = {id:t.id, proceso:ev.proceso, puesto:ev.puesto, tarea:t.tarea, lugar:ev.lugar, rutinaria:t.rutinaria,
      hombres:ev.hombres, mujeres:ev.mujeres, otros:ev.otros, sensibles:ev.sensibles, medidasTexto:t.medidasTexto, ceal:cealCentro(ev.centro),
      variasTareas:varias, fotos:ev.fotos.map(function(f){return {mime:f.mime,data:f.data};})};
    return run('analizarTarea', payload).then(function(res){
      t.riesgos = res.riesgos; t.observacionesFoto = res.observacionesFoto; t.medidasActuales = res.medidasActuales;
      t.analizado = true; t.cambiada = false; t.guardada = false; t.aceptada = false; hechas++;
      if (ev===cur) guardarBorrador();
    }, function(e){
      if (!reintento && /límite/i.test(e.message)){
        var s = 30;
        return new Promise(function(ok){ var iv = setInterval(function(){ busy(true,'Límite gratuito de la IA alcanzado','Reintentando en '+(s--)+' s…'); if (s<0){ clearInterval(iv); ok(); } }, 1000); })
          .then(function(){ return una(t, true); });
      }
      e.hechas = hechas; e.total = total; throw e;
    });
  }
  return lista.reduce(function(p, t){ return p.then(function(){ return una(t); }); }, Promise.resolve()).then(function(){ return {hechas:hechas, total:total, primera:lista[0]}; });
}

function analizarPendientes(){
  if (!validarPaso1()){ paso=1; render(); return; }
  cur.tareas = cur.tareas.filter(function(t){ return t.tarea.trim() || t.analizado; });
  if (!cur.tareas.length){ cur.tareas.push(nuevaTareaItem()); render(true); return toast('Escribe al menos una tarea.'); }
  if (!pendientesAnalisis().length){ paso = 3; render(); return; }
  if (!online()){
    cur.enCola = true; guardarBorrador(); fotosDB('guardar', cur.bid, cur.fotos);
    toast('📴 Sin señal: la evaluación quedó en cola. Se analizará al volver la conexión.', 6000);
    cur = null; tab = 'inicio'; render(); return;
  }
  analizarCore(cur).then(function(r){
    busy(false); cur.enCola = false; paso = 3; cur.exp = -1; cur.idx = cur.tareas.indexOf(r.primera); guardarBorrador(); render();
    toast(r.total>1 ? '✅ '+r.total+' tareas analizadas. Revisa cada una y guárdalas.' : '✅ Tarea analizada.');
  }).catch(function(e){
    busy(false); guardarBorrador(); render();
    if (e.sinRed){ cur.enCola = true; guardarBorrador(); fotosDB('guardar', cur.bid, cur.fotos); toast('📴 Se perdió la señal. La evaluación quedó en cola.', 6000); return; }
    toast((e.hechas?'Se analizaron '+e.hechas+' de '+e.total+'. ':'')+e.message+(e.hechas?' Toca "Analizar" para continuar.':''), 8000);
  });
}

/** Guarda en la matriz todas las tareas analizadas que falten. */
function guardarTodas(){
  if (!cur.centro){ toast('Esta evaluación no tiene centro de trabajo.'); return; }
  if (!online()){ toast('Guardar necesita conexión. Tu evaluación queda en el teléfono; guárdala al volver la señal.', 6000); return; }
  var lista = cur.tareas.filter(function(t){ return t.analizado && !t.guardada; });
  var conFoto = lista.filter(function(t){ return t.riesgos.some(function(r){return r.confirmado===null;}); });
  if (conFoto.length){ cur.idx = cur.tareas.indexOf(conFoto[0]); render(); toast('Confirma lo visto en las fotos de la Tarea '+(cur.idx+1)+', o usa "Aceptar todo".'); return; }
  var vacias = lista.filter(function(t){ return !t.riesgos.some(function(r){return r.confirmado!==false;}); });
  if (vacias.length){ cur.idx = cur.tareas.indexOf(vacias[0]); render(); toast('La Tarea '+(cur.idx+1)+' no tiene riesgos. Agrega uno o quítala.'); return; }
  var n = 0, riesgos = 0, medidas = 0;
  lista.reduce(function(p, t){
    return p.then(function(){
      busy(true,'Guardando tarea '+(n+1)+' de '+lista.length+'…');
      var copia = {id:t.id, proceso:cur.proceso, puesto:cur.puesto, tarea:t.tarea, lugar:cur.lugar, rutinaria:t.rutinaria,
        hombres:cur.hombres, mujeres:cur.mujeres, otros:cur.otros, sensibles:cur.sensibles, medidasTexto:t.medidasTexto,
        medidasActuales:t.medidasActuales, observacionesFoto:t.observacionesFoto, riesgos:t.riesgos, ceal:cealCentro(cur.centro)};
      var ci = centroInfo(cur.centro);
      return run('guardarTarea', JSON.parse(JSON.stringify(copia)), {empresa:ci?ci.razonSocial:cfg.empresa, centro:cur.centro, respEjec:cfg.respEjec}).then(function(r){
        t.id = r.id; t.guardada = true; n++; riesgos += r.riesgos; medidas += r.medidas; guardarBorrador();
      });
    });
  }, Promise.resolve()).then(function(){
    busy(false); refrescarConfig(); datos.panel = null; render(true);
    queSigue('✅ '+n+' tarea(s) guardada(s): '+riesgos+' riesgos y '+medidas+' medidas para seguimiento.');
  }).catch(function(e){ busy(false); render(true); toast((n?n+' tarea(s) guardada(s). ':'')+e.message, 7000); });
}

function siguiente(op){
  var base = cur, ult = base.tareas.length ? base.tareas[base.tareas.length-1].medidasTexto : '';
  var terminada = base.tareas.every(function(t){ return t.guardada || !t.tarea.trim(); });
  cerrarSheet();
  if (terminada) borrarBorrador(base.bid);
  cur = null;
  if (op==='tareas'){
    nuevaEvaluacion({centro:base.centro, proceso:base.proceso, puesto:base.puesto, lugar:base.lugar, hombres:base.hombres, mujeres:base.mujeres, otros:base.otros, sensibles:base.sensibles, fotos:base.fotos, ultimasMedidas:ult});
    fotosDB('guardar', cur.bid, cur.fotos);
  } else if (op==='puesto'){ nuevaEvaluacion({centro:base.centro, proceso:base.proceso, lugar:base.lugar}); }
  else if (op==='proceso'){ nuevaEvaluacion({centro:base.centro}); }
  else { irA('matriz'); }
}

function reevaluar(id){
  busy(true,'Cargando tarea…');
  run('obtenerTarea', id).then(function(d){
    busy(false);
    var ev = Object.assign(nuevoPuesto(), {centro:cfg.centro, proceso:d.proceso, puesto:d.puesto, lugar:d.lugar||'', hombres:d.hombres, mujeres:d.mujeres, otros:d.otros, sensibles:d.sensibles||{}, reevaluando:true});

function prepararFirma(puesto){
  var cv = $('pad'), ctx = cv.getContext('2d'), dibujado = false, dib = false, last = null;
  var ratio = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * ratio; cv.height = cv.clientHeight * ratio;
  ctx.scale(ratio, ratio); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  var pos = function(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown', function(e){ dib = true; last = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', function(e){ if (!dib) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; dibujado = true; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ dib = false; }); });
  $('fLimpiar').onclick = function(e){ e.preventDefault(); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); dibujado = false; };
  $('fRut').addEventListener('input', function(){
    var v = this.value; $('rutMsg').innerHTML = v.replace(/[^0-9kK]/g,'').length<7 ? '' : rutValido(v) ? '<span class="ok">RUT válido: '+formatoRut(v)+'</span>' : '<span class="bad">RUT no válido</span>';
  });
  $('fFirmar').onclick = function(){
    var nom = $('fNom').value.trim(), rut = $('fRut').value;
    if (!nom) return toast('Escribe el nombre del trabajador/a.');
    if (!rutValido(rut)) return toast('Revisa el RUT.');
    if (!dibujado) return toast('Falta la firma.');
    if (!$('fOk').checked) return toast('Marca la declaración para continuar.');
    var png = cv.toDataURL('image/png').split(',')[1];
    busy(true,'Generando PDF firmado…');
    run('firmarInformacion', {centro:cfg.centro, empresa:cfg.empresa, puesto:puesto, trabajador:nom, rut:formatoRut(rut), firma:png}).then(function(r){
      busy(false);
      abrirSheet('<div style="text-align:center;padding:10px 4px"><div style="font-size:42px">✍️</div><h2>Firma registrada</h2>'+
        '<p class="muted">'+esc(nom)+' · '+esc(formatoRut(rut))+'<br>'+esc(puesto)+'</p>'+
        (r.url&&r.url!=='#'?'<p><a href="'+esc(r.url)+'" target="_blank">Ver PDF firmado</a></p>':'')+
        '<button class="btn" data-firmar="'+esc(puesto)+'">Firmar otro trabajador/a</button><div style="height:8px"></div>'+
        '<button class="btn ghost" style="width:100%" onclick="cerrarSheet()">Listo</button></div>');
    }).catch(function(e){ busy(false); toast(e.message); });
  };
}

/* ======================= Fotos ======================= */
function procesarFoto(file, max, png){
  max = max || 1280;
  return new Promise(function(ok,ko){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height, k = Math.min(1, max/Math.max(w,h));
        var cv = document.createElement('canvas'); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var big = png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.72);
        var t = document.createElement('canvas'), tk = 200/Math.max(cv.width,cv.height);
        t.width = Math.round(cv.width*tk); t.height = Math.round(cv.height*tk);
        t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
        ok({mime: png?'image/png':'image/jpeg', data:big.split(',')[1], thumb:t.toDataURL('image/jpeg',0.7)});
      };
      img.onerror = function(){ ko(new Error('No se pudo leer la imagen')); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/** Lee el enlace de acceso (?c=...) y configura la conexión automáticamente. */
function leerEnlaceAcceso(){
  var m = location.search.match(/[?&]c=([^&#]+)/);
  if (!m) return false;
  try{
    var d = JSON.parse(deB64url(decodeURIComponent(m[1])));
    if (!d.u || !d.k) throw 0;
    var cambio = cfg.token && cfg.token!==d.k;
    cfg.apiUrl = d.u; cfg.token = d.k; save('iper_cfg', cfg);
    try{ localStorage.removeItem('iper_srv'); }catch(e){}
    SRV.usuario = null;
    history.replaceState(null, '', location.pathname);
    return cambio ? 'cambio' : 'nuevo';
  }catch(e){ history.replaceState(null, '', location.pathname); toast('El enlace de acceso no es válido. Pide uno nuevo.'); return false; }
}
/** Sube a la base de datos las tareas que la versión 1 guardaba solo en el teléfono. */
function migrarV1(){
  var viejas = load('iper_tareas', []);
  if (!viejas.length || modo()==='demo' || !cfg.centro || !puede('evaluador')) return;
  var n = 0;
  viejas.reduce(function(p, t){
    return p.then(function(){ return run('guardarTarea', t, {empresa:cfg.empresa, centro:cfg.centro, respEjec:cfg.respEjec}).then(function(){ n++; }); });
  }, Promise.resolve()).then(function(){
    save('iper_tareas', []); toast(n+' tarea(s) de la versión anterior se pasaron a la matriz de '+cfg.centro+'.'); refrescarConfig();
  }).catch(function(e){ toast('No se pudieron pasar las tareas anteriores: '+e.message); });
}

/* ======================= Cumplimiento ======================= */
function accionCumplimiento(i){
  var it = datos.cumpl.items[i];
  if (it.accion==='matriz') irA('matriz');
  else if (it.accion==='medidas'){ filtroMed = /vencida/.test(it.detalle) ? 'vencidas' : 'abiertas'; irA('medidas'); }
  else if (it.accion==='firmas'){ irA('matriz'); setTimeout(function(){ if (datos.tareas) elegirPuestoFirma(); else toast('Abre "✍️ Firmas por puesto" en la Matriz.'); }, 1200); }
  else if (it.accion==='centro'){ if (puede('validador')) abrirCentro(cfg.centro); else toast('Pide a quien administra el centro que registre el resultado CEAL-SM.'); }
  else if (it.accion==='enviar'){ enviar(); }
  else if (it.accion==='protocolo'){
    abrirSheet(cabecera('Protocolo')+'<h3>'+esc(it.protocolo)+'</h3><p>'+esc(it.ok?'Marcado como gestionado.':it.detalle)+'</p>'+
      '<p class="muted">Gestiónalo con tu organismo administrador (mutualidad o ISL) y márcalo cuando esté implementado.</p>'+
      (puede('evaluador')?'<button class="btn'+(it.ok?' sec':'')+'" id="protBtn">'+(it.ok?'Marcar como pendiente':'✅ Marcar como gestionado')+'</button>':''));
    if ($('protBtn')) $('protBtn').onclick = function(){
      busy(true,'Guardando…');
      run('marcarProtocolo', cfg.centro, it.protocolo, !it.ok).then(function(){ busy(false); cerrarSheet(); cargar('cumpl'); }).catch(function(e){ busy(false); toast(e.message); });
    };
  }
}

/* ======================= Copiar o mover tareas entre centros ======================= */
function otrosCentros(){ return (SRV.centros||[]).filter(function(c){ return String(c.nombre).toLowerCase()!==String(cfg.centro).toLowerCase(); }); }
/** Desde un centro vacío: elegir el centro de origen y las tareas a copiar. */

function elegirTareasOrigen(origen){
  busy(true,'Cargando tareas de '+origen+'…');

function ejecutarCopia(ids, destino, mover){

/** Desde la Matriz: copiar o mover las tareas seleccionadas a otro centro. */

function elegirPuestoBiblio(key){
  var validada = key[0]==='v', g = validada ? BIBLIO.validadas[+key.slice(1)] : BIBLIO.tipo[+key.slice(1)];
  var h = cabecera(esc(g.puesto))+(validada?'<p class="muted" style="margin-top:0">Evaluadas y validadas en: '+esc(g.centros.join(', '))+'</p>':'')+
    g.tareas.map(function(t,i){ return '<label style="display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400;background:#f6f4ef;border-radius:10px;padding:10px">'+
      '<input type="checkbox" class="bibChk" data-i="'+i+'" checked style="width:20px;height:20px;flex:none;margin-top:2px"><span>'+esc(t.tarea)+(t.medidas?'<br><span class="muted">Medidas: '+esc(t.medidas)+'</span>':'')+'</span></label>'; }).join('');
  if (validada) h += '<label style="display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:400;margin-top:12px"><input type="checkbox" id="bibUsarEval" checked style="width:20px;height:20px;flex:none"> Usar la evaluación ya validada (no volver a analizar; podrás ajustarla)</label>';
  h += '<div style="height:12px"></div><button class="btn" id="bibOk">Usar tareas seleccionadas</button>';
  abrirSheet(h);
  $('bibOk').onclick = function(){
    var elegidas = Array.from(document.querySelectorAll('.bibChk')).filter(function(c){return c.checked;}).map(function(c){ return g.tareas[+c.dataset.i]; });
    if (!elegidas.length) return toast('Marca al menos una tarea.');
    var usarEval = validada && $('bibUsarEval') && $('bibUsarEval').checked;
    if (!cur.puesto.trim()) cur.puesto = g.puesto.replace(/\/a\b/,'');
    if (!cur.proceso.trim() && g.proceso) cur.proceso = g.proceso;
    cur.tareas = cur.tareas.filter(function(t){ return t.tarea.trim() || t.analizado; });
    var agregar = function(lista){
      lista.forEach(function(x){ cur.tareas.push(x); });
      guardarBorrador(); cerrarSheet(); paso = 2; render();
      toast(lista.length+' tarea(s) agregada(s).'+(usarEval?' Las evaluaciones validadas quedan listas en Resultados.':' Revisa sus medidas y analiza.'), 5000);
    };
    if (!usarEval) return agregar(elegidas.map(function(x){ var t = nuevaTareaItem(x.medidas); t.tarea = x.tarea; t.rutinaria = x.rutinaria!==false; return t; }));
    busy(true,'Cargando evaluaciones validadas…');
    Promise.all(elegidas.map(function(x){ return run('obtenerTarea', x.id); })).then(function(ds){
      busy(false);
      agregar(ds.map(function(d){
        var t = nuevaTareaItem(d.medidasTexto||'');
        Object.assign(t, {tarea:d.tarea, rutinaria:d.rutinaria!==false, riesgos:(d.riesgos||[]).map(function(r){ r.confirmado = true; return r; }),
          medidasActuales:d.medidasActuales||[], observacionesFoto:'', analizado:true, aceptada:true});
        return t;
      }));
    }).catch(function(e){ busy(false); toast(e.message); });
  };
}
