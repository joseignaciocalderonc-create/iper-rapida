/* ---------- Guía del perito (siempre visible) ---------- */
function guiaInv(){
  var X = INV, e = X.evento||{}, p = X.primeras||{}, d = X.declaraciones||{}, f = X.fotos||[], out = [];
  var grave = e.gravedad==='Grave' || e.gravedad==='Fatal';
  if (grave){
    if (!p.suspension) out.push(['crit','Suspende de inmediato la faena afectada y, si es necesario, evacúa. Solo la Inspección del Trabajo o la SEREMI de Salud autorizan reanudar.']);
    if (!p.avisoIT || !p.avisoSeremi) out.push(['crit','Informa de inmediato a la Inspección del Trabajo y a la SEREMI de Salud del lugar del accidente, y marca la DIAT como accidente grave o fatal.']);
    out.push(['info','En accidentes graves o fatales investiga el Comité Paritario con la asesoría del organismo administrador, que también hace su propia investigación.']);
  }
  if (!p.diat) out.push(['warn','Envía la denuncia (DIAT) al organismo administrador dentro de 24 horas y anota su número.']);
  if (!f.length) out.push(['warn','Ve al sitio lo antes posible, antes de que cambien las condiciones. Fotografía primero sin mover nada: vista general, punto exacto y agente de la lesión.']);
  else { var cats = f.map(function(x){ return x.cat; }); ['Vista general del lugar','Punto exacto del accidente','Agente o elemento de la lesión'].forEach(function(c){ if (cats.indexOf(c)<0) out.push(['warn','Falta la fotografía: '+c.toLowerCase()+'.']); }); }
  if (!d.accidentado) out.push(['warn','Toma la declaración de la persona accidentada, en sus palabras y por escrito, en un lugar tranquilo. Usa preguntas abiertas y no conducentes.']);
  if (!(d.testigos||[]).some(function(t){ return t && t.declaracion; })) out.push(['info','Identifica a los testigos (quienes vieron o estaban cerca) y toma su declaración por separado.']);
  if (!d.jefatura) out.push(['info','Entrevista a la jefatura directa: quién asignó la tarea, con qué instrucciones y cómo se supervisa.']);
  if ((X.documental.items||[]).some(function(i){ return !i.res; })) out.push(['info','Completa la revisión documental: lo que la app ya sabe aparece marcado.']);
  out.push(['info','Anota hechos comprobados. Separa los hechos de las interpretaciones ("estaba distraído") y de los juicios de valor ("fue descuidado").']);
  if (e.fecha && (e.lesion||e.diagnostico) && (d.accidentado || (X.sitio||{}).observaciones)) out.push(['ok','Ya hay antecedentes mínimos para el análisis del árbol de causas.']);
  return out;
}

function quitarSplash(){ var s = $('splash'); if (!s) return; var falta = 0; // v30: con o sin sesión, la app queda lista de inmediato // sin sesión, la animación se ve en el ingreso

  s.style.opacity = 0; setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 400); }
function init(){
  var t0 = Date.now();
  $('btnMenu').innerHTML = ico('menu'); $('btnAtras').innerHTML = ico('atras'); $('btnInfo').innerHTML = ico('info'); $('btnAjustes').innerHTML = ico('ajustes'); $('btnAdmin').innerHTML = ico('escudo');
  var NAV = {inicio:'Resumen', evaluar:'Evaluar', matriz:'Matriz', medidas:'Medidas', personal:'Personal'};
  var ICK = {inicio:'resumen', evaluar:'evaluar', matriz:'matriz', medidas:'medidas', personal:'personal'};

    b.setAttribute('aria-label', NAV[b.dataset.tab]+': '+AYUDA_NAV[b.dataset.tab][1]); });
  init.enlace = leerEnlaceAcceso();
  if ('serviceWorker' in navigator && !EN_APPS_SCRIPT && (location.protocol==='https:' || location.hostname==='localhost')){
    try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  }
  var g = load('iper_srv', null);
  if (modo()!=='demo' && g && !necesitaIngreso()) aplicarConfig(g);
  if (SRV.logo) $('splash').innerHTML = '<img src="'+SRV.logo+'" alt=""><b>Gestión PrevFront</b><span>Gestión preventiva</span>';
  setTimeout(quitarSplash, Math.max(0, 700-(Date.now()-t0)));

/** Carga la configuración de la cuenta (después de ingresar o al abrir la app con sesión). */
function init2(){
  var abrirUnico = function(){ if (tab==='centros' && (SRV.centros||[]).length===1 && !abrirUnico.hecho){ abrirUnico.hecho = true; elegirCentro(SRV.centros[0].id); return true; } };
  if (!abrirUnico()) render();
  if (modo()!=='api' || navigator.onLine){
    run('getConfig').then(function(c){
      aplicarConfig(c);
      if (init.enlace) toast('Conectado como '+c.usuario.nombre+' ('+c.usuario.rolTxt+').', 5000);
      if (modo()!=='demo' && (!c.version || c.version<31)) toast('El servidor es una versión anterior. Actualiza los archivos del servidor y publica una versión nueva.', 8000);
      else if (!c.tieneClave && puede('admin') && !(c.usuario||{}).tieneClaveGemini) toast('Falta configurar GEMINI_API_KEY en el servidor.');
      else migrarV1();
      if (!abrirUnico()) render(true);
      if (!(c.centros||[]).length && tab==='centros' && c.usuario && c.usuario.tipo==='cuenta') setTimeout(function(){ if (!$('sheet').classList.contains('on')) abrirCentro(null); }, 900);
      if (cur && cur.job) setTimeout(reanudarAnalisis, 400);
      if (navigator.onLine && listaBorradores().some(function(b){return b.enCola;})) toast('Hay evaluaciones en cola.', 7000, 'Analizar ahora', analizarCola);
    }).catch(function(e){
      if (!SRV.catalogo.length) SRV.catalogo = Demo.getConfig().catalogo;
      if (!e.sesion) toast(e.message, 7000); render(true);
    });
  } else { if (!SRV.catalogo.length) SRV.catalogo = Demo.getConfig().catalogo; toast('Sin conexión. Puedes preparar evaluaciones; se analizarán al volver la señal.', 5000); }
}
