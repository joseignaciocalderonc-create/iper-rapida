  #splash img.logo{width:min(66vw,280px);height:auto;max-height:none;max-width:none;border-radius:0;margin-bottom:6px}
  .logo-acc{width:min(60vw,240px);height:auto;display:block;margin:0 auto}
  .marcaimg{height:28px;width:auto;display:block}
  svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  a{color:var(--brand)}

  /* Cabecera */
  header{position:sticky;top:0;z-index:20;background:rgba(22,24,27,.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
  .top{display:flex;align-items:center;gap:4px;max-width:720px;margin:0 auto;min-height:44px}
  .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding-left:6px}
  .ttl b{display:block;font:600 19px/1.15 var(--f-head);letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl span.s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl>div{min-width:0}
  .marca{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
  .marca::after{content:'';width:12px;height:12px;border:2.5px solid #fff;border-radius:3px;transform:rotate(45deg)}

  .toggle-sw{width:44px;height:26px;border-radius:99px;border:0;background:var(--line2);position:relative;flex:none;padding:0;transition:background .2s}
  .toggle-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle-sw.on{background:var(--brand)} .toggle-sw.on::after{left:21px}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

  .btn.sec,.btn.ghost{box-shadow:none}
  .card,.list,details.sec,.tile,.item,.rrow{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
  select option{background:#212429;color:var(--ink)}
  /* Barra inferior con los íconos de la app */
  nav button img{width:30px;height:30px;object-fit:contain;transition:transform .15s, opacity .15s, filter .15s;opacity:.72;filter:saturate(.8)}
  nav button.on img{opacity:1;filter:none;transform:translateY(-1px) scale(1.08)}
  nav button.on{color:var(--ink)}
  nav button span{font-size:11.5px}
  .navtip{position:fixed;z-index:70;bottom:calc(var(--navh) + 10px);max-width:250px;background:#E8EEF6;color:#16181B;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:aparece .18s ease;pointer-events:none}
  .navtip b{display:block;margin-bottom:2px}
  .navtip::after{content:'';position:absolute;bottom:-6px;left:var(--flecha,50%);margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#E8EEF6}

  /* =====================================================================
     TEMA "TERRENO" (v28) — claro y de alto contraste para uso en obra.
     Solo capa visual: misma estructura, mismos IDs y textos.
     Fondo off-white, tarjetas blancas, primario pizarra/azul industrial,
     semáforo de riesgo estricto y objetivos táctiles grandes (≥ 48 px).
     ===================================================================== */
  :root{
    color-scheme: light;
    --bg:#F4F6F8; --card:#FFFFFF; --solid:#FFFFFF; --ink:#0F172A; --muted:#5B6B80; --txt2:#334155;
    --line:#E2E8F0; --line2:#CBD5E1; --soft:#F1F5F9;
    --brand:#1E3A8A; --accent:#1E3A8A; --accent-ink:#FFFFFF; --act-soft:#E8EEFB; --act-ink:#1E3A8A;
    --head:#0F172A; --head-2:#1E293B;
    --tol:#059669; --mod:#D97706; --imp:#EA580C; --int:#DC2626;
    --tol-bg:#D1FAE5; --mod-bg:#FEF3C7; --imp-bg:#FFEDD5; --int-bg:#FEE2E2;
    --tol-ink:#065F46; --mod-ink:#92400E; --imp-ink:#9A3412; --int-ink:#991B1B;
    --sh1:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
    --sh2:0 4px 14px rgba(15,23,42,.08);
    --r:14px;
  }
  html{background:var(--bg)}
  body{font-size:15.5px;color:var(--ink)}
  body::before{background:var(--bg)!important}
  :focus-visible{outline:3px solid #3B82F6;outline-offset:2px}
  a{color:var(--brand);font-weight:700}
  svg.i{stroke-width:2}

  /* Cabecera pizarra: identidad fuerte y el logo (letras blancas) se lee bien */
  header{background:var(--head);border-bottom:0;box-shadow:0 2px 10px rgba(15,23,42,.18);-webkit-backdrop-filter:none;backdrop-filter:none;color:#fff}
  .ttl b{font-weight:700;font-size:20px;color:#fff;letter-spacing:.2px}
  .ttl span.s{color:#AEB9C8}
  .hbtn{color:#CBD5E1;width:46px;height:46px;border-radius:12px}
  .hbtn:active{background:rgba(255,255,255,.10)} .hbtn.on{color:#fff;background:rgba(255,255,255,.14)}
  .demo{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}

  /* Navegación inferior blanca con indicador azul */
  nav{background:#FFFFFF;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(15,23,42,.06);-webkit-backdrop-filter:none;backdrop-filter:none}
  nav button{color:var(--muted);min-height:58px;font-weight:700}
  nav button.on{color:var(--brand)}
  nav button.on::before{background:var(--brand);height:4px;top:-4px}
  nav button img{opacity:.85;filter:none}
  nav button.on img{opacity:1}
  nav button span{font-size:12px}
  nav .cnt{background:var(--int);color:#fff;font-weight:800;box-shadow:0 0 0 2px #fff}

  /* Tipografía con jerarquía marcada */
  h2{font:700 26px/1.15 var(--f-head);color:var(--ink);letter-spacing:.1px}
  h3{font-size:16px;font-weight:800;color:var(--ink)}
  .sub{color:var(--muted);font-size:14.5px}
  .pasos-t{font-weight:800;color:var(--brand);text-transform:none;letter-spacing:.2px}
  label{font-size:14px;font-weight:800;color:var(--txt2)}
  .muted{color:var(--muted)}
  .grp,.sec-t{color:var(--txt2);font-weight:800;font-size:13.5px;letter-spacing:.3px;text-transform:uppercase}

  /* Superficies: tarjetas blancas, borde sutil y sombra muy suave */
  .card,.list,details.sec,.tile,.item,.rrow{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh1);-webkit-backdrop-filter:none;backdrop-filter:none}
  .card{padding:18px}
  .tile{border-radius:14px;padding:14px 16px}
  .tile b{color:var(--ink);font-weight:700}
  .tile.alerta{border-color:#FECACA;background:#FFF7F7}

  /* Campos grandes (uso con guantes) */
  input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],input[type=search],textarea,select{
    background:#FFFFFF;border:1.5px solid var(--line2);border-radius:12px;color:var(--ink);font-size:16px;min-height:50px;padding:12px 14px}
  textarea{min-height:96px}
  input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(30,58,138,.15);outline:0}
  input[readonly]{background:#FFFFFF}
  ::placeholder{color:#94A3B8}
  input[type=date]::-webkit-calendar-picker-indicator{filter:none;opacity:.7}
  select option{background:#fff;color:var(--ink)}

  /* Botones: primario sólido pizarra-azul, alto 52 px */
  .btn{min-height:52px;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:.2px;background:var(--brand);color:#fff;border:1px solid var(--brand);box-shadow:0 2px 6px rgba(30,58,138,.25)}
  .btn:active{filter:brightness(.92)}
  .btn.sec{background:#FFFFFF;color:var(--ink);border:1.5px solid var(--line2);box-shadow:var(--sh1)}
  .btn.ghost{background:none;border-color:transparent;color:var(--brand);box-shadow:none;min-height:44px}
  .btn.peligro{background:#FFFFFF;color:var(--int);border:1.5px solid #FCA5A5}
  .btn:disabled{opacity:.45;box-shadow:none}
  .bar{background:#FFFFFF;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(15,23,42,.08);-webkit-backdrop-filter:none;backdrop-filter:none;padding:12px 14px}

  /* Pasos, segmentos y selectores */
  .steps span{height:6px;background:var(--line)} .steps span.on{background:var(--brand)}
  .toggle{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
  .toggle button{min-height:44px;color:var(--muted);border-radius:9px}
  .toggle button.on{background:#FFFFFF;color:var(--brand);box-shadow:var(--sh1)}
  .seg{border:1.5px solid var(--line2);border-radius:11px}
  .seg button{background:#FFFFFF;color:var(--txt2);padding:13px 0;font-weight:700;font-size:17px}
  .seg button+button{border-left:1.5px solid var(--line2)}
  .seg button.on{background:var(--brand);color:#fff}

  /* Chips y checklists grandes */
  .chip{min-height:42px;padding:9px 14px;background:#FFFFFF;border:1.5px solid var(--line2);color:var(--ink);font-weight:600;font-size:14px}
  .chip.on{background:var(--act-soft);color:var(--brand);border-color:var(--brand);font-weight:800}
  .chip:active{background:var(--soft)}
  .chk{background:#F8FAFC;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:15px;min-height:52px;align-items:center}
  .chk:has(input:checked){background:var(--act-soft);border-color:#A5B4FC}
  .chk input{width:24px;height:24px;accent-color:var(--brand)}
  .toggle-sw{width:52px;height:30px;background:var(--line2)}
  .toggle-sw::after{width:24px;height:24px}
  .toggle-sw.on{background:var(--brand)} .toggle-sw.on::after{left:25px}
  .mic{min-height:36px;padding:6px 12px;background:#FFFFFF;border:1.5px solid var(--line2);color:var(--brand)}
  .mic.rec{background:var(--int);border-color:var(--int);color:#fff}
  .q{width:24px;height:24px;background:#FFFFFF;border:1.5px solid var(--line2);color:var(--brand);font-weight:800}
  .q[aria-expanded=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .bubble{background:#EFF6FF;color:#1E3A8A;border:1px solid #BFDBFE}
  .bubble::before{border-bottom-color:#BFDBFE}

  /* Listas: filas de 56 px con separación clara */
  .li{min-height:60px;padding:14px 16px;border-top:1px solid var(--line)}
  .li:active{background:var(--soft)}
  .li .tx b{color:var(--ink);font-weight:800}
  .li .chev{color:#94A3B8}
  .li .fi{background:var(--act-soft);color:var(--brand);border-radius:12px}
  .li .ok-i.si{background:var(--tol-bg);color:var(--tol)} .li .ok-i.no{background:var(--mod-bg);color:var(--mod)}
  .item,.rrow{padding:14px 16px;min-height:60px}
  .rrow.open{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .rrow .vv{color:var(--txt2);font-weight:800}

  /* Riesgos: código como etiqueta técnica y semáforo estricto */
  .code{font:700 14px var(--f-head);background:var(--head);color:#fff;border-radius:7px;padding:2px 8px;letter-spacing:.4px}
  .fam{color:var(--muted);font-weight:800;text-transform:uppercase;font-size:11.5px;letter-spacing:.5px}
  .rname{font-weight:800;color:var(--ink)}
  .risk{border-left-width:6px}
  .vep{border-radius:10px;font-weight:700;border:1px solid transparent}
  .Tolerable{background:var(--tol-bg);color:var(--tol-ink);border-color:#6EE7B7}
  .Moderado{background:var(--mod-bg);color:var(--mod-ink);border-color:#FCD34D}
  .Importante{background:var(--imp-bg);color:var(--imp-ink);border-color:#FDBA74}
  .Intolerable{background:var(--int-bg);color:var(--int-ink);border-color:#FCA5A5}
  .tag{background:var(--soft);color:var(--txt2);border:1px solid var(--line);font-weight:800}
  .pill{background:#FFFFFF;border-color:var(--line2);color:var(--txt2);font-weight:700}
  .prot{background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE}

  /* Estados como badges de fondo suave y texto oscuro */
  .st{font-weight:800;padding:3px 10px;border:1px solid transparent}
  .st-Borrador,.st-Pendiente{background:#F1F5F9;color:#334155;border-color:#CBD5E1}
  .st-Revisada,.st-Implementada{background:#E8EEFB;color:#1E3A8A;border-color:#BFCBF5}
  .st-Validada,.st-Verificada{background:var(--tol-bg);color:var(--tol-ink);border-color:#6EE7B7}
  .st-alerta{background:var(--int-bg);color:var(--int-ink);border-color:#FCA5A5}

  /* Avisos */
  .note{background:#F8FAFC;border:1px solid var(--line);color:var(--txt2);border-radius:12px;padding:13px 14px}
  .note.warn,.note.aviso{background:#FFFBEB;border:1px solid #FCD34D;border-left:5px solid var(--mod);color:#78350F}
  .note.bien{background:#ECFDF5;border:1px solid #6EE7B7;border-left:5px solid var(--tol);color:#065F46}
  .banner{background:#EFF4FF;border:1px solid #C7D2FE;border-left:5px solid var(--brand);color:#1E3A8A;border-radius:12px}
  .confirm{background:#FFFBEB;border:1px solid #FCD34D}
  .rules{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}
  .orig,.linkbox{background:#F8FAFC;border:1px solid var(--line);color:var(--txt2)}

  /* Hojas, diálogos y avisos flotantes */
  .overlay,.sheet{background:rgba(15,23,42,.55)}
  .box{background:#FFFFFF;border:1px solid var(--line);box-shadow:var(--sh2)}
  .sheet .pane{background:#FFFFFF;border-top:0;box-shadow:0 -10px 30px rgba(15,23,42,.18);padding-left:20px;padding-right:20px}
  .sheet .pane::before{background:#CBD5E1;width:44px;height:5px}
  .sh-h h2{font-size:22px}
  .x{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--txt2);background:var(--soft);font-size:24px;padding:0}
  .toast{background:var(--head);color:#F8FAFC;box-shadow:0 10px 30px rgba(15,23,42,.3);border-radius:12px}
  .toast button{color:#93C5FD}
  .navtip{background:var(--head);color:#F8FAFC}
  .navtip::after{border-top-color:var(--head)}
  .spin{border-color:var(--line);border-top-color:var(--brand)}
  .prog .pt,.barra .t,.pct .t{background:#E2E8F0}
  .crit th{color:var(--txt2)}
  .okbig{background:var(--tol-bg);color:var(--tol)}

  /* Secciones desplegables */
  details.sec>summary{min-height:58px;padding:15px 16px;font-weight:800;color:var(--ink)}
  details.sec[open]{border-color:#A5B4FC;box-shadow:0 0 0 1px #E0E7FF, var(--sh1)}
  details.sec>summary::after{border-color:var(--brand)}
  details.sec>.cu{border-top:1px solid var(--line)}

  /* Encabezado del centro y avance */
  .chead .fi{background:var(--act-soft);color:var(--brand)}
  .pct b{color:var(--ink);font-weight:700}
  .corr .pt-ok{background:var(--tol)}

  /* Inicio e ingreso: la marca (letras blancas) va sobre un bloque pizarra */
  #splash{background:var(--bg);color:var(--ink)}
  #splash span{color:var(--muted)}
  .logo-acc{background:none;border-radius:0;padding:0;box-shadow:none}
  .ph b{background:rgba(15,23,42,.75)}
  .addph{background:#FFFFFF;border:2px dashed var(--line2);color:var(--brand);font-weight:700}

  /* v29: programa de trabajo e inspecciones */
  .bdg{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-weight:800;font-size:13px;border:1px solid transparent;white-space:nowrap;flex:none}
  .bdg.ok{background:var(--tol-bg);color:var(--tol-ink);border-color:#6EE7B7}
  .bdg.warn{background:var(--mod-bg);color:var(--mod-ink);border-color:#FCD34D}
  .bdg.crit{background:var(--int-bg);color:var(--int-ink);border-color:#FCA5A5;width:auto;margin:0;font-size:13px}
  .bdg.sm.crit{font-size:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ind{margin:10px 0 4px}
  .ind .lbl b{font-size:15px}
  .ind .t{height:10px;border-radius:6px;background:#E2E8F0;overflow:hidden;margin:6px 0 4px}
  .ind .t i{display:block;height:100%;border-radius:6px}
  .subtabs button{min-height:48px;font-size:15px}
  .insp-it{padding:16px}
  .insp-it.mal{border-color:#FCA5A5;box-shadow:0 0 0 1px #FECACA, var(--sh1)}
  .insp-res{margin-top:12px}
  .insp-res button{min-height:54px;font-size:16px}
  .seg button.on.r-ok{background:var(--tol-bg);color:var(--tol-ink)}
  .seg button.on.r-mal{background:var(--int-bg);color:var(--int-ink)}
  .seg button.on.r-na{background:#E2E8F0;color:#334155}
  .seg button.on.c-Alta{background:var(--int-bg);color:var(--int-ink)}
  .seg button.on.c-Media{background:var(--imp-bg);color:var(--imp-ink)}
  .seg button.on.c-Baja{background:var(--mod-bg);color:var(--mod-ink)}
  .insp-acc{margin-top:12px;padding:12px;border-radius:12px;background:#FFF7F7;border:1px solid #FECACA}
  .insp-th{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .tile[data-g]{cursor:pointer}
  a.chip{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}

  /* ===== v30: menú lateral, filas compactas y sistema visual ===== */
  nav{display:none!important}
  body.con-nav{--navh:0px}
  body{font-variant-numeric:tabular-nums}
  .hbtn#btnMenu{display:none}
  body.con-menu .hbtn#btnMenu{display:grid}
  #side{position:fixed;top:0;bottom:0;left:0;width:284px;max-width:86vw;background:#FFFFFF;border-right:1px solid var(--line);z-index:40;transform:translateX(-102%);transition:transform .18s ease-out;overflow-y:auto;box-shadow:8px 0 24px rgba(15,23,42,.12)}
  body.menu-on #side{transform:none}
  #sideVelo{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:39;display:none}
  body.menu-on #sideVelo{display:block}
  .sd-in{padding:calc(12px + env(safe-area-inset-top)) 12px 24px}
  .sd-inst{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--head);color:#fff;border:0;border-radius:12px;padding:12px 14px;font:inherit;margin-bottom:10px;min-height:60px}
  .sd-inst .tx{flex:1;min-width:0} .sd-inst b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sd-inst span span{display:block;font-size:12.5px;color:#AEB9C8}
  .sd-inst svg.i{color:#CBD5E1;width:18px;height:18px}
  .sd-g{font-size:12.5px;font-weight:800;color:var(--muted);margin:16px 10px 4px;letter-spacing:.2px}
  .sd-it{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border:0;background:none;border-radius:10px;font:inherit;font-size:15px;font-weight:600;color:var(--txt2);text-align:left}
  .sd-it svg.i{width:20px;height:20px;color:var(--muted)}
  .sd-it span{flex:1}
  .sd-it:active{background:var(--soft)}
  .sd-it.on{background:var(--act-soft);color:var(--brand);font-weight:800}
  .sd-it.on svg.i{color:var(--brand)}
  .sd-n{flex:none!important;background:var(--int);color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:1px 8px}
  .sd-pie{margin-top:18px;padding-top:10px;border-top:1px solid var(--line)}
  @media (min-width:980px){
    body.con-menu #side{transform:none;box-shadow:none;top:var(--hh,74px)}
    body.con-menu #sideVelo{display:none!important}
    body.con-menu .hbtn#btnMenu{display:none}
    body.con-menu main{margin-left:calc(284px + max(16px, (100vw - 284px - 760px)/2))}
    body.con-menu .bar .in{margin-left:max(16px, (100vw - 284px - 760px)/2)}
    body.con-menu .bar{left:284px}
    body.con-menu .sd-in{padding-top:12px}
  }
  /* Filas compactas */
  .filas{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh1)}
  .fila{display:flex;align-items:center;gap:10px;padding:12px 6px 12px 0;border-top:1px solid var(--line);min-height:64px;cursor:pointer;background:#fff}
  .fila:first-child{border-top:0}
  .fila:active{background:var(--soft)}
  .fila .nv{align-self:stretch;width:5px;border-radius:0 4px 4px 0;flex:none;background:var(--line2)}
  .nv.Tolerable{background:var(--tol)} .nv.Moderado{background:var(--mod)} .nv.Importante{background:var(--imp)} .nv.Intolerable{background:var(--int)}
  .fila .tx{flex:1;min-width:0}
  .fila .tx b{display:block;font-size:15px;font-weight:700;color:var(--ink);line-height:1.3}
  .fila .tx .m{display:block;font-size:13px;color:var(--muted);margin-top:3px}
  .fila .tx .e{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .fila .mas{flex:none;width:44px;height:44px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
  .fila .mas:active{background:var(--soft)}
  .fila input[type=checkbox]{width:24px;height:24px;margin-left:12px;flex:none;accent-color:var(--brand)}
  .bdg.sm{font-size:12px;padding:2px 8px}
  .bdg.neu{background:#F1F5F9;color:#334155;border-color:#CBD5E1}
  .bdg.blue{background:#E8EEFB;color:#1E3A8A;border-color:#BFCBF5}
  .menu-acc .li{min-height:56px;font-size:15.5px;font-weight:600}
  .menu-acc .li svg.i{color:var(--muted)}
  .menu-acc .li.peligro{color:var(--int)} .menu-acc .li.peligro svg.i{color:var(--int)}
  .cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .cab h2{margin:0}
  .filtro{display:flex;gap:8px;margin:0 0 12px}
  .filtro select,.filtro input{min-height:46px;min-width:0}
  .filtro select{flex:1} .filtro input{flex:1.3}
  .pend .li{min-height:58px}
  .resumen-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
  .resumen-kpi .tile{padding:12px}
  .resumen-kpi .tile b{font-size:26px}
  details.mas-info>summary{cursor:pointer;color:var(--brand);font-weight:700;padding:12px 2px;list-style:none}

function ico(n, extra){ return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"'+(extra||'')+'>'+(ICO[n]||'')+'</svg>'; }
/** Burbuja de ayuda junto a una etiqueta: explica qué escribir, sin ejemplos de empresas reales. */
function ayuda(txt){ return '<button type="button" class="q" data-ayuda="'+esc(txt)+'" aria-label="Qué escribir aquí" aria-expanded="false">?</button>'; }
function lab(txt, help, extra){ return '<label>'+txt+(help?ayuda(help):'')+(extra||'')+'</label>'; }
function toggleAyuda(b){
  var cont = b.closest('label,.lbl') || b.parentNode, sig = cont.nextElementSibling;
  if (sig && sig.classList.contains('bubble')){ sig.remove(); b.setAttribute('aria-expanded','false'); return; }
  document.querySelectorAll('.bubble').forEach(function(x){ x.remove(); });
  document.querySelectorAll('.q[aria-expanded=true]').forEach(function(x){ x.setAttribute('aria-expanded','false'); });
  var d = document.createElement('div'); d.className = 'bubble'; d.textContent = b.dataset.ayuda; cont.parentNode.insertBefore(d, cont.nextSibling); b.setAttribute('aria-expanded','true');
}
/* Barra de avance del análisis */
var PROG = {v:0, iv:null};
function progPintar(v){ PROG.v = Math.max(PROG.v, Math.min(100, v)); var k = Math.round(PROG.v); $('busyProg').classList.remove('hidden'); $('busyBar').style.width = k+'%'; $('busyPct').textContent = k+'%'; }
/** Avanza de "desde" hacia "hasta" de forma gradual mientras esperamos al servidor (nunca llega solo al final del tramo). */
function progTramo(desde, hasta, segs){
  clearInterval(PROG.iv); progPintar(desde); var t0 = Date.now();
  PROG.iv = setInterval(function(){ var k = 1-Math.exp(-(Date.now()-t0)/(segs*1000/2.2)); progPintar(desde+(hasta-desde)*0.94*k); }, 350);
}
function progFin(){ clearInterval(PROG.iv); PROG.iv = null; PROG.v = 0; $('busyProg').classList.add('hidden'); $('busyBar').style.width = '0'; }

/** Burbuja que explica un botón de la barra inferior (al primer uso y al mantenerlo presionado). */
function burbujaNav(b){
  var t = AYUDA_NAV[b.dataset.tab]; if (!t) return;
  document.querySelectorAll('.navtip').forEach(function(x){ x.remove(); });
  var r = b.getBoundingClientRect(), d = document.createElement('div'); d.className = 'navtip';
  d.innerHTML = '<b>'+t[0]+'</b>'+t[1]; document.body.appendChild(d);
  var w = d.offsetWidth, x = Math.min(window.innerWidth-w-8, Math.max(8, r.left+r.width/2-w/2));
  d.style.left = x+'px'; d.style.setProperty('--flecha', (r.left+r.width/2-x)+'px');
  clearTimeout(burbujaNav._t); burbujaNav._t = setTimeout(function(){ d.remove(); }, 4200);
}

/** Opciones de comuna según la región (si la comuna guardada no está en la lista, se conserva). */
function opcionesComuna(region, actual){
  var L = (COMUNAS[region]||[]).slice();
  if (actual && L.indexOf(actual)<0) L.unshift(actual);
  if (!region && !actual) return '<option value="">Primero elige la región</option>';
  return '<option value="">Elige la comuna</option>'+L.map(function(c){ return '<option'+(c===actual?' selected':'')+'>'+esc(c)+'</option>'; }).join('');
}
/** Opciones con explicación (una sola elegible). opciones: [[valor, título, explicación]]. */
function opcionesRadio(nombre, opciones, valor){
  return '<div class="radios">'+opciones.map(function(o){
    return '<label class="chk radio"><input type="radio" name="'+nombre+'" value="'+esc(o[0])+'"'+(o[0]===valor?' checked':'')+'><span><b>'+esc(o[1])+'</b>'+(o[2]?'<br><span class="muted">'+esc(o[2])+'</span>':'')+'</span></label>'; }).join('')+'</div>';
}
function valorRadio(nombre){ var r = document.querySelector('input[name="'+nombre+'"]:checked'); return r ? r.value : ''; }

/* ======================= Evaluaciones en curso (borradores) ======================= */
/* Una evaluación = un puesto con una o varias tareas. Se pueden tener varias a medias.

function nuevoPuesto(){ return {bid:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), proceso:'',puesto:'',lugar:'',hombres:'',mujeres:'',otros:'',
  sensibles:{}, fotos:[], relato:'', eppTexto:'', herrTexto:'', maqTexto:'', quimTexto:'', ptsTexto:'', medidasPuesto:'', pAbierta:{datos:true}, tareas:[], idx:0, exp:-1, enCola:false, paso:1, actualizado:Date.now(), demo:enDemo()}; }
function nuevaTareaItem(medidas){ return {id:null, tarea:'', rutinaria:true, medidasTexto:medidas||'', epp:[], herramientas:[], accesorios:[], quimicos:[], riesgos:[], medidasActuales:[], observacionesFoto:'', analizado:false, guardada:false, aceptada:false}; }
function tk(){ return cur.tareas[cur.idx] || cur.tareas[0]; }

function cargarBorradores(){
  var b = load('iper_borradores', null);
  if (!b){ // migración: borrador único de versiones anteriores
    b = {};
    var viejo = load('iper_borrador', null);
    if (viejo && (viejo.proceso || viejo.puesto || viejo.tarea || (viejo.tareas||[]).length)){ var n = normalizarBorrador(viejo); b[n.bid] = n; }
    try{ localStorage.removeItem('iper_borrador'); }catch(e){}
    save('iper_borradores', b);
  }
  return b;
}
function normalizarBorrador(b){
  var p = Object.assign(nuevoPuesto(), b||{});
  if (b && !Array.isArray(b.tareas)){
    var t = nuevaTareaItem(b.medidasTexto);
    ['id','tarea','rutinaria','riesgos','medidasActuales','observacionesFoto','analizado'].forEach(function(k){ if (b[k]!==undefined) t[k]=b[k]; });
    p.tareas = (t.tarea||t.riesgos.length) ? [t] : [];
    ['id','tarea','rutinaria','riesgos','medidasActuales','observacionesFoto','analizado','medidasTexto'].forEach(function(k){ delete p[k]; });
  }
  if (!p.bid) p.bid = nuevoPuesto().bid;
  p.fotos = []; p.idx = Math.min(p.idx||0, Math.max(0,p.tareas.length-1));
  return p;
}
function guardarBorrador(){
  if (!cur) return;
  cur.paso = paso; cur.actualizado = Date.now();
  var c = Object.assign({}, cur); delete c.fotos; c.nFotos = cur.fotos.length;
  borradores[cur.bid] = c; save('iper_borradores', borradores);
}
function borrarBorrador(bid){ delete borradores[bid]; save('iper_borradores', borradores); fotosDB('borrar', bid); }
function listaBorradores(){ return Object.keys(borradores).map(function(k){return borradores[k];}).sort(function(a,b){return b.actualizado-a.actualizado;}); }
function estadoBorrador(b){
  if (b.enCola) return {txt:'En cola: sin señal', cls:'st-alerta'};
  var an = b.tareas.filter(function(t){return t.analizado;}).length, gu = b.tareas.filter(function(t){return t.guardada;}).length;
  if (an && gu===an && an===b.tareas.length) return {txt:'Guardada', cls:'st-Validada'};

}
function abrirBorrador(bid){

  if (!cur.centro) cur.centro = cfg.centro;
  if (paso===3 && !cur.tareas.some(function(t){return t.analizado;})) paso = cur.tareas.length ? 2 : 1;
  tab = 'evaluar'; render();
  fotosDB('leer', cur.bid).then(function(f){ if (cur && cur.bid===bid && f){ cur.fotos = f; render(true); } }).then(function(){ setTimeout(reanudarAnalisis, 300); });
}
function nuevaEvaluacion(base){
  if (!cfg.centro && !(base && base.centro)){ abrirSelectorCentro(); toast('Primero abre la instalación de esta evaluación.'); return; }
  cur = Object.assign(nuevoPuesto(), {centro:cfg.centro}, base||{}); paso = cur.puesto ? 2 : 1;
  if (paso===2 && !cur.tareas.length) cur.tareas.push(nuevaTareaItem(base && base.ultimasMedidas || ''));
  delete cur.ultimasMedidas;
  guardarBorrador(); tab = 'evaluar'; render();
}

/* Fotos de cada borrador en IndexedDB (no caben en localStorage) */
function fotosDB(op, bid, fotos){
  return new Promise(function(ok){
    try{
      var rq = indexedDB.open('iper_fotos', 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('f'); };
      rq.onerror = function(){ ok(null); };
      rq.onsuccess = function(){
        var db = rq.result, tx = db.transaction('f', op==='leer'?'readonly':'readwrite'), st = tx.objectStore('f');
        if (op==='leer'){ var g = st.get(bid); g.onsuccess = function(){ ok(g.result||[]); }; g.onerror = function(){ ok([]); }; }
        else if (op==='guardar'){ st.put(fotos, bid); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }
        else { st.delete(bid); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }
      };
    }catch(e){ ok(null); }
  });
}

/* ======================= Servidor ======================= */
/*
 * Si la pantalla se apaga mientras se espera a la IA, la conexión se corta. Por eso:
 * 1) la pantalla se mantiene encendida mientras se trabaja (Wake Lock) y
 * 2) cada solicitud lleva un número (jobId); si la conexión se corta, la app recupera el resultado guardado en el servidor.
 */
var enCurso = {};
function nuevoJob(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function postApi(body){
  return fetch(servidor(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow'})
    .then(function(r){ return r.text(); })
    .then(function(t){ try{ return JSON.parse(t); }catch(e){ var er = new Error('El servidor no respondió bien. Revisa el enlace de acceso.'); er.fatal = true; throw er; } });
}
function esperar(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function recuperarJob(job){
  var intentos = 0, desconocido = 0;
  function paso_(){
    if (job.hecho) return new Promise(function(){});
    intentos++;
    if (intentos > 75) return Promise.reject(new Error('No se pudo recuperar la respuesta. Revisa tu conexión e inténtalo de nuevo.'));
    return postApi({fn:'resultado', args:[job.id], token:String(cfg.token||'').trim()}).then(function(j){
      var r = j.ok ? j.data : {estado:'desconocido'};
      if (r.estado==='listo') return r.respuesta;
      if (r.estado==='grande') return enviarJob(job);
      if (r.estado==='desconocido'){ desconocido++; if (desconocido>=2 && !job.reenviado){ job.reenviado = true; return enviarJob(job); } }
      return esperar(4000).then(paso_);
    }, function(){ return esperar(4000).then(paso_); });
  }
  if (busyOn) $('busySub').textContent = 'Recuperando el resultado…';
  return paso_();
}
function enviarJob(job){
  return postApi({fn:job.fn, args:job.args, token:String(cfg.token||'').trim(), jobId:job.id})
    .catch(function(e){ if (e.fatal) throw e; return recuperarJob(job); });
}
function run(fn){
  var args = Array.prototype.slice.call(arguments,1);
  var m = modo();
  if (m==='demo') return Promise.resolve().then(function(){ return Demo[fn].apply(Demo,args); }).catch(function(e){
    if (/^DEMO:/.test(e.message)){ var q = e.message.slice(5); setTimeout(function(){ busy(false); versionCompleta(q); }, 50); var x = new Error('Disponible en la versión completa.'); x.demo = true; throw x; }
    throw e; });
  if (m==='api'){
    if (!navigator.onLine) return Promise.reject(sinRed());
    var job = {id:nuevoJob(), fn:fn, args:args, inicio:Date.now()};
    enCurso[job.id] = job;
    var base = new Promise(function(res,rej){ job.res = res; job.rej = rej; });
    enviarJob(job).then(job.res, job.rej);
    job.promesa = base.then(function(j){
      job.hecho = true; delete enCurso[job.id];
      if (!j.ok){
        if (/^SESION:/.test(j.error)){ var msg = j.error.replace(/^SESION:\s*/,''); setTimeout(function(){ cerrarSesionLocal(msg); }, 0); var es = new Error(msg); es.sesion = true; throw es; }
        throw new Error(j.error);
      }
      return j.data;
    }, function(e){ job.hecho = true; delete enCurso[job.id]; throw e; });
    return job.promesa;
  }
  return new Promise(function(ok,ko){
    google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ ko(e && e.message ? e : new Error(String(e))); })[fn].apply(null,args);
  });
}
function sinRed(){ var e = new Error('Sin conexión a internet.'); e.sinRed = true; return e; }
function online(){ return modo()!=='api' || navigator.onLine; }

/* Mantener la pantalla encendida mientras la IA trabaja */
var wakeLock = null, busyOn = false;
function mantenerPantalla(on){
  if (!('wakeLock' in navigator)) return;
  if (on && !wakeLock){
    navigator.wakeLock.request('screen').then(function(w){ wakeLock = w; w.addEventListener('release', function(){ wakeLock = null; }); }).catch(function(){});
  } else if (!on && wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState!=='visible') return;
  if (busyOn) mantenerPantalla(true);
  else if (cur && cur.job && !Object.keys(enCurso).length) setTimeout(reanudarAnalisis, 500);
  Object.keys(enCurso).forEach(function(id){
    var job = enCurso[id];
    if (!job.hecho && !job.recuperando && Date.now()-job.inicio > 8000){ job.recuperando = true; recuperarJob(job).then(job.res, function(){}); }
  });
});

/* ======================= Utilidades ======================= */
function nivel(v){ return v<=2?'Tolerable':v<=4?'Moderado':v<=8?'Importante':'Intolerable'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(id){ return document.getElementById(id); }
var _toastAcc = null;
function toast(t,ms,accion,fn){

/** Acción con "Deshacer": se aplica de inmediato en pantalla y se confirma después de unos segundos. */
function conDeshacer(msg, deshacer, confirmar){

function fecha(s){ if(!s) return ''; var d=new Date(s); return isNaN(d)?'':('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear(); }
function fechaHora(s){ var d=new Date(s); return isNaN(d)?'':fecha(s)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function hace(ms){ var m = Math.round((Date.now()-ms)/60000); return m<1?'recién':m<60?'hace '+m+' min':m<1440?'hace '+Math.round(m/60)+' h':'hace '+Math.round(m/1440)+' días'; }
function seg(name, val, idx){

    return '<button data-seg="'+name+'" data-i="'+idx+'" data-v="'+n+'" class="'+(val==n?'on':'')+'">'+n+'</button>'; }).join('')+'</div>';
}
function vepBox(p,c){ var v=p*c, n=nivel(v); return '<div class="vep '+n+'">'+v+'<small>'+n+'</small></div>'; }
function micBtn(target){ return SR ? '<button class="mic" data-mic="'+target+'">'+ico('mic')+'Dictar</button>' : ''; }
function b64url(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function deB64url(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length%4) s+='='; return decodeURIComponent(escape(atob(s))); }

/** Valida un RUT chileno (módulo 11). */
function rutValido(rut){
  var r = String(rut||'').replace(/[^0-9kK]/g,'').toUpperCase(); if (r.length<2) return false;
  var cuerpo = r.slice(0,-1), dv = r.slice(-1), suma = 0, mul = 2;
  for (var i=cuerpo.length-1;i>=0;i--){ suma += (+cuerpo[i])*mul; mul = mul===7?2:mul+1; }
  var res = 11-(suma%11), esp = res===11?'0':res===10?'K':String(res);
  return dv===esp;
}
function formatoRut(rut){ var r = String(rut||'').replace(/[^0-9kK]/g,'').toUpperCase(); if (r.length<2) return r; return r.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+r.slice(-1); }

/** Mismas reglas fijas que aplica el servidor. */
function aplicarReglas(r){
  var notas=[];
  if (r.pRes>r.p) r.pRes=r.p; if (r.cRes>r.c) r.cRes=r.c;
  var fuerte = JER_FUERTES.indexOf(r.jerarquia)>=0;
  if (!fuerte && r.cRes<r.c){ r.cRes=r.c; notas.push('La consecuencia no baja con medidas administrativas o EPP.'); }
  if (!fuerte){ var minP = r.p===4?2:1; if (r.pRes<minP){ r.pRes=minP; notas.push('Con medidas administrativas o EPP la probabilidad baja como máximo un nivel.'); } }
  if (r.p*r.c>=16 && r.pRes*r.cRes<=2){ r.pRes = r.cRes>=4?1:(r.cRes===2?2:4); notas.push('Un riesgo Intolerable no puede quedar Tolerable en una sola evaluación.'); }
  if (r.pEsp && r.pEsp*r.cEsp < r.pRes*r.cRes){ r.pEsp=r.pRes; r.cEsp=r.cRes; }
  r.reglas = notas; return r;
}

/* ======================= Dictado por voz ======================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var rec = null;
/* Campos: "relato" o "t:<n>:tarea" / "t:<n>:medidasTexto" */
function getCampo(path){ var a = path.split(':'); return a[0]==='t' ? (cur.tareas[+a[1]]||{})[a[2]]||'' : cur[path]||''; }
function setCampo(path, v){ var a = path.split(':'); if (a[0]==='t'){ var t = cur.tareas[+a[1]]; t[a[2]] = v; if (t.analizado && (a[2]==='tarea'||a[2]==='medidasTexto')) t.cambiada = true; } else cur[path] = v; }
function dictar(target, btn){
  if (rec){ rec.stop(); return; }
  rec = new SR(); rec.lang='es-CL'; rec.interimResults=false; rec.continuous=false;
  btn.classList.add('rec'); btn.textContent='● Escuchando…';
  rec.onresult = function(e){
    var txt = Array.from(e.results).map(function(r){return r[0].transcript;}).join(' ').trim();
    if (!txt) return;
    var cuerpo = txt.charAt(0).toUpperCase()+txt.slice(1);
    if (target.charAt(0)==='#'){ var ce = document.querySelector(target); if (ce){ ce.value = (ce.value.trim() ? ce.value.trim()+'. ' : '')+cuerpo; ce.dispatchEvent(new Event('input',{bubbles:true})); ce.dispatchEvent(new Event('change',{bubbles:true})); } return; }
    var prev = getCampo(target).trim();
    setCampo(target, prev ? prev+'. '+cuerpo : cuerpo);
    var el = document.querySelector('[data-p="'+target+'"]'); if (el) el.value = getCampo(target);
    guardarBorrador();
  };
  rec.onerror = function(e){ if (e.error==='not-allowed') toast('Permite el uso del micrófono para dictar.'); else if (e.error==='network') toast('El dictado necesita conexión a internet.'); };
  rec.onend = function(){ rec=null; btn.classList.remove('rec'); btn.innerHTML=ico('mic')+'Dictar'; };
  rec.start();
}

/* ======================= Resumen del centro ======================= */
function fichaFaltantes(ci){
  var f = (ci&&ci.ficha)||{}, falta = [];
  if (!f.giro) falta.push('actividad económica'); if (!f.organismo) falta.push('organismo administrador');
  if (!f.representanteLegal) falta.push('representante legal');
  return falta;
}

function analizarCola(){
  var cola = listaBorradores().filter(function(b){return b.enCola;});
  if (!cola.length) return;
  var listos = 0;
  cola.reduce(function(p, b){
    return p.then(function(){
      cur = normalizarBorrador(borradores[b.bid]);
      return fotosDB('leer', b.bid).then(function(f){ cur.fotos = f||[]; return analizarCore(cur); })
        .then(function(){ cur.enCola = false; paso = 3; guardarBorrador(); listos++; });
    });
  }, Promise.resolve()).then(function(){
    busy(false); cur = null; tab = 'inicio'; render();
    toast(listos+''+' evaluación(es) analizada(s). Ábrelas para revisar y guardar.', 6000);
  }).catch(function(e){ busy(false); cur = null; render(); toast((listos?listos+' analizada(s). ':'')+e.message, 7000); });
}
window.addEventListener('online', function(){
  var n = listaBorradores().filter(function(b){return b.enCola;}).length;
  if (n) toast('Volvió la conexión: '+n+' evaluación(es) en cola.', 8000, 'Analizar ahora', analizarCola);
  if (tab==='inicio') { cargar('panel'); render(true); }
});

/** Fila resumida de un riesgo (toca para ver el detalle). */
function riskRow(r,i){
  var n = nivel(r.p*r.c), nr = nivel(r.pRes*r.cRes), desc = r.confirmado===false, X = experto();
  var niveles = X ? (r.p*r.c)+(r.fam==='PSI'?'':' → '+(r.pRes*r.cRes)) : n+(r.fam==='PSI'||nr===n?'':' → '+nr);

/** Analiza (una por una) las tareas pendientes de una evaluación. Devuelve una promesa. */

function normTxt(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
/**
 * Antes de analizar: la IA corrige la redacción de las tareas pendientes (sin inventar datos)
 * y, la primera vez, sugiere tareas típicas del puesto que no se mencionaron.
 * Devuelve true para seguir con el análisis, o false si la persona prefiere revisar antes.
 */
function prepararTareas(ev){
  if (modo()!=='demo' && (SRV.version||0) < 8) return Promise.resolve(true);
  var pend = pendientesAnalisis(ev), sugerir = !ev.sugeridasVistas;
  busy(true, 'Preparando el análisis', pend.length>1 ? pend.length+' tareas' : '1 tarea');
  progTramo(0, 15, 9);
  return run('prepararPuesto', {proceso:ev.proceso, puesto:ev.puesto, lugar:ev.lugar, tareas:pend.map(function(t){return t.tarea;}), sugerir:sugerir}).then(function(r){
    pend.forEach(function(t,i){
      var nuevo = String((r.tareas||[])[i]||'').trim();
      if (nuevo && normTxt(nuevo)!==normTxt(t.tarea)) t.sugRed = nuevo; // v30: se sugiere, no se reemplaza
    });
    ev.sugeridasVistas = true; if (ev===cur) guardarBorrador();
    progPintar(15);
    var sug = (r.sugeridas||[]).filter(function(x){ return !ev.tareas.some(function(t){ return normTxt(t.tarea)===normTxt(x.tarea); }); });
    if (!sug.length) return true;
    return elegirSugeridas(ev, sug);
  }, function(e){ if (e.sinRed) throw e; return true; }); // si la IA falla aquí, se analiza igual con el texto original
}
function elegirSugeridas(ev, sug){
  return new Promise(function(ok){
    var pct = PROG.v; busy(false);
    abrirSheet(cabecera('¿Hace también estas tareas?', true)+
      '<p class="muted" style="margin-top:0">Suelen ser parte del puesto <b>'+esc(ev.puesto)+'</b> y no están en tu lista. Marca las que sí se realizan en esta instalación.</p>'+
      sug.map(function(x,i){ return '<label class="chk"><input type="checkbox" class="sugChk" data-i="'+i+'"><span>'+esc(x.tarea)+(x.rutinaria===false?' <span class="tag">No rutinaria</span>':'')+
        (x.motivo?'<br><span class="muted">'+esc(x.motivo)+'</span>':'')+'</span></label>'; }).join('')+
      '<p class="muted">Las que agregues usan las medidas actuales de la primera tarea; las podrás ajustar al revisar.</p>'+
      '<button class="btn" id="sugOk">Agregar y analizar</button><div style="height:8px"></div>'+
      '<button class="btn sec" id="sugRev">Agregar y revisarlas antes</button><div style="height:4px"></div>'+
      '<button class="btn ghost" style="width:100%" id="sugNo">Continuar sin agregar</button>', true);
    var tomar = function(){
      var med = ev.tareas[0] ? ev.tareas[0].medidasTexto : '';
      var el = Array.from(document.querySelectorAll('.sugChk')).filter(function(c){return c.checked;}).map(function(c){ return sug[+c.dataset.i]; });
      tomar.nuevas = el.map(function(x){ var t = nuevaTareaItem(med); t.tarea = x.tarea; t.rutinaria = x.rutinaria!==false; t.sugerida = true; ev.tareas.push(t); return t; });
      if (el.length && ev===cur) guardarBorrador();
      return el.length;
    };
    var seguir = function(){ cerrarSheet(); busy(true, 'Preparando el análisis', ''); progPintar(pct); ok(true); };
    $('sugOk').onclick = function(){ var n0 = tomar(); if (n0 && ev===cur){ cerrarSheet(); preguntarEpp(tomar.nuevas, function(){ busy(true,'Preparando el análisis',''); progPintar(pct); ok(true); }); } else seguir(); };
    $('sugNo').onclick = seguir;
    $('sugRev').onclick = function(){
      var n = tomar(); if (!n) return seguir();
      cerrarSheet(); paso = 2; render(); toast(n+(n===1?' tarea agregada':' tareas agregadas')+'. Revisa sus medidas y toca Analizar.', 6000); preguntarEpp(tomar.nuevas); ok(false);
    };
  });
}

/** Analiza (una por una) las tareas pendientes de una evaluación, con avance en porcentaje. Devuelve una promesa. */
function analizarCore(ev, base){
  base = base || 0;
  var lista = pendientesAnalisis(ev), total = lista.length, hechas = 0, varias = ev.tareas.length > 1;
  var ritmo = function(){ var b = base+(100-base)*Math.min(total, hechas+Math.min(3,total-hechas))/total;
    busy(true, total>1 ? 'Analizando '+total+' tareas ('+hechas+' listas)' : 'Analizando la tarea',
      (ev.puesto||'')+(ev.fotos.length?', con '+ev.fotos.length+(ev.fotos.length===1?' foto':' fotos'):'')+'. La pantalla se mantiene encendida.');
    progTramo(base+(100-base)*hechas/total, b, ev.fotos.length ? 22 : 14); };
  function una(t, reintento){
    ritmo();
    var payload = {id:t.id, proceso:ev.proceso, puesto:ev.puesto, tarea:t.tarea, lugar:ev.lugar, rutinaria:t.rutinaria,
      hombres:ev.hombres, mujeres:ev.mujeres, otros:ev.otros, sensibles:ev.sensibles, medidasTexto:t.medidasTexto, ceal:cealCentro(ev.centro),
      variasTareas:varias, epp:t.epp||[], fotos:ev.fotos.map(function(f){return {mime:f.mime,data:f.data};})};
    return run('analizarTarea', payload).then(function(res){
      t.riesgos = res.riesgos; t.observacionesFoto = res.observacionesFoto; t.medidasActuales = res.medidasActuales; t.quimicosAnalisis = res.quimicos || [];
      t.analizado = true; t.cambiada = false; t.guardada = false; t.aceptada = false; hechas++;
      ritmo();
      if (ev===cur) guardarBorrador();
    }, function(e){
      if (!reintento && /límite/i.test(e.message)){
        var s = 30; clearInterval(PROG.iv);
        return new Promise(function(ok){ var iv = setInterval(function(){ busy(true,'Límite gratuito de la IA alcanzado','Reintentando en '+(s--)+' s…'); if (s<0){ clearInterval(iv); ok(); } }, 1000); })
          .then(function(){ return una(t, true); });
      }
      e.hechas = hechas; e.total = total; throw e;
    });
  }
  // Hasta 3 tareas a la vez: el tiempo total baja a casi un tercio (el servidor procesa cada solicitud por separado)
  var cola = lista.slice(), activas = 0, error = null, PARALELO = Math.min(3, total);
  return new Promise(function(ok, ko){
    if (!total) return ok();
    var lanzar = function(){
      if (error) return;
      if (!cola.length && !activas) return ok();
      while (activas < PARALELO && cola.length){
        var t = cola.shift(); activas++;
        una(t).then(function(){ activas--; lanzar(); }, function(e){ activas--; if (!error){ error = e; ko(e); } });
      }
    };
    lanzar();
  }).then(function(){ progPintar(100); return {hechas:hechas, total:total, primera:lista[0]}; });
}

function analizarPendientes(){
  if (!validarPaso1()){ paso=1; render(); return; }
  cur.tareas = cur.tareas.filter(function(t){ return t.tarea.trim() || t.analizado; });
  if (!cur.tareas.length){ cur.tareas.push(nuevaTareaItem()); render(true); return toast('Escribe al menos una tarea.'); }
  if (!pendientesAnalisis().length){ paso = 3; render(); return; }
  if (!online()){
    cur.enCola = true; guardarBorrador(); fotosDB('guardar', cur.bid, cur.fotos);
    toast('Sin señal: la evaluación quedó en cola. Se analizará al volver la conexión.', 6000);
    cur = null; tab = 'inicio'; render(); return;
  }
  pedirPermisoAvisos();
  if (modo()==='demo' || (SRV.version||0) >= 11){ analizarEnServidor(cur); return; }
  var ev = cur;
  prepararTareas(ev).then(function(seguir){
    if (!seguir) return;
    return analizarCore(ev, 15).then(function(r){

function guardarTodas(){

  var lista = cur.tareas.filter(function(t){ return t.analizado && !t.guardada; });

  if (conFoto.length){ cur.idx = cur.tareas.indexOf(conFoto[0]); render(); toast('Confirma lo visto en las fotos de la Tarea '+(cur.idx+1)+', o usa "Aceptar todo".'); return; }

  if (vacias.length){ cur.idx = cur.tareas.indexOf(vacias[0]); render(); toast('La Tarea '+(cur.idx+1)+' no tiene riesgos. Agrega uno o quítala.'); return; }

      var ci = centroInfo(cur.centro);

function setInsp(campo, v){

  else { var it = INSP.items[k]; if (!it) return; if (a[0]==='med') { it.medida = v; guardarInsp(); return render(true); } it[a[0]] = v; }
  guardarInsp();
}
function guardarInspUI(){

function manejarGestion(e){
  var b = e.target.closest('[data-g]'); if (!b) return;
  var a = b.dataset.g.split(':'), c = a[0];
  if (b.tagName==='A') return;
  e.preventDefault();
  if (c==='ininsp'){ subMed = 'insp'; return irA('medidas'); }
  if (c==='nuevoreg') return nuevoRegistro();
  if (c==='nr'){ cerrarSheet(); var k0 = a[1];
    if (k0==='evaluar') return irA('evaluar'); if (k0==='inv'){ irA('inv'); return setTimeout(function(){ if (!INV) invNueva(); }, 200); } if (k0==='emitir') return irA('emitir'); if (k0==='persona'){ irA('personal'); return setTimeout(function(){ abrirTrabajador(null); }, 300); }
    subMed = k0; irA('medidas'); return setTimeout(function(){ k0==='insp' ? nuevaInspeccion() : nuevaObservacion(); }, 300); }
  if (c==='tm') return menuTarea(a[1]);
  if (c==='md') return menuMedida(a[1]);
  if (c==='delmed') return confirmarEliminarMedida(a[1]);
  if (c==='emsel'){ var D0 = datos.personal || {personas:[]};
    if (a[1]==='no') EMI.sel = [];
    else D0.personas.forEach(function(x){ var visible = (!EMI.puesto || x.puesto===EMI.puesto) && (!EMI.q || (x.nombre+' '+x.rut).toLowerCase().indexOf(EMI.q.toLowerCase())>=0);
      var pend = a[1]!=='pend' || EMI.mods.some(function(m){ var e = x.estado||{}; return m==='cap' ? !(e.cap && Object.keys(e.cap).length) : (!e[m] || (m==='irl' && x.irlDesactualizada)); });
      if (visible && pend && EMI.sel.indexOf(x.id)<0) EMI.sel.push(x.id); });
    EMI.rev = null; return render(true); }
  if (c==='emrev') return revisarEmision();
  if (c==='emgo') return generarEmision();
  if (c==='usared'){ var tu = cur && cur.tareas[+a[1]]; if (tu && tu.sugRed){ tu.original = tu.tarea; tu.tarea = tu.sugRed; tu.sugRed = ''; tu.corregida = true; if (tu.analizado) tu.cambiada = true; guardarBorrador(); render(true); } return; }
  if (c==='nousared'){ var tn = cur && cur.tareas[+a[1]]; if (tn){ tn.sugRed = ''; guardarBorrador(); render(true); } return; }
  if (c==='sub') return irSub(a[1]);
  if (c==='medv'){ filtroMed = 'vencidas'; return irSub('medidas'); }
  if (c==='genprog') return generarProgramaUI();
  if (c==='evalprog') return evaluarProgramaUI();
  if (c==='reg') return abrirRegistroProg(a[1]);
  if (c==='act') return abrirActividad(a[1]);
  if (c==='nact') return abrirActividad(null, a[1]);
  if (c==='cond') return guardarProg({conduccion:a[1]==='1'});
  if (c==='nins') return nuevaInspeccion();
  if (c==='nobs') return nuevaObservacion();
  if (c==='icont') return continuarInsp();
  if (c==='idesc'){ var copia = INSP || borradorInsp(); descartarInsp(); render(); return conDeshacer('Descartada.', function(){ INSP = copia; guardarInsp(); render(); }); }
  if (c==='vins') return verInspeccion(a[1]);
  if (c==='pl') return elegirPlantilla(a[1]);
  if (c==='plmat') return plantillaMatriz(false);
  if (c==='plmp'){ var p = plantillaMatriz.L[+a[1]]; return iniciarInsp({plantilla:'matriz', titulo:'Medidas de la matriz: '+p.puesto, lugar:p.proceso||'', items:p.items.map(function(x){ return {txt:x.txt, res:'', riesgo:x.riesgo, grupo:x.riesgo||''}; })}); }
  if (c==='obsp') return iniciarObs(+a[1]);
  if (!INSP) return;
  if (c==='isalir'){ guardarInsp(); INSP = null; render(); return toast('Quedó guardada. Continúala desde Inspecciones.'); }
  if (c==='iguardar') return guardarInspUI();
  if (c==='iadd'){ INSP.items.push({txt:'', res:'', nuevo:true}); guardarInsp(); render(true); var l = document.querySelectorAll('.insp-it'); if (l.length) l[l.length-1].scrollIntoView({behavior:'smooth', block:'center'}); return; }
  var k = +a[1], it = INSP.items[k]; if (!it) return;
  if (c==='ires'){ it.res = it.res===a[2] ? '' : a[2]; guardarInsp(); return render(true); }
  if (c==='icrit'){ it.crit = a[2]; it.plazo = sumaDias({Alta:2,Media:7,Baja:30}[a[2]]); guardarInsp(); return render(true); }
  if (c==='iretro'){ INSP.retro = a[1]==='1'; guardarInsp(); return render(true); }
  if (c==='ifoto'){ var inp = $('fotoInsp'); inp.dataset.k = k; inp.value = ''; return inp.click(); }
  if (c==='ifq'){ delete INSP_FOTOS[k]; guardarInsp(); return render(true); }
  if (c==='idel'){
    var quitado = INSP.items.splice(k,1)[0], fotos = INSP_FOTOS, nf = {};
    Object.keys(fotos).forEach(function(i){ i = +i; if (i<k) nf[i] = fotos[i]; else if (i>k) nf[i-1] = fotos[i]; }); INSP_FOTOS = nf;
    guardarInsp(); render(true);
    return conDeshacer('Ítem quitado.', function(){ INSP.items.splice(k,0,quitado); INSP_FOTOS = fotos; guardarInsp(); render(true); });
  }
}

/* ======================= Hojas emergentes ======================= */
/* ---- Hojas (formularios): no se pierde lo escrito ----
   - Tocar fuera de un formulario no lo cierra.
   - Lo escrito se guarda como borrador mientras se escribe; si se cierra con × o con "atrás" del teléfono,
     al volver a abrir el mismo formulario se recupera. Al guardar (cierre normal) el borrador se borra.
   - El botón "atrás" del teléfono cierra la hoja en vez de salir de la app. */
var SH = {key:null, ini:'', hist:false, ignorarPop:0};
function claveCampoSh(el){ return el.id ? '#'+el.id : (el.name ? 'n:'+el.name+':'+el.value : null); }
function snapSheet(){
  var o = {};
  document.querySelectorAll('#sheetPane input, #sheetPane textarea, #sheetPane select').forEach(function(el){
    if (/^(file|password|hidden|button|submit|search)$/.test(el.type)) return;
    var k = claveCampoSh(el); if (!k) return;
    o[k] = (el.type==='radio'||el.type==='checkbox') ? el.checked : el.value;
  });
  return o;
}
function hashTxt(t){ var h = 0; for (var i=0;i<t.length;i++){ h = ((h<<5)-h+t.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function guardarBorradorSheet(){ if (!SH.key) return; try{ var v = JSON.stringify(snapSheet()); if (v===SH.ini) localStorage.removeItem(SH.key); else localStorage.setItem(SH.key, JSON.stringify({t:Date.now(), v:v})); }catch(e){} }
function prepararBorradorSheet(){
  var tit = (($('sheetPane').querySelector('h2')||{}).textContent||'').trim(), ini = snapSheet();
  if (!tit || !Object.keys(ini).length){ SH.key = null; return; }
  SH.ini = JSON.stringify(ini); SH.key = 'bsh:'+tit+'|'+hashTxt(SH.ini);
  try{
    var d = JSON.parse(localStorage.getItem(SH.key)||'null');
    if (!d || Date.now()-d.t > 3*86400000 || d.v===SH.ini) return;
    var v = JSON.parse(d.v), cambios = [];
    document.querySelectorAll('#sheetPane input, #sheetPane textarea, #sheetPane select').forEach(function(el){
      var k = claveCampoSh(el); if (!k || !(k in v)) return;
      if (el.type==='radio'||el.type==='checkbox'){ if (el.checked!==v[k]){ el.checked = v[k]; cambios.push(el); } }
      else if (el.value!==v[k]){ el.value = v[k]; cambios.push(el); }
    });
    cambios.forEach(function(el){ el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); });
    if (cambios.length) toast('Recuperamos lo que estabas escribiendo.', 4000);
  }catch(e){}
}
function hayFormulario(){ return !!$('sheetPane').querySelector('input:not([type=hidden]):not([type=search]), textarea, select'); }
function abrirSheet(html, fijo){
  var yaAbierta = $('sheet').classList.contains('on');
  if (yaAbierta && SH.key){ // se pasó a otra hoja (p. ej. tras guardar): el borrador anterior ya no sirve
    var tNuevo = ((html.match(/<h2[^>]*>([\s\S]*?)<\/h2>/)||[])[1]||'').replace(/<[^>]+>/g,'').trim();
    if (SH.key.indexOf('bsh:'+tNuevo+'|')!==0){ try{ localStorage.removeItem(SH.key); }catch(e){} SH.key = null; }
  }
  $('sheetPane').innerHTML = html; if (fijo) $('sheet').dataset.fijo = '1'; else delete $('sheet').dataset.fijo;
  $('sheet').classList.add('on'); $('sheetPane').scrollTop = 0;
  if (!yaAbierta && !SH.hist){ try{ history.pushState({sh:1}, ''); SH.hist = true; }catch(e){} }
  if (yaAbierta && SH.key) guardarBorradorSheet(); // la misma hoja se volvió a dibujar: se mantiene su borrador
  else prepararBorradorSheet();
}
/** modo 'x' o 'atras' = salir sin guardar (queda el borrador). Sin modo = cierre normal tras guardar (se borra el borrador). */
function cerrarSheet(modo){
  if (!$('sheet').classList.contains('on')) return;
  if (SH.key){
    if (modo==='x' || modo==='atras'){ guardarBorradorSheet(); try{ if (localStorage.getItem(SH.key)) toast('Lo escrito quedó guardado: al abrir de nuevo se recupera.', 4000); }catch(e){} }
    else { try{ localStorage.removeItem(SH.key); }catch(e){} }
  }
  SH.key = null;
  $('sheet').classList.remove('on'); delete $('sheet').dataset.fijo;
  if (SH.hist){ SH.hist = false; if (modo!=='atras'){ SH.ignorarPop++; try{ history.back(); }catch(e){ SH.ignorarPop--; } } }
}
function cerrarSheetFondo(){ if (hayFormulario()){ guardarBorradorSheet(); toast('Para salir toca ×. Lo escrito no se pierde.', 3000); return; } cerrarSheet('x'); }
function cabecera(t, sinCerrar){ return '<div class="sh-h"><h2>'+t+'</h2>'+(sinCerrar?'':'<button class="x" onclick="cerrarSheet(\'x\')" aria-label="Cerrar">×</button>')+'</div>'; }
/* Botón "atrás" del teléfono: cierra la hoja, retrocede un paso de la evaluación o pide confirmar para salir. */
var ultimoAtras = 0;
try{ history.replaceState({base:1}, ''); history.pushState({app:1}, ''); }catch(e){}
window.addEventListener('popstate', function(e){
  if (SH.ignorarPop>0){ SH.ignorarPop--; return; }
  if (document.body.classList.contains('menu-on') && window.innerWidth<980){ cerrarMenu(); try{ history.pushState({app:1}, ''); }catch(er){} return; }
  if ($('sheet').classList.contains('on')){ SH.hist = false; if ($('sheet').dataset.fijo){ try{ history.pushState({sh:1}, ''); SH.hist = true; }catch(x){} return; } cerrarSheet('atras'); return; }
  var st = e.state || {};
  if (st.app) return;
  if (tab==='evaluar' && cur && paso>1){ paso--; guardarBorrador(); render(); try{ history.pushState({app:1}, ''); }catch(x){} return; }
  if (Date.now()-ultimoAtras < 2500){ try{ history.back(); }catch(x){} return; }
  ultimoAtras = Date.now(); toast('Para salir de la app, toca atrás otra vez.', 2500);
  try{ history.pushState({app:1}, ''); }catch(x){}
});
document.addEventListener('input', function(e){ if (SH.key && e.target.closest && e.target.closest('#sheetPane')) guardarBorradorSheet(); }, true);
document.addEventListener('change', function(e){ if (SH.key && e.target.closest && e.target.closest('#sheetPane')) guardarBorradorSheet(); }, true);

function iniciarConSesion(r){
  cfg.token = r.token; cfg.demo = false; save('iper_cfg', cfg);
  SRV.usuario = null; try{ localStorage.removeItem('iper_srv'); }catch(e){}
  busy(true,'Cargando tu cuenta…');
  busy(false); tab = 'centros'; init2();
}
function cerrarSesionLocal(msg){
  cfg.token = ''; save('iper_cfg', cfg); SRV.usuario = null; SRV.centros = []; cfg.centro = ''; cur = null;
  try{ localStorage.removeItem('iper_srv'); }catch(e){}
  ACC.vista = 'ingresar'; tab = 'acceso'; render(); if (msg) toast(msg, 6000);

function accionAcceso(id){
  var v = function(k){ var el = $(k); return el ? el.value.trim() : ''; };
  var fallo = function(e){ busy(false); toast(e.message, 6000); };
  if (id==='acDemo'){ cfg.demo = true; save('iper_cfg', cfg); tab = 'centros'; init2(); return; }
  if (id==='acIngresar'){
    ACC.correo = v('acCorreo'); if (!ACC.correo || !$('acClave').value) return toast('Escribe tu correo y contraseña.');
    busy(true,'Ingresando…');
    run('ingresar', ACC.correo, $('acClave').value).then(function(r){ busy(false); if (r.pendiente){ ACC.vista = 'verificar'; render(); toast('Tu cuenta no está activada: te enviamos un código.'); } else iniciarConSesion(r); }, fallo);
  }
  if (id==='acRegistrar'){
    var d = {nombre:v('rgNom'), rut:v('rgRut'), cargo:v('rgCar'), registro:v('rgReg'), telefono:v('rgTel'), correo:v('rgCorreo'), clave:$('rgClave').value, acepta:$('rgAcepta').checked};
    if (d.nombre.split(/\s+/).length<2) return toast('Escribe tu nombre y apellido.');
    if (!rutValido(d.rut)) return toast('Revisa el RUT.');
    if (d.registro && !formatoRegistro(d.registro)) return toast(MSG_REGISTRO, 6000); d.registro = formatoRegistro(d.registro);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(d.correo)) return toast('Revisa el correo.');
    if (d.clave.length<8 || !/[a-zA-Z]/.test(d.clave) || !/\d/.test(d.clave)) return toast('La contraseña debe tener al menos 8 caracteres, con letras y números.');
    if (d.clave!==$('rgClave2').value) return toast('Las contraseñas no coinciden.');
    if (!d.acepta) return toast('Debes aceptar los términos y la política de privacidad.');
    d.rut = formatoRut(d.rut); busy(true,'Creando tu cuenta…');
    run('registrarCuenta', d).then(function(r){ busy(false); ACC.correo = r.correo; ACC.vista = 'verificar'; render(); }, fallo);
  }
  if (id==='acVerificar'){
    if (!/^\d{6}$/.test(v('acCodigo'))) return toast('El código tiene 6 dígitos.');
    busy(true,'Activando…'); run('verificarCuenta', ACC.correo, v('acCodigo')).then(function(r){ busy(false);
      if (r.pendienteAprobacion){ ACC.vista = 'pendiente'; render(); return; }
      toast('Cuenta activada. ¡Bienvenido/a!'); iniciarConSesion(r); }, fallo);
  }
  if (id==='acReenviar'){ busy(true,'Enviando…'); run('reenviarCodigo', ACC.correo, ACC.vista==='restablecer'?'clave':'activar').then(function(){ busy(false); toast('Te enviamos un código nuevo.'); }, fallo); }
  if (id==='acRecuperar'){
    ACC.correo = v('acCorreo'); if (!ACC.correo) return toast('Escribe tu correo.');
    busy(true,'Enviando…'); run('recuperarClave', ACC.correo).then(function(){ busy(false); ACC.vista = 'restablecer'; render(); }, fallo);
  }
  if (id==='acRestablecer'){
    var n = $('acNueva').value;
    if (!/^\d{6}$/.test(v('acCodigo'))) return toast('El código tiene 6 dígitos.');
    if (n.length<8 || !/[a-zA-Z]/.test(n) || !/\d/.test(n)) return toast('La contraseña debe tener al menos 8 caracteres, con letras y números.');
    if (n!==$('acNueva2').value) return toast('Las contraseñas no coinciden.');
    busy(true,'Guardando…'); run('restablecerClave', ACC.correo, v('acCodigo'), n).then(function(r){ busy(false); toast('Contraseña cambiada.'); iniciarConSesion(r); }, fallo);
  }
}

/** Clave para reconocer el mismo EPP escrito de distinta forma (zapatos / calzado de seguridad, lentes / gafas, etc.). */
function eppClave(s){
  var t = String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\(.*?\)/g,' ');
  var G = [[/zapat|calzado|botin|bota/,'calzado'],[/casco/,'casco'],[/antiparra|gafas? hermetic/,'antiparras'],[/lente|gafa|anteojo/,'lentes'],[/careta|pantalla facial|protector facial|escudo facial/,'careta'],
    [/auditiv|fono|tapon|orejera/,'auditivo'],[/respirador|mascarilla|semimascara|mascara/,'respirador'],[/chaleco|reflect/,'chaleco'],[/arnes/,'arnes'],[/bloqueador|protector solar|fps/,'solar'],
    [/legionario|cubrenuca|jockey|gorro/,'legionario'],[/cabo de vida|estrobo|linea de vida/,'cabo']];
  for (var i=0;i<G.length;i++) if (G[i][0].test(t)) return G[i][1];
  if (/guante/.test(t)){ var m = t.match(/cabritilla|nitrilo|multiflex|latex|cuero|dielectric|anticorte|soldador|pvc|termic/); return 'guante '+(m?m[0]:''); }
  if (/ropa|overol|buzo|traje|pechera|delantal/.test(t)){ var r = t.match(/impermeable|termic|ignifug|soldador|quimic/); return 'ropa '+(r?r[0]:''); }
  return t.replace(/\b(de|del|la|el|para|con|y|tipo|seguridad|proteccion)\b/g,' ').replace(/s\b/g,'').replace(/\s+/g,' ').trim();
}

/** Marcas (con sus modelos) para un EPP: las habituales más las que ya usaste en tus entregas. */
function marcasEpp(epp, aprendidos){
  var c = eppClave(epp), base = EPP_MARCAS[c] || EPP_MARCAS[c.split(' ')[0]] || EPP_MARCAS.otro, out = {};
  Object.keys(base).forEach(function(m){ out[m] = base[m].slice(); });
  var ap = (aprendidos||{})[c] || {};
  Object.keys(ap).forEach(function(m){ var k = Object.keys(out).filter(function(x){ return normTxt(x)===normTxt(m); })[0] || m;
    out[k] = (out[k]||[]); (ap[m]||[]).forEach(function(md){ if (!out[k].some(function(x){ return normTxt(x)===normTxt(md); })) out[k].push(md); }); });
  return out;
}

/** Borradores de versiones anteriores: pasa los datos que estaban por tarea al puesto. */
function migrarDatosPuesto(ev){
  if (ev.migradoV25) return; ev.migradoV25 = true;
  var une = function(campo, lista){ var ya = lineasLista(ev[campo]).map(function(x){ return x.toLowerCase(); });
    var add = lista.filter(function(x){ x = String(x||'').trim(); if (!x || ya.indexOf(x.toLowerCase())>=0) return false; ya.push(x.toLowerCase()); return true; });
    if (add.length) ev[campo] = (String(ev[campo]||'').trim() ? String(ev[campo]).trim()+'\n' : '') + add.join('\n'); };
  une('eppTexto', (ev.epp||[]).concat.apply(ev.epp||[], (ev.tareas||[]).map(function(t){ return t.epp||[]; })));
  (ev.tareas||[]).forEach(function(t){
    une('maqTexto', (t.herramientas||[]).map(function(x){ return x.n||x; })); une('herrTexto', (t.accesorios||[]).map(function(x){ return x.n||x; }));
    une('quimTexto', (t.quimicos||[]).map(function(x){ return x.n||x; }));
    if (String(t.medidasTexto||'').trim() && !t.analizado) { une('medidasPuesto', String(t.medidasTexto).split(/[.;\n]+/)); t.medidasTexto = ''; }
  });
  ev.pAbierta = ev.pAbierta || {datos:true};
}
/** Paso 1 -> 2: la IA ordena y redacta las tareas del texto o listado (sin conexión, una por línea). */
function irPaso2(){
  if (!validarPaso1()) return;
  var txt = String(cur.relato||'').trim(), ev = cur;
  var hayTareas = cur.tareas.some(function(t){ return t.tarea.trim(); });
  if (!txt || txt===cur.relatoUsado){ if (!hayTareas && !txt){ cur.pAbierta.tareas = true; render(true); return toast('Escribe o pega las tareas del puesto.'); } paso = 2; guardarBorrador(); render(); return; }
  var agregar = function(lista){
    cur.tareas = cur.tareas.filter(function(t){ return t.tarea.trim() || t.analizado; });
    var vistos = cur.tareas.map(function(t){ return normTxt(t.tarea); }), n = 0;
    lista.forEach(function(x){ var tx = String(x.tarea||x).trim(); if (!tx || vistos.indexOf(normTxt(tx))>=0) return;
      var t = nuevaTareaItem(''); t.tarea = tx; t.rutinaria = x.rutinaria!==false; cur.tareas.push(t); vistos.push(normTxt(tx)); n++; });
    if (!cur.tareas.length) cur.tareas.push(nuevaTareaItem());
    cur.relatoUsado = txt; paso = 2; guardarBorrador(); render();
    toast(n+' tarea(s) listas. Revísalas y toca Analizar.', 5000);
  };
  var locales = lineasLista(txt).map(function(x){ return {tarea:x, rutinaria:true}; });
  return agregar(locales); // v30: el texto pasa tal cual (una tarea por línea); ordenar con IA es opcional en el paso 2
  if (!online() || txt.length<10) return agregar(locales);
  busy(true,'Ordenando las tareas…','La IA redacta y ordena tu descripción');
  run('separarTareas', {proceso:cur.proceso, puesto:cur.puesto, lugar:cur.lugar, texto:txt}).then(function(r){ busy(false); if (cur!==ev) return; agregar((r.tareas||[]).length ? r.tareas : locales); })
    .catch(function(e){ busy(false); if (e.sinRed || cur!==ev) return agregar(locales); toast('La IA no pudo ordenar las tareas; se usaron tal cual.', 5000); agregar(locales); });
}

function preguntarEppAntiguo(nuevas, listo){
  var disp = []; cur.tareas.forEach(function(t){ if (nuevas.indexOf(t)>=0) return; (t.epp||[]).forEach(function(e){ disp.push(e); }); }); disp = eppUnicos(disp);
  if (!disp.length || !nuevas.length){ if (listo) listo(); return; }
  if (cur.eppComun){ // ya se respondió en esta evaluación: se aplica solo, sin volver a preguntar
    nuevas.forEach(function(t){ t.epp = eppUnicos((t.epp||[]).concat(cur.eppComun)); });
    guardarBorrador(); render(true); if (cur.eppComun.length) toast('EPP comunes del puesto aplicados a '+(nuevas.length>1?'las tareas nuevas':'la tarea nueva')+'. Puedes ajustarlos en cada tarea.', 5000);
    if (listo) listo(); return;
  }
  var sel = nuevas.map(function(t){ return (t.epp||[]).slice(); });
  var pintar = function(){ $('peLista').innerHTML = nuevas.map(function(t,i){
      return '<div class="card" style="padding:12px"><div class="muted" style="margin-bottom:8px"><b style="color:var(--ink)">Tarea '+(cur.tareas.indexOf(t)+1)+'</b>'+(t.tarea?': '+esc(t.tarea.slice(0,90))+(t.tarea.length>90?'…':''):'')+'</div><div class="chips">'+
        disp.map(function(e){ return '<button type="button" class="chip'+(sel[i].indexOf(e)>=0?' on':'')+'" data-pe="'+i+'" data-e="'+esc(e)+'">'+esc(e)+'</button>'; }).join('')+'</div></div>'; }).join('');
    $('peLista').querySelectorAll('[data-pe]').forEach(function(b){ b.onclick = function(){ var s = sel[+b.dataset.pe], e = b.dataset.e, j = s.indexOf(e); if (j>=0) s.splice(j,1); else s.push(e); pintar(); }; }); };
  abrirSheet(cabecera('¿Qué EPP se repiten?', true)+'<p class="muted" style="margin-top:0">Estos EPP ya se usan en otras tareas del puesto. Marca los que también se usan en '+(nuevas.length>1?'cada tarea nueva':'la tarea nueva')+'.</p><div id="peLista"></div>'+
    '<button class="btn ghost" style="width:100%;margin-bottom:8px" id="peTodos">'+(nuevas.length>1?'Todas usan estos mismos EPP':'Usa todos estos EPP')+'</button>'+
    '<label class="chk"><input type="checkbox" id="peRecordar" checked><span>No volver a preguntar en esta evaluación: aplicar lo mismo a las tareas que agregue</span></label>'+
    '<button class="btn" id="peOk">Aplicar</button><button class="btn ghost" style="width:100%;margin-top:6px" id="peNo">Ninguno se repite</button>', true);
  pintar();
  if ($('peTodos')) $('peTodos').onclick = function(){ sel = nuevas.map(function(t){ return eppUnicos((t.epp||[]).concat(disp)); }); pintar(); };

    }
    guardarBorrador(); cerrarSheet(); render(true); if (listo) listo(); };
  $('peOk').onclick = function(){ fin(true); }; $('peNo').onclick = function(){ fin(false); };
}

/* ======================= Trabajo en segundo plano y avisos ======================= */
/** Pide permiso para avisar (debe llamarse al tocar un botón). */
function pedirPermisoAvisos(){
  try{ if ('Notification' in window && Notification.permission==='default') Notification.requestPermission().catch(function(){}); }catch(e){}
}
/** Avisa en el teléfono que terminó un trabajo largo (si la app no está a la vista) y vibra. */
function avisar(titulo, cuerpo, tag){
  try{ if (navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
  if (document.visibilityState==='visible') return;
  try{
    if (!('Notification' in window) || Notification.permission!=='granted') return;
    var op = {body:cuerpo||'', tag:tag||'iper', icon:'icon-192.png', badge:'icon-192.png', renotify:true, data:{url:location.href}};
    if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(function(r){ r.showNotification(titulo, op); }).catch(function(){ new Notification(titulo, op); });
    else new Notification(titulo, op);
  }catch(e){}
}
/** Igual que run(), pero con un identificador de trabajo fijo: si la app se cierra, el resultado se recupera al volver. */
function runJob(id, fn){
  var args = Array.prototype.slice.call(arguments,2);
  if (modo()!=='api') return run.apply(null, [fn].concat(args));
  if (!navigator.onLine) return Promise.reject(sinRed());
  var job = {id:id, fn:fn, args:args, inicio:Date.now()};
  enCurso[job.id] = job;
  var base = new Promise(function(res,rej){ job.res = res; job.rej = rej; });
  enviarJob(job).then(job.res, job.rej);
  return base.then(function(j){
    job.hecho = true; delete enCurso[job.id];
    if (!j.ok){
      if (/^SESION:/.test(j.error)){ var msg = j.error.replace(/^SESION:\s*/,''); setTimeout(function(){ cerrarSesionLocal(msg); }, 0); var es = new Error(msg); es.sesion = true; throw es; }
      throw new Error(j.error);
    }
    return j.data;
  }, function(e){ job.hecho = true; delete enCurso[job.id]; throw e; });
}
function payloadPuesto(ev, lista){

    ceal:cealCentro(ev.centro), sugerir:!ev.sugeridasVistas, corregir:true, fotos:ev.fotos.map(function(f){ return {mime:f.mime, data:f.data}; }),
    epp:datosPuestoEv(ev).epp, pts:datosPuestoEv(ev).pts, medidasPuesto:datosPuestoEv(ev).medidasPuesto,
    tareas:lista.map(function(t){ var dp = datosPuestoEv(ev); return {id:t.id, tarea:t.tarea, rutinaria:t.rutinaria, medidasTexto:t.medidasTexto||'', epp:dp.epp, herramientas:dp.herramientas, accesorios:dp.accesorios, quimicos:dp.quimicos}; })};
}
/**
 * Corrección de redacción + análisis de todas las tareas en el servidor, en una sola solicitud.
 * Sigue aunque se bloquee el teléfono o se use otra app; al terminar avisa con una notificación.
 */
function analizarEnServidor(ev, reanudar){
  var lista = reanudar ? ev.job.tareas.map(function(k){ return ev.tareas[k]; }).filter(Boolean) : pendientesAnalisis(ev);
  if (!lista.length){ ev.job = null; guardarBorrador(); return Promise.resolve(); }
  if (!reanudar) ev.job = {id:nuevoJob(), inicio:Date.now(), tareas:lista.map(function(t){ return ev.tareas.indexOf(t); })};
  if (ev===cur) guardarBorrador();
  var n = lista.length, est = 14 + Math.ceil(n/4)*16 + (ev.fotos.length?10:0);
  busy(true, n>1 ? 'Analizando '+n+' tareas' : 'Analizando la tarea',
    'Puedes usar otras apps o bloquear el teléfono: te avisaremos cuando termine.');
  var trans = Math.max(0, (Date.now()-ev.job.inicio)/1000);
  progTramo(Math.min(90, trans/est*100), 100, Math.max(6, est-trans));
  return runJob(ev.job.id, 'analizarPuesto', payloadPuesto(ev, lista)).then(function(r){
    var bien = 0, fallas = 0;
    lista.forEach(function(t, i){
      var x = r.tareas[i] || {};
      if (x.corregida && normTxt(x.corregida)!==normTxt(t.tarea)) t.sugRed = x.corregida; // v30: sugerencia opcional
      if (x.error){ fallas++; return; }
      t.riesgos = x.riesgos; t.observacionesFoto = x.observacionesFoto; t.medidasActuales = x.medidasActuales; t.quimicosAnalisis = x.quimicos || [];
      t.analizado = true; t.cambiada = false; t.guardada = false; t.aceptada = false; bien++;
    });
    ev.sugeridasVistas = true;
    ev.sugeridas = (r.sugeridas||[]).filter(function(x){ return !ev.tareas.some(function(t){ return normTxt(t.tarea)===normTxt(x.tarea); }); });
    ev.job = null; ev.enCola = false;
    if (bien){ paso = 3; ev.exp = -1; var pri = lista.filter(function(t){ return t.analizado; })[0]; ev.idx = Math.max(0, ev.tareas.indexOf(pri)); }
    guardarBorrador(); progPintar(100);
    setTimeout(function(){ busy(false); }, 300);
    if (ev===cur) render();
    var msg = fallas ? bien+' de '+n+' tareas analizadas. Toca Analizar para terminar las demás.' : (n>1 ? n+' tareas analizadas. Revisa cada una y guárdalas.' : 'Tarea analizada. Revisa los riesgos y guárdala.');
    toast(msg, 6000);
    avisar(fallas ? 'Análisis incompleto' : 'Análisis listo', (ev.puesto||'Puesto')+': '+msg, 'analisis');
  }).catch(function(e){
    busy(false);
    if (e.sinRed){ ev.enCola = true; guardarBorrador(); fotosDB('guardar', ev.bid, ev.fotos); toast('Se perdió la señal. Al volver, la app recupera el resultado.', 6000); return; }
    ev.job = null; guardarBorrador(); render();
    toast(e.message, 8000); avisar('No se pudo analizar', e.message, 'analisis');
  });
}
/** Al abrir la app o una evaluación: si había un análisis en curso, recupera su resultado. */
function reanudarAnalisis(){
  if (!cur || !cur.job || busyOn) return;
  if (Date.now()-cur.job.inicio > 6*3600e3){ cur.job = null; guardarBorrador(); return; }
  analizarEnServidor(cur, true);
}

/** Pad de firma en pantalla. */
function padFirma(cv, btnLimpiar){
  var ctx = cv.getContext('2d'), dibujado = false, dib = false, last = null, ratio = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * ratio; cv.height = cv.clientHeight * ratio;
  ctx.scale(ratio, ratio); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  var pos = function(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown', function(e){ dib = true; last = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', function(e){ if (!dib) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; dibujado = true; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ dib = false; }); });
  btnLimpiar.onclick = function(e){ e.preventDefault(); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); dibujado = false; };
  return { vacia:function(){ return !dibujado; }, png:function(){ return cv.toDataURL('image/png').split(',')[1]; } };
}

/* ======================= Fotos ======================= */
function procesarFoto(file, max, png){
  max = max || 1280;
  return new Promise(function(ok,ko){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height, k = Math.min(1, max/Math.max(w,h));
        var cv = document.createElement('canvas'); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var big = png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.72);
        var t = document.createElement('canvas'), tk = 200/Math.max(cv.width,cv.height);
        t.width = Math.round(cv.width*tk); t.height = Math.round(cv.height*tk);
        t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
        ok({mime: png?'image/png':'image/jpeg', data:big.split(',')[1], thumb:t.toDataURL('image/jpeg',0.7)});
      };
      img.onerror = function(){ ko(new Error('No se pudo leer la imagen')); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/** Lee el enlace de acceso (?c=...) y configura la conexión automáticamente. */

  var m = location.search.match(/[?&]c=([^&#]+)/);
  if (!m) return false;
  try{
    var d = JSON.parse(deB64url(decodeURIComponent(m[1])));
    if (!d.u || !d.k) throw 0;
    var cambio = cfg.token && cfg.token!==d.k;
    cfg.apiUrl = d.u; cfg.token = d.k; save('iper_cfg', cfg);
    try{ localStorage.removeItem('iper_srv'); }catch(e){}
    SRV.usuario = null;
    history.replaceState(null, '', location.pathname);
    return cambio ? 'cambio' : 'nuevo';
