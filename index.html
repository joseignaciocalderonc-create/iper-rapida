<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>IPER Rápida</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* IPER Rápida v8 — sereno y legible: una sola tinta de acción (petróleo); el color fuerte queda para los niveles de riesgo */
  :root{
    --bg:#F5F7F6; --card:#FFFFFF; --ink:#1F2B2E; --muted:#6A787C; --line:#E2E7E5; --line2:#D3DAD7; --soft:#EEF2F1;
    --brand:#24585A; --accent:#24585A; --accent-ink:#FFFFFF; --act-soft:#E4EEED; --act-ink:#1B4446;
    --tol:#4C8C5A; --mod:#A57E14; --imp:#BD6129; --int:#B23A35;
    --tol-bg:#E8F2EA; --mod-bg:#F7F0DA; --imp-bg:#F7E6DB; --int-bg:#F6E0DE;
    --r:12px; --navh:0px;
    --f-text:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-head:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  body.con-nav{--navh:64px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-text);-webkit-font-smoothing:antialiased}
  svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  a{color:var(--brand)}

  /* Cabecera */
  header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 8px 8px}
  .top{display:flex;align-items:center;gap:4px;max-width:720px;margin:0 auto;min-height:44px}
  .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding-left:6px}
  .ttl b{display:block;font:600 19px/1.15 var(--f-head);letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl span.s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl>div{min-width:0}
  .marca{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
  .marca::after{content:'';width:12px;height:12px;border:2.5px solid #fff;border-radius:3px;transform:rotate(45deg)}
  #logoH img{height:30px;max-width:72px;object-fit:contain;border-radius:6px;display:block}
  .demo{font-size:11.5px;background:var(--mod-bg);color:#7A5C08;border-radius:99px;padding:2px 9px;font-weight:700}
  .hbtn{background:none;border:0;color:var(--muted);width:42px;height:42px;border-radius:10px;display:grid;place-items:center;padding:0}
  .hbtn:active{background:var(--soft)} .hbtn.on{color:var(--brand);background:var(--act-soft)}

  /* Navegación inferior (solo dentro de un centro) */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--card);border-top:1px solid var(--line);display:none;padding:4px 6px env(safe-area-inset-bottom)}
  body.con-nav nav{display:flex}
  nav .in{display:flex;width:100%;max-width:720px;margin:0 auto}
  nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;position:relative}
  nav button svg.i{width:22px;height:22px}
  nav button.on{color:var(--brand)}
  nav button.on::before{content:'';position:absolute;top:-4px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
  nav .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--brand);color:#fff;border-radius:99px;font-size:10.5px;padding:0 6px;line-height:16px}

  main{padding:18px 16px calc(120px + var(--navh));max-width:720px;margin:0 auto}
  h2{font:600 24px/1.2 var(--f-head);margin:0 0 4px;letter-spacing:.1px}
  h3{font-size:15.5px;margin:0 0 6px;font-weight:700}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:#3F4D51;margin:14px 0 6px}
  input[type=text],input[type=email],input[type=number],input[type=date],textarea,select{width:100%;font:inherit;font-size:15.5px;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;outline:none;transition:border-color .15s, box-shadow .15s}
  input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--act-soft)}
  ::placeholder{color:#9AA6A9}
  textarea{min-height:88px;resize:vertical;line-height:1.45}
  .row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid transparent;border-radius:11px;padding:13px 14px;font:inherit;font-weight:700;font-size:15px;background:var(--brand);color:var(--accent-ink);transition:filter .15s, transform .1s}
  .btn:active{transform:scale(.985);filter:brightness(.95)}
  .btn.sec{background:var(--card);color:var(--ink);border-color:var(--line2)}
  .btn.ghost{background:none;color:var(--brand);padding:10px;width:auto;border-color:transparent}
  .btn.peligro{color:var(--int)}
  .btn:disabled{opacity:.5}
  .bar{position:fixed;left:0;right:0;bottom:var(--navh);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 14px;z-index:15}
  body:not(.con-nav) .bar{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
  .steps{display:flex;gap:6px;margin:0 0 16px}
  .steps span{flex:1;height:4px;border-radius:9px;background:var(--line)} .steps span.on{background:var(--brand)}
  .pasos-t{font-size:13px;color:var(--muted);margin:0 0 4px}
  .toggle{display:flex;background:var(--soft);border-radius:10px;padding:3px}
  .toggle button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:inherit;font-weight:700;color:var(--muted)}
  .toggle button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(31,43,46,.12)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font:inherit;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
  .chip svg.i{width:16px;height:16px}
  .chip.on{background:var(--act-soft);color:var(--act-ink);border-color:#B9D0CE;font-weight:700}
  .photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph b{position:absolute;top:4px;right:4px;background:rgba(31,43,46,.7);color:#fff;border-radius:99px;width:24px;height:24px;display:grid;place-items:center;font-size:14px}
  .addph{aspect-ratio:1;border:1.5px dashed var(--line2);border-radius:10px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;text-align:center;background:var(--bg);margin:0}
  .risk{border-left:4px solid var(--line)}
  .risk .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .code{font:600 13.5px var(--f-head);background:var(--soft);color:var(--ink);border-radius:6px;padding:1px 7px;white-space:nowrap}
  .fam{font-size:12.5px;color:var(--muted);font-weight:700}
  .rname{font-weight:700;margin:2px 0}
  .just{font-size:13px;color:var(--muted);margin-top:6px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:#3F4D51;margin-right:4px}
  .pc{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:8px}
  .pc label{margin-top:0}
  .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:var(--card);padding:9px 0;font:600 15px var(--f-head);color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line2)}
  .seg button.on{background:var(--act-soft);color:var(--act-ink)}
  .vep{min-width:76px;text-align:center;border-radius:9px;padding:5px 6px;font:600 18px/1.1 var(--f-head)}
  .vep small{display:block;font:700 11px var(--f-text)}
  .Tolerable{background:var(--tol-bg);color:#33683F} .Moderado{background:var(--mod-bg);color:#6E550A}
  .Importante{background:var(--imp-bg);color:#93491D} .Intolerable{background:var(--int-bg);color:#8E2A26}
  .bl-Tolerable{border-left-color:var(--tol)} .bl-Moderado{border-left-color:var(--mod)} .bl-Importante{border-left-color:var(--imp)} .bl-Intolerable{border-left-color:var(--int)}
  .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;border-radius:8px}
  .ctrl{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .ctrl ul{margin:4px 0 0;padding-left:18px;font-size:14px}
  .note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;color:#3F4D51}
  .note.aviso{background:var(--mod-bg);border-color:#EBDDB0;color:#5E4808}
  .note.bien{background:var(--tol-bg);border-color:#CFE3D3;color:#2E5E39}
  .empty{text-align:center;color:var(--muted);padding:36px 16px}
  .sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .overlay{position:fixed;inset:0;background:rgba(31,43,46,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;opacity:0;visibility:hidden;transition:opacity .2s, visibility 0s .2s}
  .overlay.on{opacity:1;visibility:visible;transition:opacity .2s}
  .box{background:var(--card);border-radius:16px;padding:24px 22px;max-width:340px;width:100%;text-align:center}
  .box b{display:block;font-size:16px}
  .spin{width:34px;height:34px;border:3px solid var(--soft);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .prog{margin-top:16px}
  .prog .pt{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
  .prog .pt i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .4s ease}
  .prog span{display:block;font:600 28px/1 var(--f-head);margin-top:10px;color:var(--ink)}
  .sheet{position:fixed;inset:0;background:rgba(31,43,46,.42);z-index:40;display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:opacity .22s, visibility 0s .22s}
  .sheet.on{opacity:1;visibility:visible;transition:opacity .22s}
  .sheet .pane{background:var(--card);width:100%;max-width:720px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .sheet .pane::before{content:'';display:block;width:38px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
  .sheet.on .pane{transform:none}
  .sh-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .sh-h h2{font-size:21px;margin:0}
  .crit{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px}
  .crit td,.crit th{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}
  .crit th{color:var(--muted);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line2)}
  .toast{position:fixed;left:50%;bottom:calc(var(--navh) + 84px);transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:92%;width:max-content;display:flex;align-items:center;gap:14px;opacity:0;visibility:hidden;transition:opacity .2s, transform .2s, visibility 0s .2s}
  .toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s, transform .2s}
  .toast button{background:none;border:0;color:#A9D6D3;font:inherit;font-weight:700;padding:4px 2px;white-space:nowrap}
  .muted{color:var(--muted);font-size:13.5px}
  .hidden{display:none!important}
  .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .lbl>span:first-child{display:flex;align-items:center;gap:6px}
  .mic{white-space:nowrap;border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:4px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
  .mic svg.i{width:15px;height:15px}
  .mic.rec{background:var(--int);color:#fff;border-color:var(--int);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.65}}
  .confirm{background:var(--mod-bg);border:1px solid #EBDDB0;border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
  .confirm .row{margin-top:8px}
  .confirm .btn{padding:9px;font-size:14px}
  .rules{font-size:13px;color:#5E4808;background:var(--mod-bg);border-radius:8px;padding:7px 10px;margin-top:8px}
  .legal{font-size:12.5px;color:var(--muted);margin-top:8px}
  .prot{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--act-soft);color:var(--act-ink);margin:4px 4px 0 0}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
  .st-Borrador,.st-Pendiente{background:var(--soft);color:#3F4D51} .st-Revisada,.st-Implementada{background:var(--act-soft);color:var(--act-ink)}
  .st-Validada,.st-Verificada{background:var(--tol-bg);color:#33683F} .st-alerta{background:var(--int-bg);color:#8E2A26}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .tile b{display:block;font:600 28px/1.1 var(--f-head)} .tile span{font-size:13px;color:var(--muted)}
  .tile.alerta b{color:var(--int)}
  .barra{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
  .barra .n{width:88px;color:#3F4D51} .barra .t{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
  .barra .t i{display:block;height:100%;border-radius:99px} .barra .v{width:28px;text-align:right;font:600 15px var(--f-head)}
  .banner{background:var(--act-soft);border-radius:10px;color:var(--act-ink);padding:10px 12px;font-size:14px;margin-bottom:14px}
  .logo img{height:26px}
  .grp{font-size:13.5px;font-weight:700;color:var(--muted);margin:18px 0 8px}
  .search{margin-bottom:12px}
  .sec-t{font-size:14px;font-weight:700;color:var(--muted);margin:22px 0 8px}

  /* Listas agrupadas: una superficie con filas separadas por líneas, en vez de muchas tarjetas */
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
  .li{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .li:first-child{border-top:0}
  .li:active{background:var(--bg)}
  .li .tx{flex:1;min-width:0}
  .li .tx b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .tx b.wrap{white-space:normal}
  .li .tx span{display:block;font-size:13px;color:var(--muted)}
  .li .chev{color:#A9B4B6}
  .li .fi{width:40px;height:40px;border-radius:10px;background:var(--act-soft);color:var(--brand);display:grid;place-items:center;flex:none}
  .li .fi img{width:40px;height:40px;object-fit:contain;border-radius:10px;background:#fff}
  .li .ok-i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
  .li .ok-i.si{background:var(--tol-bg);color:var(--tol)} .li .ok-i.no{background:var(--mod-bg);color:var(--mod)}
  .li .ok-i svg.i{width:15px;height:15px;stroke-width:2.4}
  .li .num{font:600 15px var(--f-head);color:var(--muted)}
  .item,.rrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .item .tx,.rrow .tx{flex:1;min-width:0}
  .item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .tx span{font-size:13px;color:var(--muted)}
  .rrow{cursor:pointer}
  .rrow .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .rrow .tx b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .tx span{font-size:13px;color:var(--muted)}
  .rrow .vv{font-size:13px;font-weight:700;white-space:nowrap;color:#3F4D51}
  .rrow.open{border-color:var(--brand);border-bottom-left-radius:4px;border-bottom-right-radius:4px}
  .d-Tolerable{background:var(--tol)} .d-Moderado{background:var(--mod)} .d-Importante{background:var(--imp)} .d-Intolerable{background:var(--int)}

  /* Encabezado del centro */
  .chead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .chead .fi{width:52px;height:52px;border-radius:12px;background:var(--act-soft);color:var(--brand);display:grid;place-items:center;flex:none}
  .chead .fi svg.i{width:26px;height:26px}
  .chead .fi img{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line)}
  .pct{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .pct b{font:600 40px/1 var(--f-head)}
  .pct .t{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
  .pct .t i{display:block;height:100%;border-radius:99px}

  /* Burbujas de ayuda */
  .q{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--muted);font:700 12px/1 var(--f-text);padding:0;display:inline-grid;place-items:center;flex:none}
  .q[aria-expanded=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .bubble{position:relative;background:var(--act-soft);color:var(--act-ink);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin:2px 0 8px;animation:aparece .18s ease}
  .bubble::before{content:'';position:absolute;top:-6px;left:14px;border:6px solid transparent;border-top:0;border-bottom-color:var(--act-soft)}
  @keyframes aparece{from{opacity:0;transform:translateY(-3px)}}
  .corr{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .corr .pt-ok{width:7px;height:7px;border-radius:50%;background:var(--brand)}
  .orig{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;color:#3F4D51;margin-top:6px}
  details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
  details.sec>summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary .muted{font-weight:400;margin-left:auto}
  details.sec>summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 4px;transition:transform .2s}
  details.sec[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
  details.sec>.cu{padding:0 16px 16px;border-top:1px solid var(--line)}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink);font-weight:400;background:var(--bg);border-radius:10px;padding:11px 12px;margin:8px 0}
  .chk input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--brand)}

/* ======================= Evaluaciones en curso (borradores) ======================= */
/* Una evaluación = un puesto con una o varias tareas. Se pueden tener varias a medias.
   Los textos se guardan en el teléfono (localStorage) y las fotos en IndexedDB. */
function nuevoPuesto(){ return {bid:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), proceso:'',puesto:'',lugar:'',hombres:'',mujeres:'',otros:'',
  sensibles:{}, fotos:[], relato:'', tareas:[], idx:0, exp:-1, enCola:false, paso:1, actualizado:Date.now()}; }
function nuevaTareaItem(medidas){ return {id:null, tarea:'', rutinaria:true, medidasTexto:medidas||'', riesgos:[], medidasActuales:[], observacionesFoto:'', analizado:false, guardada:false, aceptada:false}; }
function tk(){ return cur.tareas[cur.idx] || cur.tareas[0]; }

function cargarBorradores(){
  var b = load('iper_borradores', null);
  if (!b){ // migración: borrador único de versiones anteriores
    b = {};
    var viejo = load('iper_borrador', null);
    if (viejo && (viejo.proceso || viejo.puesto || viejo.tarea || (viejo.tareas||[]).length)){ var n = normalizarBorrador(viejo); b[n.bid] = n; }
    try{ localStorage.removeItem('iper_borrador'); }catch(e){}
    save('iper_borradores', b);
  }
  return b;
}
function normalizarBorrador(b){
  var p = Object.assign(nuevoPuesto(), b||{});
  if (b && !Array.isArray(b.tareas)){
    var t = nuevaTareaItem(b.medidasTexto);
    ['id','tarea','rutinaria','riesgos','medidasActuales','observacionesFoto','analizado'].forEach(function(k){ if (b[k]!==undefined) t[k]=b[k]; });
    p.tareas = (t.tarea||t.riesgos.length) ? [t] : [];
    ['id','tarea','rutinaria','riesgos','medidasActuales','observacionesFoto','analizado','medidasTexto'].forEach(function(k){ delete p[k]; });
  }
  if (!p.bid) p.bid = nuevoPuesto().bid;
  p.fotos = []; p.idx = Math.min(p.idx||0, Math.max(0,p.tareas.length-1));
  return p;
}
function guardarBorrador(){
  if (!cur) return;
  cur.paso = paso; cur.actualizado = Date.now();
  var c = Object.assign({}, cur); delete c.fotos; c.nFotos = cur.fotos.length;
  borradores[cur.bid] = c; save('iper_borradores', borradores);
}
function borrarBorrador(bid){ delete borradores[bid]; save('iper_borradores', borradores); fotosDB('borrar', bid); }
function listaBorradores(){ return Object.keys(borradores).map(function(k){return borradores[k];}).sort(function(a,b){return b.actualizado-a.actualizado;}); }
function estadoBorrador(b){
  if (b.enCola) return {txt:'En cola: sin señal', cls:'st-alerta'};
  var an = b.tareas.filter(function(t){return t.analizado;}).length, gu = b.tareas.filter(function(t){return t.guardada;}).length;
  if (an && gu===an && an===b.tareas.length) return {txt:'Guardada', cls:'st-Validada'};
  if (an) return {txt:'Por revisar y guardar', cls:'st-Revisada'};
  return {txt:'En preparación', cls:'st-Borrador'};
}
function abrirBorrador(bid){
  cur = normalizarBorrador(borradores[bid]); paso = borradores[bid].paso || 1;
  if (!cur.centro) cur.centro = cfg.centro;
  if (paso===3 && !cur.tareas.some(function(t){return t.analizado;})) paso = cur.tareas.length ? 2 : 1;
  tab = 'evaluar'; render();
  fotosDB('leer', cur.bid).then(function(f){ if (cur && cur.bid===bid && f){ cur.fotos = f; render(true); } });
}
function nuevaEvaluacion(base){
  if (!cfg.centro && !(base && base.centro)){ abrirSelectorCentro(); toast('Primero elige el centro de trabajo de esta evaluación.'); return; }
  cur = Object.assign(nuevoPuesto(), {centro:cfg.centro}, base||{}); paso = cur.puesto ? 2 : 1;
  if (paso===2 && !cur.tareas.length) cur.tareas.push(nuevaTareaItem(base && base.ultimasMedidas || ''));
  delete cur.ultimasMedidas;
  guardarBorrador(); tab = 'evaluar'; render();
}

/* Fotos de cada borrador en IndexedDB (no caben en localStorage) */
function fotosDB(op, bid, fotos){
  return new Promise(function(ok){
    try{
      var rq = indexedDB.open('iper_fotos', 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('f'); };
      rq.onerror = function(){ ok(null); };
      rq.onsuccess = function(){
        var db = rq.result, tx = db.transaction('f', op==='leer'?'readonly':'readwrite'), st = tx.objectStore('f');
        if (op==='leer'){ var g = st.get(bid); g.onsuccess = function(){ ok(g.result||[]); }; g.onerror = function(){ ok([]); }; }
        else if (op==='guardar'){ st.put(fotos, bid); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }
        else { st.delete(bid); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }
      };
    }catch(e){ ok(null); }
  });
}

/* ======================= Servidor ======================= */
/*
 * Si la pantalla se apaga mientras se espera a la IA, la conexión se corta. Por eso:
 * 1) la pantalla se mantiene encendida mientras se trabaja (Wake Lock) y
 * 2) cada solicitud lleva un número (jobId); si la conexión se corta, la app recupera el resultado guardado en el servidor.
 */
var enCurso = {};
function nuevoJob(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function postApi(body){
  return fetch(cfg.apiUrl.trim(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow'})
    .then(function(r){ return r.text(); })
    .then(function(t){ try{ return JSON.parse(t); }catch(e){ var er = new Error('El servidor no respondió bien. Revisa el enlace de acceso.'); er.fatal = true; throw er; } });
}
function esperar(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function recuperarJob(job){
  var intentos = 0, desconocido = 0;
  function paso_(){
    if (job.hecho) return new Promise(function(){});
    intentos++;
    if (intentos > 75) return Promise.reject(new Error('No se pudo recuperar la respuesta. Revisa tu conexión e inténtalo de nuevo.'));
    return postApi({fn:'resultado', args:[job.id], token:cfg.token.trim()}).then(function(j){
      var r = j.ok ? j.data : {estado:'desconocido'};
      if (r.estado==='listo') return r.respuesta;
      if (r.estado==='grande') return enviarJob(job);
      if (r.estado==='desconocido'){ desconocido++; if (desconocido>=2 && !job.reenviado){ job.reenviado = true; return enviarJob(job); } }
      return esperar(4000).then(paso_);
    }, function(){ return esperar(4000).then(paso_); });
  }
  if (busyOn) $('busySub').textContent = 'Recuperando el resultado…';
  return paso_();
}

function run(fn){
  var args = Array.prototype.slice.call(arguments,1);
  var m = modo();
  if (m==='demo') return Promise.resolve().then(function(){ return Demo[fn].apply(null,args); });
  if (m==='api'){
    if (!navigator.onLine) return Promise.reject(sinRed());
    var job = {id:nuevoJob(), fn:fn, args:args, inicio:Date.now()};
    enCurso[job.id] = job;
    var base = new Promise(function(res,rej){ job.res = res; job.rej = rej; });
    enviarJob(job).then(job.res, job.rej);
    job.promesa = base.then(function(j){
      job.hecho = true; delete enCurso[job.id];
      if (!j.ok) throw new Error(j.error); return j.data;
    }, function(e){ job.hecho = true; delete enCurso[job.id]; throw e; });
    return job.promesa;
  }
  return new Promise(function(ok,ko){
    google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ ko(e && e.message ? e : new Error(String(e))); })[fn].apply(null,args);

}

/** Valida un RUT chileno (módulo 11). */
function rutValido(rut){
  var r = String(rut||'').replace(/[^0-9kK]/g,'').toUpperCase(); if (r.length<2) return false;
  var cuerpo = r.slice(0,-1), dv = r.slice(-1), suma = 0, mul = 2;
  for (var i=cuerpo.length-1;i>=0;i--){ suma += (+cuerpo[i])*mul; mul = mul===7?2:mul+1; }
  var res = 11-(suma%11), esp = res===11?'0':res===10?'K':String(res);
  return dv===esp;
}
function formatoRut(rut){ var r = String(rut||'').replace(/[^0-9kK]/g,'').toUpperCase(); if (r.length<2) return r; return r.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+r.slice(-1); }

/** Mismas reglas fijas que aplica el servidor. */
function aplicarReglas(r){
  var notas=[];
  if (r.pRes>r.p) r.pRes=r.p; if (r.cRes>r.c) r.cRes=r.c;
  var fuerte = JER_FUERTES.indexOf(r.jerarquia)>=0;
  if (!fuerte && r.cRes<r.c){ r.cRes=r.c; notas.push('La consecuencia no baja con medidas administrativas o EPP.'); }
  if (!fuerte){ var minP = r.p===4?2:1; if (r.pRes<minP){ r.pRes=minP; notas.push('Con medidas administrativas o EPP la probabilidad baja como máximo un nivel.'); } }
  if (r.p*r.c>=16 && r.pRes*r.cRes<=2){ r.pRes = r.cRes>=4?1:(r.cRes===2?2:4); notas.push('Un riesgo Intolerable no puede quedar Tolerable en una sola evaluación.'); }
  if (r.pEsp && r.pEsp*r.cEsp < r.pRes*r.cRes){ r.pEsp=r.pRes; r.cEsp=r.cRes; }
  r.reglas = notas; return r;
}

function getCampo(path){ var a = path.split(':'); return a[0]==='t' ? (cur.tareas[+a[1]]||{})[a[2]]||'' : cur[path]||''; }
function setCampo(path, v){ var a = path.split(':'); if (a[0]==='t'){ var t = cur.tareas[+a[1]]; t[a[2]] = v; if (t.analizado && (a[2]==='tarea'||a[2]==='medidasTexto')) t.cambiada = true; } else cur[path] = v; }

  if (n) toast('Volvió la conexión: '+n+' evaluación(es) en cola.', 8000, 'Analizar ahora', analizarCola);
  if (tab==='inicio') { cargar('panel'); render(true); }
});
window.addEventListener('offline', function(){ if (tab==='inicio') render(true); });

/* ======================= Evaluar (puesto con varias tareas) ======================= */
function stepper(){ return '<div class="steps">'+[1,2,3].map(function(i){return '<span class="'+(i<=paso?'on':'')+'"></span>';}).join('')+'</div>'; }
function pendientesAnalisis(p){ p = p||cur; return p.tareas.filter(function(t){ return t.tarea.trim() && (!t.analizado || t.cambiada); }); }

function renderNueva(){
  if (!cur) return ['<div class="empty">No hay una evaluación abierta.</div>',''];
  if (!puede('evaluador')) return ['<div class="empty">Tu perfil ('+esc(ROLES_TXT[rol()])+') permite ver la matriz, pero no crear evaluaciones.</div>',''];
  var h = stepper(), bar='';
  if (cur.reevaluando) h += '<div class="banner">Reevaluando una tarea existente. Al guardar se actualizará en la matriz y volverá a <b>Borrador</b>.</div>';
  if (cur.enCola) h += '<div class="banner">Esta evaluación está en cola. Se analizará cuando vuelva la conexión (o toca Analizar).</div>';
  if (cur.centro && !enEsteCentro(cur)) h += '<div class="note aviso" style="margin-bottom:12px">Esta evaluación pertenece a <b>'+esc(cur.centro)+'</b>, no al centro abierto.</div>';
  else if (!cur.centro) h += '<div class="note aviso" style="margin-bottom:12px">Esta evaluación no tiene centro. <a href="#" onclick="cur.centro=cfg.centro;guardarBorrador();render(true);return false">Asignarla a este centro</a></div>';

  if (paso===1){
    var L = SRV.listas[cur.centro] || {procesos:[],puestos:[]};
    h += '<p class="pasos-t">Paso 1 de 3</p><h2>Puesto de trabajo</h2><p class="sub">Datos comunes a todas las tareas del puesto.</p>'+
    '<div class="card">'+
      lab('Proceso', 'Etapa o área de la operación donde se hace el trabajo: recepción, producción, despacho, mantención, administración. Agrupa los puestos en la matriz.')+
      '<input type="text" list="dlProc" data-f="proceso" value="'+esc(cur.proceso)+'" autocomplete="off">'+
      '<datalist id="dlProc">'+L.procesos.map(function(p){return '<option value="'+esc(p)+'">';}).join('')+'</datalist>'+
      lab('Puesto de trabajo', 'Nombre del cargo tal como se usa en el centro. Si el mismo cargo tiene variantes, usa un solo nombre para que la matriz quede ordenada.')+
      '<input type="text" list="dlPue" data-f="puesto" value="'+esc(cur.puesto)+'" autocomplete="off">'+
      '<datalist id="dlPue">'+L.puestos.map(function(p){return '<option value="'+esc(p)+'">';}).join('')+'</datalist>'+
      lab('Lugar específico <span class="muted" style="font-weight:400">(opcional)</span>', 'Sector dentro del centro donde trabaja el puesto, si es uno en particular. Puedes dejarlo vacío.')+
      '<input type="text" data-f="lugar" value="'+esc(cur.lugar)+'" autocomplete="off">'+
      '<div style="height:14px"></div><button class="btn sec" id="btnBiblio">'+ico('libro')+'Elegir de puestos tipo</button>'+
    '</div>'+
    '<div class="card"><div class="lbl" style="margin:0"><h3 style="margin:0">Personas en el puesto</h3>'+ayuda('Cuántas personas ocupan este puesto, separadas por sexo. La matriz lo exige para el enfoque de género (DS 44).')+'</div><div class="row">'+
      '<div><label>Hombres</label><input type="number" min="0" inputmode="numeric" data-f="hombres" value="'+esc(cur.hombres)+'"></div>'+
      '<div><label>Mujeres</label><input type="number" min="0" inputmode="numeric" data-f="mujeres" value="'+esc(cur.mujeres)+'"></div>'+
      '<div><label>Otras</label><input type="number" min="0" inputmode="numeric" data-f="otros" value="'+esc(cur.otros)+'"></div></div>'+
      '<details style="margin-top:12px"'+(Object.keys(cur.sensibles).some(function(k){return cur.sensibles[k];})?' open':'')+'><summary class="muted">Personas especialmente sensibles, si hay</summary><div class="chips" style="margin-top:8px">'+
      SENS.map(function(s){return '<button class="chip '+(cur.sensibles[s[0]]?'on':'')+'" data-sens="'+s[0]+'">'+s[1]+'</button>';}).join('')+'</div></details>'+
    '</div>'+
    '<div class="card"><h3>Fotografías del puesto <span class="muted" style="font-weight:400">(opcional)</span></h3><p class="muted" style="margin:0 0 10px">Sirven para todas las tareas. Lo que la IA vea solo en las fotos te lo pedirá confirmar. Hasta 4 fotos, sin rostros.</p>'+
      '<div class="photos">'+cur.fotos.map(function(f,i){return '<div class="ph"><img src="'+f.thumb+'"><b data-delph="'+i+'">×</b></div>';}).join('')+
      (cur.fotos.length<4?'<label class="addph">'+ico('foto')+'Agregar<input id="foto" type="file" accept="image/*" multiple class="hidden"></label>':'')+'</div>'+
    '</div>';
    bar = '<button class="btn sec" style="flex:.4" id="btnSalir">Resumen</button><button class="btn" data-go="2">Continuar</button>';
  }

  else if (paso===2){
    if (!cur.tareas.length) cur.tareas.push(nuevaTareaItem());
    var pend = pendientesAnalisis().length;
    h += '<p class="pasos-t">Paso 2 de 3</p><h2>Tareas del puesto</h2><p class="sub">'+esc(cur.puesto)+'. Agrega todas sus tareas: se analizan juntas y la IA corrige la redacción antes de analizar.</p>';
    var relatoAbierto = !cur.tareas.some(function(t){ return t.tarea.trim(); });
    h += '<details class="sec"'+(relatoAbierto?' open':'')+'><summary>'+ico('ia')+'Contarlo todo de una vez</summary><div class="cu">'+
      '<label class="lbl"><span>Relato del puesto'+ayuda('Describe con tus palabras lo que hace la persona durante un turno, de principio a fin, aunque sea desordenado. La IA lo separa en tareas y propone las medidas que mencionaste.')+'</span>'+micBtn('relato')+'</label>'+
      '<textarea data-p="relato" placeholder="Escribe o dicta lo que hace el puesto en un turno">'+esc(cur.relato)+'</textarea>'+
      '<div style="height:10px"></div><button class="btn sec" id="btnSeparar">'+ico('ia')+'Separar en tareas</button></div></details>';
    h += cur.tareas.map(function(t,k){
      var estado = t.guardada?'<span class="st st-Validada">Guardada</span>':(t.analizado&&!t.cambiada)?'<span class="st st-Revisada">Analizada</span>':t.cambiada?'<span class="st st-alerta">Modificada</span>':t.sugerida?'<span class="st st-Borrador">Sugerida</span>':'';
      var corr = t.corregida && t.original ? '<div class="corr"><span class="pt-ok"></span>Redacción corregida por la IA<button class="btn ghost" style="padding:2px 4px;font-size:13px" data-orig="'+k+'">'+(t.verOrig?'Ocultar original':'Ver original')+'</button></div>'+
        (t.verOrig?'<div class="orig">'+esc(t.original)+'<div style="margin-top:6px"><button class="btn ghost" style="padding:2px 0;font-size:13px" data-restaurar="'+k+'">Volver a mi texto</button></div></div>':'') : '';
      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0;display:flex;gap:8px;align-items:center">Tarea '+(k+1)+' '+estado+'</h3>'+
        (cur.tareas.length>1?'<button class="x" data-deltk="'+k+'" aria-label="Quitar tarea">×</button>':'')+'</div>'+
        '<label class="lbl"><span>Descripción'+ayuda('Qué hace la persona, con qué equipos o materiales y dónde. Puede ser breve o dictada: al analizar, la IA corrige la redacción sin inventar datos.')+'</span><span style="display:flex;gap:6px">'+micBtn('t:'+k+':tarea')+'<button class="mic" data-mejorar="'+k+'">'+ico('ia')+'Mejorar</button></span></label>'+
        '<textarea data-p="t:'+k+':tarea" placeholder="Escríbela o díctala como te salga">'+esc(t.tarea)+'</textarea>'+corr+
        lab('Tipo', 'Rutinaria: se hace de forma habitual. No rutinaria: ocasional, como mantenciones, limpiezas profundas o emergencias.')+'<div class="toggle"><button data-rut="1" data-k="'+k+'" class="'+(t.rutinaria?'on':'')+'">Rutinaria</button><button data-rut="0" data-k="'+k+'" class="'+(!t.rutinaria?'on':'')+'">No rutinaria</button></div>'+
        '<label class="lbl"><span>Medidas preventivas actuales'+ayuda('Lo que ya existe hoy para controlar los riesgos de esta tarea: capacitación, procedimientos, elementos de protección personal, señalización, protecciones en máquinas. Déjalo vacío si no hay nada.')+'</span>'+micBtn('t:'+k+':medidasTexto')+'</label>'+
        '<textarea data-p="t:'+k+':medidasTexto" style="min-height:70px" placeholder="Escribe o dicta lo que existe hoy">'+esc(t.medidasTexto)+'</textarea>'+
        '<details style="margin-top:8px"><summary class="muted">Agregar medidas frecuentes</summary><div class="chips" style="margin-top:8px">'+MEDIDAS_RAPIDAS.map(function(m){return '<button class="chip" style="padding:5px 10px;font-size:12px" data-med="'+esc(m)+'" data-k="'+k+'">+ '+m+'</button>';}).join('')+'</div></details>'+
      '</div>';
    }).join('');
    h += '<div class="row"><button class="btn sec" id="btnAddTarea">'+ico('mas')+'Agregar tarea</button><button class="btn sec" id="btnBiblio">'+ico('libro')+'Tareas tipo</button></div>';
    h += '<p class="muted" style="text-align:center">Las medidas de la tarea anterior se copian a la nueva; edítalas si cambian.</p>';
    var hayRes = cur.tareas.some(function(t){return t.analizado;});
    bar = '<button class="btn sec" style="flex:.35" data-go="1">Atrás</button>'+
      (hayRes?'<button class="btn '+(pend?'sec':'')+'" style="flex:'+(pend?'.6':'1')+'" data-go="3">Resultados</button>':'')+
      (pend||!hayRes?'<button class="btn" id="btnAnalizar">'+(online()?'Analizar':'Dejar en cola')+(pend>1?' '+pend+' tareas':'')+'</button>':'');
  }

  else {
    var lista = cur.tareas.filter(function(t){return t.analizado;});
    if (!tk() || !tk().analizado) cur.idx = cur.tareas.indexOf(lista[0]);
    var t = tk();
    var porGuardar = cur.tareas.filter(function(x){return x.analizado && !x.guardada;}).length;
    h += '<p class="pasos-t">Paso 3 de 3</p><h2>Revisión</h2><p class="sub">'+esc(cur.puesto)+'. Toca un riesgo para ver o ajustar el detalle.</p>';
    h += '<div class="chips" style="margin-bottom:12px">'+cur.tareas.map(function(x,k){
      if (!x.analizado) return '';
      var pf = x.riesgos.filter(function(r){return r.confirmado===null;}).length;
      return '<button class="chip '+(k===cur.idx?'on':'')+'" data-tk="'+k+'">Tarea '+(k+1)+(x.guardada?' ✓':x.aceptada?' ✓':pf?' (confirmar)':'')+'</button>';
    }).join('')+'</div>';
    var pend2 = t.riesgos.filter(function(r){return r.confirmado===null;}).length;
    h += '<div class="card" style="background:var(--bg)"><div class="fam">Tarea '+(cur.idx+1)+(t.guardada?', guardada':t.aceptada?', aceptada':'')+'</div><div style="margin-top:4px">'+esc(t.tarea)+'</div>'+
      (t.corregida?'<div class="corr"><span class="pt-ok"></span>Redacción corregida por la IA</div>':'')+'</div>';
    if (t.observacionesFoto) h += '<div class="note" style="margin-bottom:12px"><b>En las fotos:</b> '+esc(t.observacionesFoto)+'</div>';
    if (pend2) h += '<div class="note aviso" style="margin-bottom:12px"><b>'+pend2+'</b> peligro(s) visto(s) solo en las fotos. Ábrelos para confirmar, o usa <b>Aceptar todo</b>.</div>';
    if (t.medidasActuales.length){
      h += '<details class="card"><summary><b>Medidas actuales clasificadas ('+t.medidasActuales.length+')</b></summary>'+t.medidasActuales.map(function(m){
        return '<div style="margin:6px 0"><span class="tag">'+esc(m.jerarquia)+'</span>'+esc(m.texto)+'</div>'; }).join('')+'</details>';
    }
    var idx = t.riesgos.map(function(r,i){ return i; });
    var importa = function(r){ return r.confirmado===null || r.p*r.c>=8 || (r.reglas&&r.reglas.length) || r.origen==='manual'; };
    var att = idx.filter(function(i){ return importa(t.riesgos[i]) && t.riesgos[i].confirmado!==false; }), resto = idx.filter(function(i){ return att.indexOf(i)<0; });
    var fila = function(i){ return riskRow(t.riesgos[i],i) + (cur.exp===i ? riskCard(t.riesgos[i],i) : ''); };
    if (!t.riesgos.length) h += '<div class="empty">No hay riesgos. Agrega uno manualmente.</div>';
    if (att.length) h += '<div class="sec-t" style="margin-top:4px">Revisa estos '+att.length+' de '+t.riesgos.length+'</div>'+att.map(fila).join('');
    else if (t.riesgos.length) h += '<div class="note bien" style="margin-bottom:10px">Ningún riesgo requiere atención especial en esta tarea.</div>';
    if (resto.length){
      var abierto = cur.verResto || !att.length;
      h += '<button class="btn ghost" style="width:100%;justify-content:space-between" id="btnVerResto"><span>'+resto.length+' riesgo(s) tolerables o moderados'+(att.length?' (aceptados)':'')+'</span><span>'+(abierto?'▴':'▾')+'</span></button>';
      if (abierto) h += resto.map(fila).join('');
    }
    h += '<div class="row" style="margin-top:6px"><button class="btn sec" id="btnAddRisk">'+ico('mas')+'Agregar riesgo</button>'+
      (t.guardada?'':'<button class="btn sec" id="btnAceptar">'+ico('ok')+'Aceptar todo</button>')+'</div>';
    var sig = cur.tareas.findIndex(function(x,k){ return k>cur.idx && x.analizado; });
    if (sig>=0) h += '<div style="height:10px"></div><button class="btn ghost" style="width:100%" data-tk="'+sig+'">Ver la tarea '+(sig+1)+'</button>';
    bar = '<button class="btn sec" style="flex:.4" data-go="2">Tareas</button>'+
      (porGuardar?'<button class="btn" id="btnGuardar">Guardar '+(porGuardar>1?'las '+porGuardar+' tareas':'la tarea')+'</button>':'<button class="btn" id="btnQueSigue">¿Qué sigue?</button>');
  }
  return [h,bar];
}

/** Fila resumida de un riesgo (toca para ver el detalle). */
function riskRow(r,i){
  var n = nivel(r.p*r.c), nr = nivel(r.pRes*r.cRes), desc = r.confirmado===false, X = experto();
  var niveles = X ? (r.p*r.c)+(r.fam==='PSI'?'':' → '+(r.pRes*r.cRes)) : n+(r.fam==='PSI'||nr===n?'':' → '+nr);
  return '<div class="rrow'+(cur.exp===i?' open':'')+'" data-exp="'+i+'" style="'+(desc?'opacity:.45':'')+'">'+
    '<span class="dot d-'+n+'"></span><div class="tx"><b>'+(X?esc(r.codigo)+' · ':'')+esc(r.peligro)+'</b><span>'+esc(r.riesgo)+'</span></div>'+
    (desc?'<span class="vv muted">Descartado</span>':'<span class="vv">'+(r.confirmado===null?'Confirmar · ':'')+niveles+'</span>')+
    '<span class="muted">'+(cur.exp===i?'▴':'▾')+'</span></div>';
}

/** Ficha simple (usuario final): nivel en palabras, peligro y medida. El detalle técnico queda a un toque. */
function riskCardSimple(r,i){
  var n = nivel(r.p*r.c), nr = nivel(r.pRes*r.cRes), descartado = r.confirmado===false;
  var h = '<div class="card risk bl-'+n+'" style="margin-top:-4px"><div class="hd"><div style="flex:1"><div class="fam">'+FAM[r.fam]+(r.origen==='foto'?', visto en foto':'')+'</div>'+
    '<div class="rname">'+esc(r.riesgo)+'</div></div><button class="x" data-del="'+i+'" aria-label="Eliminar">×</button></div>';
  if (r.origen==='foto' && r.confirmado!==true){
    h += '<div class="confirm">'+(descartado?'Descartado. ':'La IA vio este peligro en la foto. ¿Existe realmente en esta tarea?')+
      '<div class="row"><button class="btn" data-conf="'+i+'" data-v="1">Sí, existe</button><button class="btn sec" data-conf="'+i+'" data-v="0">No</button></div></div>';
  }
  if (descartado) return h+'</div>';
  h += '<div style="display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap"><span class="muted">Nivel hoy</span><span class="vep '+n+'" style="min-width:0;padding:4px 10px">'+n+'</span>'+
    (r.fam==='PSI'?'':'<span class="muted">→ con la medida</span><span class="vep '+nr+'" style="min-width:0;padding:4px 10px">'+nr+'</span>')+'</div>'+
    (r.justificacion?'<div class="just" style="margin-top:0">'+esc(r.justificacion)+'</div>':'')+
    '<label>Peligro</label><input type="text" data-rf="peligro" data-i="'+i+'" value="'+esc(r.peligro)+'">'+
    '<label>Qué hay que hacer (medida propuesta)</label><textarea data-rf="medidaPropuesta" data-i="'+i+'" style="min-height:60px">'+esc(r.medidaPropuesta)+'</textarea>'+
    (r.medidaEspecial?'<label>Para personas especialmente sensibles</label><textarea data-rf="medidaEspecial" data-i="'+i+'" style="min-height:50px">'+esc(r.medidaEspecial)+'</textarea>':'')+
    (r.protocolos&&r.protocolos.length?'<div style="margin-top:8px">'+r.protocolos.map(function(p){return '<span class="prot">Requiere: '+esc(p)+'</span>';}).join('')+'</div>':'')+
    '<div style="height:8px"></div><button class="btn ghost" style="width:100%" data-det="'+i+'">'+(cur.det===i?'Ocultar detalle técnico ▴':'Ajustar nivel o ver detalle técnico ▾')+'</button>';
  return h+'</div>' + (cur.det===i ? riskCardExperto(r,i) : '');
}
function riskCard(r,i){ return experto() ? riskCardExperto(r,i) : riskCardSimple(r,i); }
function riskCardExperto(r,i){
  var n = nivel(r.p*r.c), descartado = r.confirmado===false;
  var h = '<div class="card risk bl-'+n+'" style="margin-top:-4px">'+
    '<div class="hd"><div style="flex:1"><div class="fam">'+FAM[r.fam]+(r.origen==='foto'?', visto en foto':'')+(r.origen==='manual'?', agregado a mano':'')+'</div>'+
    '<div class="rname"><span class="code">'+esc(r.codigo)+'</span> '+esc(r.riesgo)+'</div></div>'+
    '<button class="x" data-del="'+i+'" aria-label="Eliminar">×</button></div>';
  if (r.origen==='foto' && r.confirmado!==true){
    h += '<div class="confirm">'+(descartado?'Descartado. ':'La IA vio este peligro en la foto, pero no estaba en la descripción. ¿Existe realmente en esta tarea?')+
      '<div class="row"><button class="btn" data-conf="'+i+'" data-v="1">Sí, existe</button><button class="btn sec" data-conf="'+i+'" data-v="0">No, descartar</button></div></div>';
  }
  if (descartado) return h+'</div>';
  h += '<label>Peligro</label><input type="text" data-rf="peligro" data-i="'+i+'" value="'+esc(r.peligro)+'">';
  if (r.fam==='PSI'){
    h += '<div class="pc"><div><label>P (CEAL-SM)</label><div class="muted">'+r.p+'</div></div><div><label>C</label><div class="muted">'+r.c+'</div></div>'+vepBox(r.p,r.c)+'</div>'+
      '<div class="just">'+esc(r.justificacion)+' Se valora por centro con CEAL-SM (cámbialo en Ajustes).</div>';
  } else {
    h += '<div class="pc"><div><label>P actual</label>'+seg('p',r.p,i)+'</div><div><label>C actual</label>'+seg('c',r.c,i)+'</div>'+vepBox(r.p,r.c)+'</div>'+
      (r.justificacion?'<div class="just">'+esc(r.justificacion)+'</div>':'');
  }
  h += '<div class="ctrl">'+
    '<label style="margin-top:0">Medidas actuales que aplican</label>'+
    (r.medidasActuales&&r.medidasActuales.length?'<ul>'+r.medidasActuales.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>':'<div class="muted">Ninguna</div>')+
    '<label>Medida propuesta</label><textarea data-rf="medidaPropuesta" data-i="'+i+'" style="min-height:60px">'+esc(r.medidaPropuesta)+'</textarea>'+
    '<label>Jerarquía de la medida</label><select data-rf="jerarquia" data-i="'+i+'">'+JER.map(function(j){return '<option'+(j===r.jerarquia?' selected':'')+'>'+j+'</option>';}).join('')+'</select>'+
    (r.fam==='PSI'?'':'<div class="pc"><div><label>P residual</label>'+seg('pRes',r.pRes,i)+'</div><div><label>C residual</label>'+seg('cRes',r.cRes,i)+'</div>'+vepBox(r.pRes,r.cRes)+'</div>')+
    (r.reglas&&r.reglas.length?'<div class="rules">'+r.reglas.map(esc).join('<br>')+'</div>':'')+
    (r.medidaEspecial?'<label>Medida especial (personas sensibles)</label><textarea data-rf="medidaEspecial" data-i="'+i+'" style="min-height:50px">'+esc(r.medidaEspecial)+'</textarea>':'')+
    (r.protocolos&&r.protocolos.length?'<div style="margin-top:8px">'+r.protocolos.map(function(p){return '<span class="prot">'+esc(p)+'</span>';}).join('')+'</div>':'')+
    '<div class="legal">'+(r.requisitoLegal?esc(r.requisitoLegal):'Requisito legal: se completa al guardar (tabla fija).')+'</div>'+
  '</div>';
  return h+'</div>';
}

function aceptarTodo(){
  var t = tk();
  t.riesgos.forEach(function(r){ if (r.confirmado===null) r.confirmado = true; });
  t.aceptada = true; cur.exp = -1; guardarBorrador();
  var sig = cur.tareas.findIndex(function(x){ return x.analizado && !x.aceptada && !x.guardada; });
  if (sig>=0){ cur.idx = sig; render(); toast('Tarea aceptada. Revisa la Tarea '+(sig+1)+'.'); }
  else { render(true); toast('Todas las tareas revisadas. Toca Guardar.'); }
}

function abrirAgregarRiesgo(){
  var opts = Object.keys(FAM).map(function(f){
    return '<optgroup label="'+FAM[f]+'">'+SRV.catalogo.filter(function(x){return x.fam===f;}).map(function(x){
      return '<option value="'+x.c+'">'+x.c+' – '+esc(x.r)+'</option>';}).join('')+'</optgroup>'; }).join('');
  abrirSheet(cabecera('Agregar riesgo')+
    lab('Peligro', 'La fuente o situación que puede causar daño: una máquina, una superficie, una sustancia, una postura o una condición del trabajo.')+'<input type="text" id="nrPel" autocomplete="off">'+
    '<label>Riesgo (código)</label><select id="nrCod">'+opts+'</select>'+

/** Analiza (una por una) las tareas pendientes de una evaluación. Devuelve una promesa. */

function normTxt(x){ return String(x||'').toLowerCase().replace(/[^a-zñáéíóúü0-9]+/g,' ').trim(); }
/**
 * Antes de analizar: la IA corrige la redacción de las tareas pendientes (sin inventar datos)
 * y, la primera vez, sugiere tareas típicas del puesto que no se mencionaron.
 * Devuelve true para seguir con el análisis, o false si la persona prefiere revisar antes.
 */
function prepararTareas(ev){
  if (modo()!=='demo' && (SRV.version||0) < 8) return Promise.resolve(true);
  var pend = pendientesAnalisis(ev), sugerir = !ev.sugeridasVistas;
  busy(true, 'Revisando la redacción', pend.length>1 ? 'Corrigiendo '+pend.length+' descripciones' : 'Corrigiendo la descripción');
  progTramo(0, 15, 9);
  return run('prepararPuesto', {proceso:ev.proceso, puesto:ev.puesto, lugar:ev.lugar, tareas:pend.map(function(t){return t.tarea;}), sugerir:sugerir}).then(function(r){
    pend.forEach(function(t,i){
      var nuevo = String((r.tareas||[])[i]||'').trim();
      if (nuevo && normTxt(nuevo)!==normTxt(t.tarea)){ t.original = t.tarea; t.tarea = nuevo; t.corregida = true; t.verOrig = false; }
    });
    ev.sugeridasVistas = true; if (ev===cur) guardarBorrador();
    progPintar(15);
    var sug = (r.sugeridas||[]).filter(function(x){ return !ev.tareas.some(function(t){ return normTxt(t.tarea)===normTxt(x.tarea); }); });
    if (!sug.length) return true;
    return elegirSugeridas(ev, sug);
  }, function(e){ if (e.sinRed) throw e; return true; }); // si la IA falla aquí, se analiza igual con el texto original
}
function elegirSugeridas(ev, sug){
  return new Promise(function(ok){
    var pct = PROG.v; busy(false);
    abrirSheet(cabecera('¿Hace también estas tareas?', true)+
      '<p class="muted" style="margin-top:0">Suelen ser parte del puesto <b>'+esc(ev.puesto)+'</b> y no están en tu lista. Marca las que sí se realizan en este centro.</p>'+
      sug.map(function(x,i){ return '<label class="chk"><input type="checkbox" class="sugChk" data-i="'+i+'"><span>'+esc(x.tarea)+(x.rutinaria===false?' <span class="tag">No rutinaria</span>':'')+
        (x.motivo?'<br><span class="muted">'+esc(x.motivo)+'</span>':'')+'</span></label>'; }).join('')+
      '<p class="muted">Las que agregues usan las medidas actuales de la primera tarea; las podrás ajustar al revisar.</p>'+
      '<button class="btn" id="sugOk">Agregar y analizar</button><div style="height:8px"></div>'+
      '<button class="btn sec" id="sugRev">Agregar y revisarlas antes</button><div style="height:4px"></div>'+
      '<button class="btn ghost" style="width:100%" id="sugNo">Continuar sin agregar</button>', true);
    var tomar = function(){
      var med = ev.tareas[0] ? ev.tareas[0].medidasTexto : '';
      var el = Array.from(document.querySelectorAll('.sugChk')).filter(function(c){return c.checked;}).map(function(c){ return sug[+c.dataset.i]; });
      el.forEach(function(x){ var t = nuevaTareaItem(med); t.tarea = x.tarea; t.rutinaria = x.rutinaria!==false; t.sugerida = true; ev.tareas.push(t); });
      if (el.length && ev===cur) guardarBorrador();
      return el.length;
    };
    var seguir = function(){ cerrarSheet(); busy(true, 'Preparando el análisis', ''); progPintar(pct); ok(true); };
    $('sugOk').onclick = function(){ tomar(); seguir(); };
    $('sugNo').onclick = seguir;
    $('sugRev').onclick = function(){
      var n = tomar(); if (!n) return seguir();
      cerrarSheet(); paso = 2; render(); toast(n+(n===1?' tarea agregada':' tareas agregadas')+'. Revisa sus medidas y toca Analizar.', 6000); ok(false);
    };
  });
}

/** Analiza (una por una) las tareas pendientes de una evaluación, con avance en porcentaje. Devuelve una promesa. */
function analizarCore(ev, base){
  base = base || 0;
  var lista = pendientesAnalisis(ev), total = lista.length, hechas = 0, varias = ev.tareas.length > 1;
  function una(t, reintento){
    var a = base+(100-base)*hechas/total, b = base+(100-base)*(hechas+1)/total;
    busy(true, total>1 ? 'Analizando tarea '+(hechas+1)+' de '+total : 'Analizando la tarea',
      (ev.puesto||'')+(ev.fotos.length?', con '+ev.fotos.length+(ev.fotos.length===1?' foto':' fotos'):'')+'. La pantalla se mantiene encendida.');
    progTramo(a, b, ev.fotos.length ? 28 : 18);
    var payload = {id:t.id, proceso:ev.proceso, puesto:ev.puesto, tarea:t.tarea, lugar:ev.lugar, rutinaria:t.rutinaria,
      hombres:ev.hombres, mujeres:ev.mujeres, otros:ev.otros, sensibles:ev.sensibles, medidasTexto:t.medidasTexto, ceal:cealCentro(ev.centro),
      variasTareas:varias, fotos:ev.fotos.map(function(f){return {mime:f.mime,data:f.data};})};
    return run('analizarTarea', payload).then(function(res){
      t.riesgos = res.riesgos; t.observacionesFoto = res.observacionesFoto; t.medidasActuales = res.medidasActuales;
      t.analizado = true; t.cambiada = false; t.guardada = false; t.aceptada = false; hechas++;
      progPintar(b);
      if (ev===cur) guardarBorrador();
    }, function(e){
      if (!reintento && /límite/i.test(e.message)){
        var s = 30; clearInterval(PROG.iv);
        return new Promise(function(ok){ var iv = setInterval(function(){ busy(true,'Límite gratuito de la IA alcanzado','Reintentando en '+(s--)+' s…'); if (s<0){ clearInterval(iv); ok(); } }, 1000); })
          .then(function(){ return una(t, true); });
      }
      e.hechas = hechas; e.total = total; throw e;
    });
  }
  return lista.reduce(function(p, t){ return p.then(function(){ return una(t); }); }, Promise.resolve()).then(function(){ progPintar(100); return {hechas:hechas, total:total, primera:lista[0]}; });
}

function analizarPendientes(){
  if (!validarPaso1()){ paso=1; render(); return; }
  cur.tareas = cur.tareas.filter(function(t){ return t.tarea.trim() || t.analizado; });
  if (!cur.tareas.length){ cur.tareas.push(nuevaTareaItem()); render(true); return toast('Escribe al menos una tarea.'); }
  if (!pendientesAnalisis().length){ paso = 3; render(); return; }
  if (!online()){
    cur.enCola = true; guardarBorrador(); fotosDB('guardar', cur.bid, cur.fotos);
    toast('Sin señal: la evaluación quedó en cola. Se analizará al volver la conexión.', 6000);
    cur = null; tab = 'inicio'; render(); return;
  }
  var ev = cur;
  prepararTareas(ev).then(function(seguir){
    if (!seguir) return;
    return analizarCore(ev, 15).then(function(r){
      setTimeout(function(){ busy(false); }, 350);
      ev.enCola = false; paso = 3; ev.exp = -1; ev.idx = ev.tareas.indexOf(r.primera); if (ev===cur){ guardarBorrador(); render(); }
      toast(r.total>1 ? r.total+' tareas analizadas. Revisa cada una y guárdalas.' : 'Tarea analizada. Revisa los riesgos y guárdala.');
    });
  }).catch(function(e){
    busy(false); guardarBorrador(); render();
    if (e.sinRed){ cur.enCola = true; guardarBorrador(); fotosDB('guardar', cur.bid, cur.fotos); toast('Se perdió la señal. La evaluación quedó en cola.', 6000); return; }
    toast((e.hechas?'Se analizaron '+e.hechas+' de '+e.total+'. ':'')+e.message+(e.hechas?' Toca "Analizar" para continuar.':''), 8000);
  });
}
function guardarTodas(){
  if (!cur.centro){ toast('Esta evaluación no tiene centro de trabajo.'); return; }
  if (!online()){ toast('Guardar necesita conexión. Tu evaluación queda en el teléfono; guárdala al volver la señal.', 6000); return; }
  var lista = cur.tareas.filter(function(t){ return t.analizado && !t.guardada; });
  var conFoto = lista.filter(function(t){ return t.riesgos.some(function(r){return r.confirmado===null;}); });
  if (conFoto.length){ cur.idx = cur.tareas.indexOf(conFoto[0]); render(); toast('Confirma lo visto en las fotos de la Tarea '+(cur.idx+1)+', o usa "Aceptar todo".'); return; }
  var vacias = lista.filter(function(t){ return !t.riesgos.some(function(r){return r.confirmado!==false;}); });
  if (vacias.length){ cur.idx = cur.tareas.indexOf(vacias[0]); render(); toast('La Tarea '+(cur.idx+1)+' no tiene riesgos. Agrega uno o quítala.'); return; }
  var n = 0, riesgos = 0, medidas = 0;
  lista.reduce(function(p, t){
    return p.then(function(){
      busy(true,'Guardando tarea '+(n+1)+' de '+lista.length+'…'); progPintar(n/lista.length*100);
      var copia = {id:t.id, proceso:cur.proceso, puesto:cur.puesto, tarea:t.tarea, lugar:cur.lugar, rutinaria:t.rutinaria,
        hombres:cur.hombres, mujeres:cur.mujeres, otros:cur.otros, sensibles:cur.sensibles, medidasTexto:t.medidasTexto,
        medidasActuales:t.medidasActuales, observacionesFoto:t.observacionesFoto, riesgos:t.riesgos, ceal:cealCentro(cur.centro)};
      var ci = centroInfo(cur.centro);
      return run('guardarTarea', JSON.parse(JSON.stringify(copia)), {empresa:ci?ci.razonSocial:cfg.empresa, centro:cur.centro, respEjec:cfg.respEjec}).then(function(r){
        t.id = r.id; t.guardada = true; n++; riesgos += r.riesgos; medidas += r.medidas; guardarBorrador();
      });
    });
  }, Promise.resolve()).then(function(){
    busy(false); refrescarConfig(); datos.panel = null; render(true);
    queSigue(n+' tarea(s) guardada(s): '+riesgos+' riesgos y '+medidas+' medidas para seguimiento.');
  }).catch(function(e){ busy(false); render(true); toast((n?n+' tarea(s) guardada(s). ':'')+e.message, 7000); });
}

/* ======================= Medidas ======================= */
function renderMedidas(){
  if (!cfg.centro) return [sinCentro(),''];
  if (!online()) return [sinConexionMsg(),''];
  var L = datos.medidas;
  var h = '<h2>Medidas</h2><p class="sub">El riesgo residual solo se acepta cuando la medida está verificada con evidencia.</p>';
  if (!L) return [h+cargando(),''];
  var filtros = [['abiertas','Abiertas'],['vencidas','Vencidas'],['Implementada','Implementadas'],['Verificada','Verificadas'],['todas','Todas']];
  h += '<div class="chips" style="margin-bottom:12px">'+filtros.map(function(f){
    var n = L.filter(function(m){return pasaFiltro(m,f[0]);}).length;
    return '<button class="chip '+(filtroMed===f[0]?'on':'')+'" data-fmed="'+f[0]+'">'+f[1]+' ('+n+')</button>'; }).join('')+'</div>';
  var vis = L.filter(function(m){return pasaFiltro(m,filtroMed);});
  if (!vis.length) return [h+'<div class="empty">No hay medidas en este filtro.</div>',''];
  h += vis.map(function(m){
    return '<div class="card risk bl-'+m.nivelInicial+'"><div class="fam">'+esc(m.puesto)+', '+esc(m.riesgo)+'</div>'+
      '<div class="rname">'+esc(m.medida)+'</div>'+
      '<div style="margin:6px 0"><span class="tag">'+esc(m.jerarquia)+'</span><span class="st st-'+m.estado+'">'+m.estado+'</span> '+
      (m.vencida?'<span class="st st-alerta">Vencida '+fecha(m.plazo)+'</span>':'<span class="muted">Plazo '+fecha(m.plazo)+'</span>')+'</div>'+
      '<div class="muted">Responsable: '+esc(m.responsable||'Sin asignar')+'<br>Verificador: '+esc(m.verificador)+'</div>'+
      (m.evidencia?'<div style="margin-top:6px"><a href="'+esc(m.evidencia)+'" target="_blank" rel="noopener">Ver evidencia</a></div>':'')+
      (puede('evaluador')?'<div class="acts">'+
        (m.estado==='Pendiente'?'<button class="chip" data-mest="Implementada" data-id="'+m.id+'">Marcar implementada</button>':'')+
        (m.estado!=='Verificada'?'<button class="chip on" data-verif="'+m.id+'">'+ico('foto')+'Verificar con foto</button>':'')+
        (m.estado!=='Pendiente'?'<button class="chip" data-mest="Pendiente" data-id="'+m.id+'">Volver a pendiente</button>':'')+
      '</div>':'')+'</div>';
  }).join('');
  return [h,''];
}
function pasaFiltro(m,f){
  if (f==='todas') return true; if (f==='abiertas') return m.estado!=='Verificada'; if (f==='vencidas') return m.vencida; return m.estado===f;
}

function prepararFirma(puesto){
  var cv = $('pad'), ctx = cv.getContext('2d'), dibujado = false, dib = false, last = null;
  var ratio = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * ratio; cv.height = cv.clientHeight * ratio;
  ctx.scale(ratio, ratio); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  var pos = function(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown', function(e){ dib = true; last = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', function(e){ if (!dib) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; dibujado = true; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ dib = false; }); });
  $('fLimpiar').onclick = function(e){ e.preventDefault(); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); dibujado = false; };
  $('fRut').addEventListener('input', function(){
    var v = this.value; $('rutMsg').innerHTML = v.replace(/[^0-9kK]/g,'').length<7 ? '' : rutValido(v) ? '<span class="ok">RUT válido: '+formatoRut(v)+'</span>' : '<span class="bad">RUT no válido</span>';
  });
  $('fFirmar').onclick = function(){
    var nom = $('fNom').value.trim(), rut = $('fRut').value;
    if (!nom) return toast('Escribe el nombre del trabajador/a.');
    if (!rutValido(rut)) return toast('Revisa el RUT.');
    if (!dibujado) return toast('Falta la firma.');
    if (!$('fOk').checked) return toast('Marca la declaración para continuar.');
    var png = cv.toDataURL('image/png').split(',')[1];
    busy(true,'Generando PDF firmado…');
    run('firmarInformacion', {centro:cfg.centro, empresa:cfg.empresa, puesto:puesto, trabajador:nom, rut:formatoRut(rut), firma:png}).then(function(r){
      busy(false);
      abrirSheet('<div style="text-align:center;padding:10px 4px"><div class="okbig">'+ico('ok')+'</div><h2>Firma registrada</h2>'+
        '<p class="muted">'+esc(nom)+' · '+esc(formatoRut(rut))+'<br>'+esc(puesto)+'</p>'+
        (r.url&&r.url!=='#'?'<p><a href="'+esc(r.url)+'" target="_blank">Ver PDF firmado</a></p>':'')+
        '<button class="btn" data-firmar="'+esc(puesto)+'">Firmar otro trabajador/a</button><div style="height:8px"></div>'+
        '<button class="btn ghost" style="width:100%" onclick="cerrarSheet()">Listo</button></div>');
    }).catch(function(e){ busy(false); toast(e.message); });
  };
}

/* ======================= Fotos ======================= */
function procesarFoto(file, max, png){
  max = max || 1280;
  return new Promise(function(ok,ko){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height, k = Math.min(1, max/Math.max(w,h));
        var cv = document.createElement('canvas'); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var big = png ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.72);
        var t = document.createElement('canvas'), tk = 200/Math.max(cv.width,cv.height);
        t.width = Math.round(cv.width*tk); t.height = Math.round(cv.height*tk);
        t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
        ok({mime: png?'image/png':'image/jpeg', data:big.split(',')[1], thumb:t.toDataURL('image/jpeg',0.7)});
      };
      img.onerror = function(){ ko(new Error('No se pudo leer la imagen')); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function leerEnlaceAcceso(){
  var m = location.search.match(/[?&]c=([^&#]+)/);
  if (!m) return false;
  try{
    var d = JSON.parse(deB64url(decodeURIComponent(m[1])));
    if (!d.u || !d.k) throw 0;
    var cambio = cfg.token && cfg.token!==d.k;
    cfg.apiUrl = d.u; cfg.token = d.k; save('iper_cfg', cfg);
    try{ localStorage.removeItem('iper_srv'); }catch(e){}
    SRV.usuario = null;
    history.replaceState(null, '', location.pathname);
    return cambio ? 'cambio' : 'nuevo';
